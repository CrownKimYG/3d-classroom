const frameMat = new THREE.MeshLambertMaterial({ color: '#2b2e36' });
const boardMat = new THREE.MeshBasicMaterial({ map: screenTex });                    // 스스로 빛나서 어두운 강당에서도 잘 보인다
const boardFrame = new THREE.Mesh(box, frameMat), boardTray = new THREE.Mesh(box, frameMat);
const boardBack = new THREE.Mesh(quad, boardMat);
const screen = new THREE.Mesh(quad, new THREE.MeshBasicMaterial({ map: showTex, transparent: true }));
const inkMesh = new THREE.Mesh(quad, new THREE.MeshBasicMaterial({ map: inkTex, transparent: true, depthWrite: false }));
screen.visible = false;                        // 자료를 띄웠을 때만 보인다
screen.renderOrder = 1;

/* 화면 공유를 보여 주는 판. 전에는 영상을 1초에 12번 1280×720 캔버스에 옮겨 그린 다음 그 캔버스를 그래픽 카드로 보냈다
   (화면이 멈춰 있어도, 칠판을 안 보고 있어도). 이제는
   · 영상을 캔버스를 거치지 않고 바로 그래픽 카드로 보낸다 → 공유한 화면의 원래 해상도 그대로라 글자가 더 또렷하다
   · 새 장면이 왔을 때만, 칠판이 화면에 보일 때만 보낸다 (1초에 15번까지) → 멈춘 화면 · 안 보는 화면은 부담이 없다
   자료 화면(screen)은 그 뒤에서 빈 바탕을 맡고, 이 판은 영상의 비율대로 그 위에 놓인다 */
const liveVideo = Object.assign(document.createElement('video'), { muted: true, playsInline: true });
const liveTex = new THREE.Texture(liveVideo);
liveTex.isVideoTexture = true;                 // three.js 가 영상의 실제 크기로 올리게 한다
liveTex.update = () => {};                     // 언제 다시 올릴지는 liveThink 가 정한다
liveTex.colorSpace = THREE.SRGBColorSpace;
liveTex.anisotropy = screenTex.anisotropy;     // 멀리서 · 비스듬히 봐도 글자가 뭉개지지 않게 (밉맵도 함께 만든다)
const liveMesh = new THREE.Mesh(quad, new THREE.MeshBasicMaterial({
  map: liveTex, transparent: true, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,      // 빈 바탕과 겹쳐 어른거리지 않게 살짝 앞으로
}));
liveMesh.visible = false;
liveMesh.renderOrder = 1.5;                    // 빈 바탕(1) 다음, 판서(2) 앞
const LIVE_GAP = 66;                           // 새 장면을 올리는 가장 짧은 간격(ms) = 1초에 15번 (컴퓨터가 버거워하면 8번)
const LIVE_MAX = 2.6e6;                        // 이보다 점이 많은 화면(4K 등)은 바로 올리기엔 무거워서 전처럼 줄여서 올린다
const live = {
  fresh: false, at: 0, polled: 0, w: 0, h: 0, handle: 0, seen: new THREE.Frustum(), view: new THREE.Matrix4(),
  rvfc: 'requestVideoFrameCallback' in liveVideo,          // 브라우저가 "새 장면이 왔다"고 알려 주는지
};
function fitLive() {                           // 영상의 비율을 지켜 자료 화면 자리에 맞춘다
  const k = live.w && live.h ? Math.min(BOARD.sw / live.w, BOARD.sh / live.h) : 0;
  liveMesh.scale.set(live.w * k || 1, live.h * k || 1, 1);
  liveMesh.position.set(0, BOARD.y, BOARD.z + 0.005);
}
inkMesh.renderOrder = 2;
scene.add(boardFrame, boardTray, boardBack, screen, liveMesh, inkMesh);

function placeBoard() {
  const { w, h, y, z } = BOARD;
  boardFrame.scale.set(w + 0.3, h + 0.3, 0.08);
  boardFrame.position.set(0, y, z - 0.05);
  boardTray.scale.set(w * 0.92, 0.04, 0.14);
  boardTray.position.set(0, y - h / 2 - 0.13, z + 0.02);
  boardBack.scale.set(w, h, 1);
  boardBack.position.set(0, y, z);
  screen.scale.set(BOARD.sw, BOARD.sh, 1);
  screen.position.set(0, y, z + 0.004);
  inkMesh.scale.set(w, h, 1);
  inkMesh.position.set(0, y, z + 0.008);
  fitLive();
  live.w = 0;                                    // 칠판이 바뀌었으니 다음 장면에서 바탕과 크기를 다시 맞춘다
  screenObj.boxes[0].min.set(-w / 2 - 0.15, y - h / 2 - 0.15, z - 0.09);
  screenObj.boxes[0].max.set(w / 2 + 0.15, y + h / 2 + 0.15, z);
  const iw = clamp(Math.round(w * 120), 1536, 3072), ih = Math.round(iw * h / w);     // 긴 칠판은 그만큼 촘촘하게 (1m 에 120점)
  if (ink.canvas.width !== iw || ink.canvas.height !== ih) {      // 칠판 크기가 바뀌면 판서도 새로 시작한다
    ink.canvas.width = iw;
    ink.canvas.height = ih;
    strokes.length = 0;
    strokeOf.clear();
    inkTex.dispose();
    ink.full = true;
  }
  applyBoard();
}
function applyBoard() {
  const B = BOARDS[cfg.board];
  boardMat.map = B.tex;
  if (B.tile) B.tex.repeat.set(BOARD.w / B.tile, BOARD.h / B.tile);
  frameMat.color.set(B.frame);
  boardTray.visible = inkMesh.visible = cfg.board !== 'video';     // 영상 스크린에는 받침과 판서가 없다
}

/* ── 전신 거울 (문 옆 벽) ──
   거울에 비친 모습은 강의실을 거울 뒤쪽에서 한 번 더 그려서 만든다. 그만큼 그릴 것이 늘어나므로 부하를 이렇게 줄인다:
   · 거울에서 MIRROR.far 안에 있고 거울이 화면에 보일 때만 그린다. 멀어지면 은빛 유리로만 보인다
   · 거울 속은 멀리까지 보이지 않는다. 거울에서 몇 m 너머는 은빛으로 흐려지고, 그보다 먼 것은 아예 그리지 않는다
   · 작은 그림(512×320)으로 그리고, 1초에 스무 번까지만 새로 그린다 (그리는 데 오래 걸리는 컴퓨터에서는 더 드물게)
   · 이름표는 거울 속에 그리지 않는다
   · 흐려지는 효과(안개)는 평소에도 켜 둔 채 거리만 아주 멀리 둔다. 켰다 껐다 하면 그릴 때마다 재질을 다시 살피게 되기 때문이다 */
const MIRROR = { w: 0.9, h: 1.8, near: 3.5, far: 5.5, deep: 3, end: 7 };      // near~far = 유리가 은빛으로 바뀌는 거리, deep~end = 거울 속이 흐려지는 깊이
const mirrorHaze = new THREE.Color('#b7c6d2');
const FOG_OFF = [1e5, 1e6];                      // 평소: 안개가 닿지 않는 거리
const mirrorFog = new THREE.Fog(mirrorHaze, ...FOG_OFF);
scene.fog = mirrorFog;
const mirrorRT = new THREE.WebGLRenderTarget(512, 320);
const mirrorCam = new THREE.PerspectiveCamera();
const mirrorMat = keep(new THREE.ShaderMaterial({
  uniforms: { map: { value: mirrorRT.texture }, texMat: { value: new THREE.Matrix4() }, haze: { value: mirrorHaze }, fade: { value: 1 } },
  vertexShader: `
    uniform mat4 texMat;
    varying vec4 vAt;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      vAt = texMat * vec4(position, 1.0);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D map;
    uniform vec3 haze;
    uniform float fade;
    varying vec4 vAt;
    varying vec2 vUv;
    void main() {
      vec3 seen = texture2DProj(map, vAt).rgb * vec3(0.94, 0.97, 0.99);
      vec3 glass = mix(seen, haze, fade);
      // 유리의 반짝임: 왼쪽 위에 흰 대각선 두 줄 (굵은 것 · 가는 것). 도트 그림처럼 2cm 계단으로 끊는다
      vec2 p = floor(vUv * vec2(45.0, 90.0)) * 0.02;        // 유리 위의 위치 (m)
      float across = p.x - p.y, along = p.x + p.y;
      float glint = step(-1.40, across) * step(across, -1.31) * step(1.40, along) * step(along, 2.02)
                  + step(-1.25, across) * step(across, -1.21) * step(1.52, along) * step(along, 1.92);
      // 유리 가장자리: 깎은 모서리가 빛나는 것처럼 흰 테 한 줄과 그 안쪽의 옅은 한 줄
      vec2 inset = min(p, vec2(0.88, 1.78) - p);
      float edge = min(inset.x, inset.y);
      float rim = step(edge, 0.005) * 0.7 + step(0.015, edge) * step(edge, 0.025) * 0.25;
      gl_FragColor = vec4(mix(glass, vec3(1.0), max(0.6 * min(glint, 1.0), rim)), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
const mirrorFrameMat = keep(new THREE.MeshLambertMaterial({ color: '#6b4a2b' }));
const mirrorGlass = new THREE.Mesh(quad, mirrorMat);
mirrorGlass.scale.set(MIRROR.w, MIRROR.h, 1);
mirrorGlass.rotation.y = -Math.PI / 2;           // 오른쪽 벽에 걸려 강의실 안쪽을 본다
mirrorGlass.visible = false;
scene.add(mirrorGlass);
const mirrorBox = new THREE.Box3();
let mirrorCalls = 0;                             // 거울을 그리느라 늘어난 그리기 호출 수
let mirrorAt = -1e9, mirrorMs = 0.5, mirrorStale = false;      // 마지막으로 그린 때 · 그리는 데 걸린 시간(평균) · 새로 그릴 것이 밀려 있는지
const mirrorEvery = () => clamp(mirrorMs * 8, 50, 200);      // 거울을 새로 그리는 간격(ms): 걸린 시간의 8배, 곧 전체의 1/8 까지만 쓴다
{
  const N = new THREE.Vector3(), P = new THREE.Vector3(), C = new THREE.Vector3(), V = new THREE.Vector3(), T = new THREE.Vector3();
  const rot = new THREE.Matrix4(), view = new THREE.Matrix4(), frustum = new THREE.Frustum(), plane = new THREE.Plane();
  const clip = new THREE.Vector4(), q = new THREE.Vector4();
  // 화면을 그리기 바로 전에 부른다: 거울이 가까이 보이면 거울 속 모습을 새로 그린다
  var mirrorThink = (now) => {
    if (!mirrorGlass.visible) { mirrorCalls = 0; mirrorStale = false; return; }
    camera.updateMatrixWorld();
    P.setFromMatrixPosition(mirrorGlass.matrixWorld);
    C.setFromMatrixPosition(camera.matrixWorld);
    N.set(0, 0, 1).applyMatrix4(rot.extractRotation(mirrorGlass.matrixWorld));
    V.subVectors(P, C);
    const gap = -V.dot(N), dist = V.length();    // gap = 거울 면에서 카메라까지의 거리 (앞쪽이면 +)
    const fade = gap > 0.01 ? clamp((dist - MIRROR.near) / (MIRROR.far - MIRROR.near), 0, 1) : 1;
    mirrorMat.uniforms.fade.value = fade;
    if (fade >= 1 || !frustum.setFromProjectionMatrix(view.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse)).intersectsBox(mirrorBox)) {
      mirrorCalls = 0;
      mirrorStale = false;
      return;
    }
    if (now - mirrorAt < mirrorEvery()) { mirrorStale = true; return; }      // 방금 그렸으면 그 그림을 조금 더 쓴다
    const began = performance.now();

    // 거울 뒤쪽의 카메라: 내 카메라를 거울 면에 대칭으로 옮긴 것
    rot.extractRotation(camera.matrixWorld);
    mirrorCam.position.copy(V).reflect(N).negate().add(P);
    T.set(0, 0, -1).applyMatrix4(rot).add(C);
    T.subVectors(P, T).reflect(N).negate().add(P);
    mirrorCam.up.set(0, 1, 0).applyMatrix4(rot).reflect(N);
    mirrorCam.lookAt(T);
    mirrorCam.fov = camera.fov;
    mirrorCam.aspect = camera.aspect;
    mirrorCam.near = camera.near;
    mirrorCam.far = gap + MIRROR.end + 0.3;      // 거울 속에서 흐려진 곳 너머는 그리지 않는다
    mirrorCam.updateProjectionMatrix();
    mirrorCam.updateMatrixWorld();
    mirrorMat.uniforms.texMat.value.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1)
      .multiply(mirrorCam.projectionMatrix).multiply(mirrorCam.matrixWorldInverse).multiply(mirrorGlass.matrixWorld);
    // 거울 면보다 뒤(벽 속)에 있는 것은 잘라 낸다
    plane.setFromNormalAndCoplanarPoint(N, P).applyMatrix4(mirrorCam.matrixWorldInverse);
    clip.set(plane.normal.x, plane.normal.y, plane.normal.z, plane.constant);
    const e = mirrorCam.projectionMatrix.elements;
    q.set((Math.sign(clip.x) + e[8]) / e[0], (Math.sign(clip.y) + e[9]) / e[5], -1, (1 + e[10]) / e[14]);
    clip.multiplyScalar(2 / clip.dot(q));
    e[2] = clip.x;
    e[6] = clip.y;
    e[10] = clip.z + 1 - 0.003;
    e[14] = clip.w;

    // 거울 속에서는 내 머리도 보이고, 손에 든 리모컨(내 눈앞에만 있는 것)은 보이지 않는다
    const head = player.model.head, headWas = head.visible, heldWas = held.visible, bg = scene.background;
    head.visible = true;
    held.visible = false;
    mirrorGlass.visible = false;
    mirrorFog.near = gap + MIRROR.deep;
    mirrorFog.far = gap + MIRROR.end;
    scene.background = mirrorHaze;
    renderer.setRenderTarget(mirrorRT);
    renderer.render(scene, mirrorCam);
    renderer.setRenderTarget(null);
    mirrorCalls = renderer.info.render.calls;
    mirrorFog.near = FOG_OFF[0];
    mirrorFog.far = FOG_OFF[1];
    scene.background = bg;
    head.visible = headWas;
    held.visible = heldWas;
    mirrorGlass.visible = true;
    mirrorAt = now;
    mirrorStale = false;
    mirrorMs += (Math.min(performance.now() - began, 25) - mirrorMs) * 0.2;       // (처음 그릴 때는 준비하느라 오래 걸리므로 25ms 까지만 센다)
  };
}

/* ── 칠판 크기: 작게 · 보통 · 넓게 · 길게 (강의실마다 그 강의실에 맞는 크기로 정해진다) ── */
const BSIZES = { s: { name: '작게' }, m: { name: '보통' }, l: { name: '넓게' }, x: { name: '길게', note: '벽 끝까지' } };
function boardSize(F) {
  const [w, h, low] = F.board, y = low + h / 2, wide = h * 16 / 9, max = F.w - 1.6;
  if (cfg.size === 's') {            // 보통이 16:9 면 그 70%, 보통이 긴 칠판이면 16:9 로
    const k = w > wide + 0.1 ? 1 : 0.7;
    return [wide * k, h * k, y - h / 2 + h * k / 2];
  }
  if (cfg.size === 'l') return [(w + max) / 2, h, y];
  if (cfg.size === 'x') return [max, h, y];
  return [w, h, y];
}
const DAIS = { d: 2.0, tread: 0.3 };     // 칠판 아래 단상: 깊이 · 계단 한 단의 깊이

/* ── 강의실을 지금 설정대로 새로 짓는다 ── */
function buildRoom() {
  clearRoom();
  roomGroup = new THREE.Group();
  scene.add(roomGroup);
  const F = FORMS[cfg.form], L = LOOKS[F.look], unit = L.floor[1];
  ROOM = F;
  HW = F.w / 2;
  HD = F.d / 2;
  obstacles.length = 0;
  seats.length = 0;

  // 바닥 높이: 강의실의 바닥 + 교탁 뒤의 낮은 단상 (단상도 바닥의 일부라서 걸어서 올라설 수 있다)
  const ground = F.floorAt || flatFloor;
  floorAt = ground;                  // 단상은 칠판 높이를 정한 뒤에 얹는다

  // 분위기: 무늬 · 색 · 조명
  floorMat.map = L.floor[0];
  wallMat.map = L.wall;
  ceilMat.color.set(L.ceil);
  panelMat.color.set(L.panels);
  chairMat.map = L.chair[0];
  chairMat.color.set(L.chair[1]);
  deskMat.map = L.desk[0];
  deskMat.color.set(L.desk[1]);
  metalMat.color.set(L.metal);
  hemi.color.set(L.sky);
  hemi.groundColor.set(L.ground);
  hemi.intensity = L.hemi;
  sun.intensity = L.sun;
  scene.background.set(L.bg);

  // 자리: 책상 · 의자 · 테이블을 종류별로 모아 두었다가 한꺼번에 그린다
  const P = { desk: [], round: [], chair: [], metal: [], shadow: [] };
  if (F.fixed) F.fixed(P, unit);
  else if (cfg.table === 'solo') for (const z of F.solo.rows) for (const x of F.solo.cols) { if (!F.solo.skip?.(x, z)) soloDesk(P, x, 0, z); }
  else {
    const T = TABLES[cfg.table];
    for (const c of fit(F.area, T, F.cap)) T.put(P, c.x, c.z);
  }
  ARM_SIT = F.fixed ? -0.45 : -1.25;

  // 칠판: 크기와 높이는 강의실마다 정해져 있다 (자리 배치와는 상관없다). 천장은 칠판 위로 여유가 있게 맞춘다
  const [bw, bh, by] = boardSize(F);
  const bottom = Math.round((by - bh / 2) * 100) / 100;
  const H = Math.max(F.h, bottom + bh + (F.curtains ? 1.5 : 0.55));

  // 칠판 아래 단상(교단): 방 앞쪽을 벽에서 벽까지 가로지른다. 올라서면 칠판 아래쪽이 가슴께에 온다.
  // 한 걸음에 오르기엔 높으면 앞쪽에 계단을 둔다. 교탁은 단상 위 오른쪽 끝에 놓는다.
  // 단상이 없는 강의실에서는 교탁 뒤에 낮은 발판을 따로 둔다
  const daisH = F.dais || 0;
  const steps = Math.ceil(daisH / 0.3), stepH = steps ? daisH / steps : 0, edge = -HD + DAIS.d;
  const [lx, lz] = F.dais ? [HW - 1.3, -HD + 1.5] : F.lectern || [HW - 1.8, -HD + 2.1];
  const ly = F.dais ? daisH : ground(lx, lz), pod = F.dais ? 0 : 0.14;
  TEACH_Z = -HD + (daisH ? DAIS.d + (steps - 1) * DAIS.tread + 0.45 : 3.0);
  floorAt = (x, z) => {
    if (daisH && z < edge + (steps - 1) * DAIS.tread) return z < edge ? daisH : daisH - Math.ceil((z - edge) / DAIS.tread) * stepH;
    return pod && Math.abs(x - lx) < 0.65 && z > lz - 1.25 && z < lz - 0.4 ? ly + pod : ground(x, z);
  };
  BOARD.w = bw;
  BOARD.h = bh;
  BOARD.y = bottom + bh / 2;
  BOARD.z = -HD + 0.09;
  BOARD.sh = bh;
  BOARD.sw = Math.min(bw, bh * 16 / 9);
  placeBoard();

  // 바닥 · 천장 · 벽 넷
  slab(-HW, HW, -HD, HD, 0, floorMat, unit);
  const ceiling = new THREE.Mesh(quad, ceilMat);
  ceiling.scale.set(F.w, F.d, 1);
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = H;
  addStatic(ceiling);
  ceilTex.repeat.set(F.w / 2, F.d / 2);
  wallPiece(F.w, H, 0, 0, -HD, 0);                  // 앞 벽 (칠판)
  wallPiece(F.w, H, 0, 0, HD, Math.PI);             // 뒤 벽
  wallPiece(F.d, H, -HW, 0, 0, Math.PI / 2);        // 왼쪽 벽 (창문)
  wallPiece(F.d, H, HW, 0, 0, -Math.PI / 2);        // 오른쪽 벽 (문)

  // 천장 조명판 → 그리기 호출 1번
  const lightX = F.w > 20 ? [-0.41, -0.246, -0.082, 0.082, 0.246, 0.41] : F.w > 14 ? [-0.36, -0.12, 0.12, 0.36] : [-0.233, 0.233];
  const lightN = Math.max(2, Math.round(F.d / 5.3));
  const panels = [];
  for (let j = 0; j < lightN; j++) for (const k of lightX) {
    panels.push({ p: [k * F.w, H - 0.01, (j - (lightN - 1) / 2) * F.d / lightN * 0.94], r: [Math.PI / 2, 0, 0], s: [2.0, 0.6, 1] });
  }
  instanced(quad, panelMat, panels);

  // 창문 + 창턱 + 바닥 햇빛
  if (L.windows && F.win) {
    instanced(quad, windowMat, F.win.map((z) => ({ p: [-HW + 0.02, 2.45, z], r: [0, Math.PI / 2, 0], s: [2.6, 1.9, 1] })));
    instanced(box, sillMat, F.win.map((z) => ({ p: [-HW + 0.09, 1.47, z], s: [0.18, 0.07, 2.8] })));
    instanced(quad, sunMat, F.win.map((z) => ({ p: [-HW + 0.95, 0.01, z + 0.35], r: FLAT, s: [1.5, 2.3, 1] })));
  }

  // 단상의 윗면과 계단
  if (daisH) {
    slab(-HW, HW, -HD, edge, daisH, woodMat, 1.5);
    for (let i = 0; i < steps; i++) {
      const z = edge + i * DAIS.tread, y = daisH - i * stepH;
      riser(-HW, HW, z, y - stepH, y);
      if (i < steps - 1) slab(-HW, HW, z, z + DAIS.tread, y - stepH, woodMat, 1.5);
    }
  }

  // 칠판 옆: 벽시계 (자리가 있을 때) 또는 커튼 (강당)
  const beside = HW - BOARD.w / 2 - 0.15;
  if (F.curtains) {
    if (beside > 0.4) for (const side of [-1, 1]) {
      const m = new THREE.Mesh(strip(beside - 0.05, H, Math.max(1, Math.round(beside * 1.4)), 1), curtainMat);
      m.position.set(side * (HW - (beside - 0.05) / 2), H / 2, -HD + 0.025);
      addStatic(m);
    }
    const valance = new THREE.Mesh(quad, valanceMat);
    valance.scale.set(F.w, 1.0, 1);
    valance.position.set(0, H - 0.5, -HD + 0.035);
    addStatic(valance);
  } else if (beside >= 1.1) {
    const clock = new THREE.Mesh(quad, clockMat);
    clock.scale.set(0.8, 0.8, 1);
    clock.position.set(HW - beside / 2, BOARD.y + BOARD.h / 2 - 0.45, -HD + 0.03);
    addStatic(clock);
  }

  // 문 · 게시판
  DOOR.z = F.doorZ;
  DOOR.y = floorAt(HW - 0.5, DOOR.z);
  const door = new THREE.Mesh(quad, doorMat);
  door.scale.set(DOOR.w, DOOR.h, 1);
  door.position.set(HW - 0.02, DOOR.y + DOOR.h / 2, DOOR.z);
  door.rotation.y = -Math.PI / 2;
  addStatic(door);
  const exitSign = new THREE.Mesh(quad, signMat);
  exitSign.scale.set(0.9, 0.34, 1);
  exitSign.position.set(HW - 0.02, DOOR.y + DOOR.h + 0.3, DOOR.z);
  exitSign.rotation.y = -Math.PI / 2;
  addStatic(exitSign);
  doorObj.boxes[0].min.set(HW - 0.06, DOOR.y, DOOR.z - DOOR.w / 2);
  doorObj.boxes[0].max.set(HW - 0.01, DOOR.y + DOOR.h, DOOR.z + DOOR.w / 2);
  // 문 옆 벽의 전신 거울: 문에서 칠판 쪽으로 (자리가 마땅치 않으면 반대쪽), 바닥이 문 앞과 같은 높이인 곳에 건다
  mirrorGlass.visible = false;
  for (const side of [-1, 1]) {
    const mz = DOOR.z + side * (DOOR.w / 2 + 0.4 + MIRROR.w / 2), my = DOOR.y + 0.14 + MIRROR.h / 2;
    const level = (z) => Math.abs(floorAt(HW - 0.4, z) - DOOR.y) < 0.02;
    if (Math.abs(mz) + MIRROR.w / 2 > HD - 0.3 || !level(mz - MIRROR.w / 2) || !level(mz + MIRROR.w / 2)) continue;
    const frame = new THREE.Mesh(box, mirrorFrameMat);
    frame.scale.set(0.05, MIRROR.h + 0.14, MIRROR.w + 0.14);
    frame.position.set(HW - 0.035, my, mz);
    addStatic(frame);
    mirrorGlass.position.set(HW - 0.065, my, mz);
    mirrorGlass.updateMatrixWorld();
    mirrorBox.setFromCenterAndSize(mirrorGlass.position, new THREE.Vector3(0.02, MIRROR.h, MIRROR.w));
    mirrorGlass.visible = true;
    break;
  }
  if (F.cork) {
    const cork = new THREE.Mesh(quad, corkMat);
    cork.scale.set(F.cork[2], F.cork[3], 1);
    cork.position.set(F.cork[0], F.cork[1], HD - 0.02);
    cork.rotation.y = Math.PI;
    addStatic(cork);
  }

  // 교탁. 교탁을 바라보고 X 를 누르면 그 뒤에 서서 강의실을 마주 본다 (자리에 앉는 것과 같은 방식)
  solid(lx, ly + 0.4, lz, 0.9, 0.8, 0.55, lecternMat);
  const lecternTop = new THREE.Mesh(box, lecternTopMat);
  lecternTop.scale.set(1.06, 0.06, 0.72);
  lecternTop.position.set(lx, ly + 0.84, lz);
  lecternTop.rotation.x = -0.13;                    // 선생님 쪽으로 살짝 기울인 윗판
  addStatic(lecternTop);
  if (pod) solid(lx, ly + pod / 2, lz - 0.825, 1.3, pod, 0.85, lecternTopMat);     // 교탁 뒤 발판
  obstacles.push({ x0: lx - 0.53, x1: lx + 0.53, z0: lz - 0.36, z1: lz + 0.36 });
  P.shadow.push({ p: [lx, ly + 0.012, lz - 0.3], r: FLAT, s: [1.9, 2.0, 1] });
  const sz = lz - 0.8, sy = ly + pod;
  seats.push({
    kind: 'seat', stand: true, x: lx, y: sy, z: sz, yaw: 0, g: null, reach: 0, level: ly,
    sit: { x: lx, z: sz },
    cand: [{ x: lx - 0.95, z: sz }, { x: lx + 0.95, z: sz }, { x: lx, z: lz - 1.5 }],
    sides: [], chairBox: null,
    boxes: [boxOf(lx - 0.53, lx + 0.53, ly, ly + 0.9, lz - 0.36, lz + 0.36), boxOf(lx - 0.65, lx + 0.65, ly, sy + 0.02, lz - 1.25, lz - 0.4)],
    body: boxOf(lx - 0.36, lx + 0.36, sy, sy + 1.4, sz - 0.3, sz + 0.3),
    near: [], taken: null, whisper: null,
  });

  instanced(quad, shadowMat, P.shadow);
  if (P.desk.length) instanced(box, deskMat, P.desk);
  if (P.round.length) instanced(cyl, deskMat, P.round);
  instanced(box, chairMat, P.chair);
  instanced(box, metalMat, P.metal);

  // 길찾기 칸을 새로 만들고, 자리마다 설 곳과 이웃 자리를 정한다
  buildNav();
  for (const s of seats) {
    const level = s.stand ? s.level : s.y;
    const ok = s.cand.filter((c) => !blocked[cellAt(c.x, c.z)] && Math.abs(floorAt(c.x, c.z) - level) < 0.05);
    s.sides = ok.length ? ok : s.cand;
  }
  for (const a of seats) for (const b of seats) {
    if (a === b || a.stand || b.stand || Math.abs(a.y - b.y) > 0.5) continue;
    const dx = Math.abs(a.x - b.x), dz = Math.abs(a.z - b.z), d = Math.hypot(dx, dz);
    // 같은 테이블이면 옆과 맞은편, 아니면 바로 옆과 바로 앞 · 뒤 (통로 건너편은 아니다)
    if (a.g && a.g === b.g ? d < 1.95 : d < Math.min(a.reach, b.reach) || (dx < 0.3 && dz < 1.9)) a.near.push(b);
  }
  interactables = [...seats, doorObj];
}
const seatCount = () => seats.filter((s) => !s.stand).length;       // 교탁 자리를 뺀 자리 수

// 바라본 물체에 뜨는 검은 테두리 (마인크래프트 방식)
// 선은 굵기 없이 화면 1픽셀로 그린다 (상자 2개 × 모서리 12개 × 양 끝점 2개까지)
const outlinePos = new THREE.BufferAttribute(new Float32Array(2 * 12 * 2 * 3), 3);
const outlineGeo = new THREE.BufferGeometry();
outlineGeo.setAttribute('position', outlinePos);
outlineGeo.setDrawRange(0, 0);
const outline = new THREE.LineSegments(outlineGeo, new THREE.LineBasicMaterial({ color: '#141210' }));
outline.frustumCulled = false;
outline.matrixAutoUpdate = false;
scene.add(outline);

function showOutline(boxes) {
  let n = 0;
  const line = (ax, ay, az, bx, by, bz) => {
    outlinePos.setXYZ(n++, ax, ay, az);
    outlinePos.setXYZ(n++, bx, by, bz);
  };
  for (const b of boxes) {
    const x0 = b.min.x - 0.01, x1 = b.max.x + 0.01, y0 = b.min.y + 0.004, y1 = b.max.y + 0.01;
    const z0 = b.min.z - 0.01, z1 = b.max.z + 0.01;
    for (const y of [y0, y1]) for (const z of [z0, z1]) line(x0, y, z, x1, y, z);
    for (const x of [x0, x1]) for (const z of [z0, z1]) line(x, y0, z, x, y1, z);
    for (const x of [x0, x1]) for (const y of [y0, y1]) line(x, y, z0, x, y, z1);
  }
  outlinePos.needsUpdate = true;
  outlineGeo.setDrawRange(0, n);
}

/* ───────────── 충돌: 벽 + 책상·의자·교탁 ───────────── */
const BODY_R = 0.2, WALL_PAD = 0.36;
const STEP_UP = 0.36;                // 이보다 높은 턱(무대 앞 · 2층 벽)은 걸어서 못 올라간다
// 몸 둘레에서 가장 높은 바닥 (높은 턱에 몸이 파묻히지 않게, 턱 앞에서 멈출 때 쓴다)
const floorNear = (x, z) => Math.max(floorAt(x + 0.16, z), floorAt(x - 0.16, z), floorAt(x, z + 0.16), floorAt(x, z - 0.16));
function collide(p) {
  for (const o of obstacles) {
    const cx = clamp(p.x, o.x0, o.x1), cz = clamp(p.z, o.z0, o.z1);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= BODY_R * BODY_R) continue;
    if (d2 > 1e-8) {                 // 모서리·옆면에 닿음 → 닿은 방향으로 밀어낸다
      const d = Math.sqrt(d2);
      p.x = cx + dx / d * BODY_R;
      p.z = cz + dz / d * BODY_R;
    } else {                         // 완전히 안에 들어옴 → 가장 가까운 면으로 내보낸다
      const l = p.x - o.x0, r = o.x1 - p.x, f = p.z - o.z0, b = o.z1 - p.z, m = Math.min(l, r, f, b);
      if (m === l) p.x = o.x0 - BODY_R;
      else if (m === r) p.x = o.x1 + BODY_R;
      else if (m === f) p.z = o.z0 - BODY_R;
      else p.z = o.z1 + BODY_R;
    }
  }
  p.x = clamp(p.x, -HW + WALL_PAD, HW - WALL_PAD);
  p.z = clamp(p.z, -HD + WALL_PAD, HD - WALL_PAD);
}

/* ───────────── 길찾기: 바닥을 10cm 칸으로 나눠 책상을 피해 가는 길을 찾는다 (A*) ───────────── */
const CELL = 0.1, NAV_R = 0.22;
let NX = 0, NZ = 0, NCELL = 0;
let blocked, cellH, gScore, cameFrom, closed;       // 칸마다: 막혔는지 · 바닥 높이 · (길찾기용) 거리 · 온 곳 · 살펴봤는지
const cellX = (i) => -HW + (i % NX + 0.5) * CELL;
const cellZ = (i) => -HD + ((i / NX | 0) + 0.5) * CELL;
const cellAt = (x, z) =>
  clamp(Math.floor((z + HD) / CELL), 0, NZ - 1) * NX + clamp(Math.floor((x + HW) / CELL), 0, NX - 1);
function buildNav() {                // 강의실을 새로 지을 때마다 다시 만든다
  NX = Math.round(ROOM.w / CELL);
  NZ = Math.round(ROOM.d / CELL);
  NCELL = NX * NZ;
  blocked = new Uint8Array(NCELL);
  cellH = new Float32Array(NCELL);
  gScore = new Float32Array(NCELL);
  cameFrom = new Int32Array(NCELL);
  closed = new Uint8Array(NCELL);
  for (let i = 0; i < NCELL; i++) {
    const x = cellX(i), z = cellZ(i);
    cellH[i] = floorAt(x, z);
    if (Math.abs(x) > HW - WALL_PAD || Math.abs(z) > HD - WALL_PAD) blocked[i] = 1;
  }
  for (const o of obstacles) {       // 장애물마다 그 둘레의 칸만 살펴본다
    const i0 = clamp(Math.floor((o.x0 - NAV_R + HW) / CELL), 0, NX - 1), i1 = clamp(Math.floor((o.x1 + NAV_R + HW) / CELL), 0, NX - 1);
    const j0 = clamp(Math.floor((o.z0 - NAV_R + HD) / CELL), 0, NZ - 1), j1 = clamp(Math.floor((o.z1 + NAV_R + HD) / CELL), 0, NZ - 1);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const x = -HW + (i + 0.5) * CELL, z = -HD + (j + 0.5) * CELL;
      const dx = x - clamp(x, o.x0, o.x1), dz = z - clamp(z, o.z0, o.z1);
      if (dx * dx + dz * dz < NAV_R * NAV_R) blocked[j * NX + i] = 1;
    }
  }
}

buildRoom();

// 막힌 칸을 골랐을 때 가장 가까운 빈 칸으로 바꿔 준다
function nearestFree(x, z) {
  const c = cellAt(x, z);
  if (!blocked[c]) return c;
  const cx = c % NX, cz = c / NX | 0;
  for (let r = 1; r <= 14; r++) {
    let best = -1, bestD = Infinity;
    for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
      const nx = cx + dx, nz = cz + dz;
      if (nx < 0 || nz < 0 || nx >= NX || nz >= NZ || blocked[nz * NX + nx]) continue;
      const d = dx * dx + dz * dz;
      if (d < bestD) { bestD = d; best = nz * NX + nx; }
    }
    if (best >= 0) return best;
  }
  return -1;
}

// 두 점 사이를 똑바로 걸어갈 수 있는지
function clearLine(ax, az, bx, bz) {
  const n = Math.ceil(Math.hypot(bx - ax, bz - az) / 0.04);
  let h = cellH[cellAt(ax, az)];
  for (let i = 1; i <= n; i++) {
    const t = i / n, c = cellAt(ax + (bx - ax) * t, az + (bz - az) * t);
    if (blocked[c] || Math.abs(cellH[c] - h) > STEP_UP) return false;
    h = cellH[c];
  }
  return true;
}

const heapN = [], heapF = [];        // 다음에 살펴볼 칸들 (가까운 순서로 꺼내는 힙)
function heapPush(n, f) {
  let c = heapN.length;
  heapN.push(n); heapF.push(f);
  while (c > 0) {
    const p = (c - 1) >> 1;
    if (heapF[p] <= heapF[c]) break;
    [heapN[p], heapN[c]] = [heapN[c], heapN[p]];
    [heapF[p], heapF[c]] = [heapF[c], heapF[p]];
    c = p;
  }
}
function heapPop() {
  const top = heapN[0], n = heapN.pop(), f = heapF.pop();
  if (heapN.length) {
    heapN[0] = n; heapF[0] = f;
    let p = 0;
    for (;;) {
      const l = p * 2 + 1, r = l + 1;
      let m = p;
      if (l < heapN.length && heapF[l] < heapF[m]) m = l;
      if (r < heapN.length && heapF[r] < heapF[m]) m = r;
      if (m === p) break;
      [heapN[p], heapN[m]] = [heapN[m], heapN[p]];
      [heapF[p], heapF[m]] = [heapF[m], heapF[p]];
      p = m;
    }
  }
  return top;
}
const NB_X = [1, -1, 0, 0, 1, 1, -1, -1], NB_Z = [0, 0, 1, -1, 1, -1, 1, -1];

// (sx,sz) → (tx,tz) 로 가는 길을 점 목록으로 돌려준다. 길이 없으면 null
function findPath(sx, sz, tx, tz) {
  const start = nearestFree(sx, sz), goal = nearestFree(tx, tz);
  if (start < 0 || goal < 0) return null;
  const gx = goal % NX, gz = goal / NX | 0;
  const guess = (i) => {
    const dx = Math.abs(i % NX - gx), dz = Math.abs((i / NX | 0) - gz);
    return Math.max(dx, dz) + 0.4142 * Math.min(dx, dz);
  };
  gScore.fill(Infinity);
  closed.fill(0);
  heapN.length = heapF.length = 0;
  gScore[start] = 0;
  heapPush(start, guess(start));
  while (heapN.length) {
    const cur = heapPop();
    if (cur === goal) break;
    if (closed[cur]) continue;
    closed[cur] = 1;
    const cx = cur % NX, cz = cur / NX | 0;
    for (let k = 0; k < 8; k++) {
      const nx = cx + NB_X[k], nz = cz + NB_Z[k];
      if (nx < 0 || nz < 0 || nx >= NX || nz >= NZ) continue;
      const n = nz * NX + nx;
      if (blocked[n] || closed[n] || Math.abs(cellH[n] - cellH[cur]) > STEP_UP) continue;     // 막힌 칸 · 너무 높은 턱
      if (k >= 4 && (blocked[cz * NX + nx] || blocked[nz * NX + cx])) continue;   // 모서리를 비스듬히 스치지 않기
      const g = gScore[cur] + (k >= 4 ? 1.4142 : 1);
      if (g < gScore[n]) {
        gScore[n] = g;
        cameFrom[n] = cur;
        heapPush(n, g + guess(n));
      }
    }
  }
  if (gScore[goal] === Infinity) return null;

  const pts = [];
  for (let c = goal; c !== start; c = cameFrom[c]) pts.push({ x: cellX(c), z: cellZ(c) });
  pts.push({ x: cellX(start), z: cellZ(start) });
  pts.reverse();
  if (cellAt(tx, tz) === goal) pts[pts.length - 1] = { x: tx, z: tz };

  // 계단 모양 길을 곧게 편다: 똑바로 갈 수 있는 가장 먼 점만 남긴다
  const out = [];
  let ax = sx, az = sz, i = 0;
  while (i < pts.length) {
    let j = i;
    while (j + 1 < pts.length && clearLine(ax, az, pts[j + 1].x, pts[j + 1].z)) j++;
    out.push(pts[j]);
    ax = pts[j].x;
    az = pts[j].z;
    i = j + 1;
  }
  out.cost = gScore[goal];
  return out;
}

/* ───────────── 아바타 (머리가 작은 블록 캐릭터. 치수는 맨 위 설정의 AV) ───────────── */
const EYE_FWD = 0.1;                            // 1인칭 카메라를 얼굴 쪽으로 살짝 내민다
const HEAD_TURN = 1.3;                          // 몸통 기준으로 고개가 돌아가는 한계 (약 75°)
const SEAT_LOOK = 2.9;                          // 앉아서 둘러볼 수 있는 범위 (뒷자리 친구까지 돌아볼 수 있게 약 165°)

// 팔 · 다리 한 짝의 여섯 면이 스킨의 어디에 있는지. (x, y) = 그 부위 칸의 왼쪽 위, w = 앞면의 폭(점)
const limbUV = (x, y, w = 4) => ({
  nx: [x, y + 4, 4, 12], pz: [x + 4, y + 4, w, 12], px: [x + 4 + w, y + 4, 4, 12], nz: [x + 8 + w, y + 4, w, 12],
  py: [x + 4, y, w, 4], ny: [x + 4 + w, y, w, 4],
});
// 팔 도형 [왼팔, 오른팔]. 어깨 관절(위에서 2점 아래)을 축으로 흔들리도록 아래로 내려 둔다
function armGeos(slim) {
  const U = AV.u, w = slim ? 3 : 4;
  return [limbUV(32, 48, w), limbUV(40, 16, w)].map((uv) => atlasBox(w * U, 12 * U, 4 * U, uv).translate(0, -4 * U, 0));
}
const armX = (slim) => (slim ? 5.5 : 6) * AV.u;     // 팔의 가운데가 몸 가운데에서 떨어진 거리

// 몸 조각의 도형 (부를 때마다 새로 만든다). 관절을 축으로 움직이도록 머리는 위로, 다리는 아래로 옮겨 둔다
const AVATAR_GEO = {
  head: () => atlasBox(AV.head, AV.head, AV.head, {
    nx: [0, 8, 8, 8], pz: [8, 8, 8, 8], px: [16, 8, 8, 8], nz: [24, 8, 8, 8], py: [8, 0, 8, 8], ny: [16, 0, 8, 8],
  }).translate(0, AV.head / 2, 0),
  body: () => atlasBox(8 * AV.u, AV.body, 4 * AV.u, {
    nx: [16, 20, 4, 12], pz: [20, 20, 8, 12], px: [28, 20, 4, 12], nz: [32, 20, 8, 12], py: [20, 16, 8, 4], ny: [28, 16, 8, 4],
  }),
  legL: () => atlasBox(4 * AV.u, AV.leg, 4 * AV.u, limbUV(16, 48)).translate(0, -AV.leg / 2, 0),
  legR: () => atlasBox(4 * AV.u, AV.leg, 4 * AV.u, limbUV(0, 16)).translate(0, -AV.leg / 2, 0),
  lids: () => {                      // 눈 깜빡임용 덮개
    const geo = new THREE.PlaneGeometry(AV.head, AV.head);
    setFaceUV(geo, 0, [56, 16, 8, 8]);
    return geo;
  },
};
// 머리 위 이름표 그림 (256×64 를 k 배로, 캔버스의 (x, y) 에)
function drawTag(g, name, x = 0, y = 0, k = 1) {
  g.save();
  g.translate(x, y);
  g.scale(k, k);
  g.clearRect(0, 0, 256, 64);
  g.font = `800 30px ${UI_FONT}`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  const w = Math.min(244, g.measureText(name).width + 40);
  g.fillStyle = 'rgba(51, 36, 26, .82)';
  g.fillRect(128 - w / 2, 10, w, 44);
  g.fillStyle = '#fff6e3';
  g.fillText(name, 128, 33, 220);
  g.restore();
}

/* ───────────── 다른 사람들의 캐릭터: 모두 모아서 한 번에 그린다 ─────────────
   한 명씩 따로 그리면 몸 여섯 조각 + 이름표 + 그림자로 그리기 호출이 여덟 번씩 든다 (100명이면 800번).
   그래서 같은 조각끼리(머리끼리, 몸통끼리 …) 한 묶음으로 그린다 (InstancedMesh). 사람이 몇 명이든 호출 수는 그대로다.
   · 스킨은 큰 그림 한 장(16×16칸)에 모아 두고, 사람마다 자기 칸을 쓴다
   · 이름표도 큰 그림 한 장(8×32칸)에 모아 두고, 늘 화면을 보도록 세워 그린다
   · 캐릭터마다 뼈대(보이지 않는 틀)만 따로 가지고, 그릴 때 뼈대의 자리를 읽어 온다
   내 캐릭터와 소개 화면의 캐릭터는 따로 그린다 (머리 숨기기 · 반투명처럼 혼자만의 처리가 있어서) */
const CROWD_MAX = 320;               // 한 번에 그릴 수 있는 사람 수
const crowd = (() => {
  // 스킨 모음: 64×64 스킨을 16×16칸에
  const skinCanvas = Object.assign(document.createElement('canvas'), { width: 1024, height: 1024 });
  const skinCtx = skinCanvas.getContext('2d');
  const skinTex = new THREE.CanvasTexture(skinCanvas);
  skinTex.colorSpace = THREE.SRGBColorSpace;
  skinTex.magFilter = skinTex.minFilter = THREE.NearestFilter;
  skinTex.generateMipmaps = false;
  const skinSlots = new Map(), skinFree = Array.from({ length: 256 }, (_, n) => 255 - n);
  const skinSlot = (skin) => {
    let slot = skinSlots.get(skin);
    if (slot === undefined) {
      if (!skinFree.length) return 0;
      slot = skinFree.pop();
      skinSlots.set(skin, slot);
      const x = (slot % 16) * 64, y = (slot >> 4) * 64;
      skinCtx.clearRect(x, y, 64, 64);
      skinCtx.drawImage(skin.canvas, x, y);
      skinTex.needsUpdate = true;
    }
    return slot;
  };
  const freeSkin = (skin) => {
    const slot = skinSlots.get(skin);
    if (slot === undefined) return;
    skinSlots.delete(skin);
    skinFree.push(slot);
  };
  const skinMat = new THREE.MeshLambertMaterial({ map: skinTex, alphaTest: 0.5 });
  skinMat.onBeforeCompile = (shader) => {          // 사람마다 스킨 모음의 자기 칸을 쓰게 한다
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nattribute vec2 instAt;')
      .replace('#include <uv_vertex>', '#include <uv_vertex>\n#ifdef USE_MAP\n  vMapUv = vMapUv * 0.0625 + instAt;\n#endif');
  };

  // 이름표 모음: 192×48 이름표를 8×32칸에
  const tagCanvas = Object.assign(document.createElement('canvas'), { width: 1536, height: 1536 });
  const tagCtx = tagCanvas.getContext('2d');
  const tagTex = new THREE.CanvasTexture(tagCanvas);
  tagTex.colorSpace = THREE.SRGBColorSpace;
  const tagFree = Array.from({ length: 256 }, (_, n) => 255 - n);
  const tagSlot = (name) => {
    if (!name || !tagFree.length) return -1;
    const slot = tagFree.pop();
    drawTag(tagCtx, name, (slot % 8) * 192, (slot >> 3) * 48, 0.75);
    tagTex.needsUpdate = true;
    return slot;
  };
  const tagMat = new THREE.ShaderMaterial({
    uniforms: { map: { value: tagTex } },
    transparent: true,
    vertexShader: `
      attribute vec2 instAt;
      varying vec2 vUv;
      void main() {
        vUv = uv * vec2(0.125, 0.03125) + instAt;
        vec4 at = modelViewMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);     // 이름표의 가운데
        at.xy += position.xy * vec2(1.0, 0.25);                                    // 늘 화면을 보도록 세운다
        gl_Position = projectionMatrix * at;
      }`,
    fragmentShader: `
      uniform sampler2D map;
      varying vec2 vUv;
      void main() {
        vec4 c = texture2D(map, vUv);
        if (c.a < 0.05) discard;
        gl_FragColor = c;
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });

  // 묶음: 조각마다 하나씩
  const batch = {};
  const make = (key, geo, mat, extra = true) => {
    const mesh = new THREE.InstancedMesh(geo, mat, CROWD_MAX);
    mesh.count = 0;
    mesh.visible = false;
    mesh.frustumCulled = false;        // 사람들이 강의실 곳곳에 있어서 묶음째로는 가려 내지 않는다
    const at = extra ? new THREE.InstancedBufferAttribute(new Float32Array(CROWD_MAX * 2), 2) : null;
    if (at) geo.setAttribute('instAt', at);
    scene.add(mesh);
    batch[key] = { mesh, at, n: 0 };
  };
  for (const key in AVATAR_GEO) make(key, AVATAR_GEO[key](), skinMat);
  const [armL, armR] = armGeos(false), [armLs, armRs] = armGeos(true);
  make('armL', armL, skinMat);
  make('armR', armR, skinMat);
  make('armLs', armLs, skinMat);       // 팔이 가는 스킨
  make('armRs', armRs, skinMat);
  make('tag', new THREE.PlaneGeometry(1, 1), tagMat);
  batch.tag.mesh.layers.set(1);        // 이름표는 내 카메라에만 보인다 (거울 속에는 그리지 않는다)
  make('blob', quad, shadowMat, false);

  const models = new Set();
  const at = new THREE.Vector3(), move = new THREE.Matrix4();
  const put = (key, matrix, u = 0, v = 0) => {
    const B = batch[key], n = B.n;
    if (n >= CROWD_MAX) return;
    matrix.toArray(B.mesh.instanceMatrix.array, n * 16);
    if (B.at) { B.at.array[n * 2] = u; B.at.array[n * 2 + 1] = v; }
    B.n = n + 1;
  };
  const send = (attr, count) => {      // 쓴 만큼만 그래픽 카드로 보낸다
    attr.clearUpdateRanges();
    attr.addUpdateRange(0, count);
    attr.needsUpdate = true;
  };
  // 화면을 그리기 전에: 뼈대들의 자리를 묶음으로 옮겨 적는다
  function fill() {
    for (const key in batch) batch[key].n = 0;
    for (const m of models) {
      if (!m.root.visible) continue;
      m.root.updateMatrixWorld(true);
      const slot = skinSlot(m.skin), u = (slot % 16) / 16, v = 1 - ((slot >> 4) + 1) / 16, slim = m.skin.slim;
      if (m.head.visible) put('head', m.head.matrixWorld, u, v);
      put('body', m.body.matrixWorld, u, v);
      put(slim ? 'armLs' : 'armL', m.armL.matrixWorld, u, v);
      put(slim ? 'armRs' : 'armR', m.armR.matrixWorld, u, v);
      put('legL', m.legL.matrixWorld, u, v);
      put('legR', m.legR.matrixWorld, u, v);
      if (m.lids.visible) put('lids', m.lids.matrixWorld, u, v);
      if (m.tag.visible && m.tagSlot >= 0) {
        at.setFromMatrixPosition(m.tag.matrixWorld);
        put('tag', move.makeTranslation(at.x, at.y, at.z), (m.tagSlot % 8) / 8, 1 - ((m.tagSlot >> 3) + 1) / 32);
      }
      if (m.blob.visible) {
        m.blob.updateMatrix();
        put('blob', m.blob.matrix);
      }
    }
    for (const key in batch) {
      const B = batch[key];
      B.mesh.count = B.n;
      B.mesh.visible = B.n > 0;
      if (!B.n) continue;
      send(B.mesh.instanceMatrix, B.n * 16);
      if (B.at) send(B.at, B.n * 2);
    }
  }
  return {
    models, fill, tagSlot, freeSkin,
    freeTag: (slot) => { if (slot >= 0) tagFree.push(slot); },
  };
})();

// batched = 다른 사람의 캐릭터: 뼈대만 만들고, 그리는 것은 위의 묶음(crowd)에 맡긴다
function buildAvatar(look, name, batched = false) {
  // 같은 기본 캐릭터끼리는 스킨 한 장을 함께 쓴다
  const skin = look.skin || (look.skin = defaultSkin(look)), mat = skin.mat, U = AV.u;
  const root = new THREE.Group();     // 위치·몸 방향
  const rig = new THREE.Group();      // 걸을 때 통통, 앉을 때 위로
  root.add(rig);
  const part = (geo, x, y, z) => {
    const m = batched ? new THREE.Object3D() : new THREE.Mesh(geo(), mat);
    m.position.set(x, y, z);
    rig.add(m);
    return m;
  };

  const head = part(AVATAR_GEO.head, 0, AV.leg + AV.body, 0);     // 목을 축으로 끄덕인다
  head.rotation.order = 'YXZ';        // 좌우로 돌린 다음 위아래로 끄덕인다
  const body = part(AVATAR_GEO.body, 0, AV.leg + AV.body / 2, 0);

  // 팔·다리는 위쪽 끝(어깨·골반)을 축으로 흔들린다. 캐릭터의 왼쪽이 +x, 오른쪽이 -x
  const arms = batched ? [] : armGeos(skin.slim), ax = armX(skin.slim);
  const armL = part(() => arms[0], ax, AV.shoulder, 0), armR = part(() => arms[1], -ax, AV.shoulder, 0);
  const legL = part(AVATAR_GEO.legL, 2 * U, AV.leg, 0), legR = part(AVATAR_GEO.legR, -2 * U, AV.leg, 0);
  legL.rotation.order = legR.rotation.order = 'YXZ';   // 앉을 때 다리를 앞으로 뻗고 살짝 벌린다

  // 눈 깜빡임용 덮개 (평소엔 숨김. 기본 캐릭터의 스킨에만 그림이 있다)
  const lids = batched ? new THREE.Object3D() : new THREE.Mesh(AVATAR_GEO.lids(), mat);
  lids.position.set(0, AV.head / 2, AV.head / 2 + 0.003);
  lids.visible = false;
  head.add(lids);
  const parts = batched ? [] : [head, body, armL, armR, legL, legR, lids];

  // 머리 위 이름표
  const tag = batched ? new THREE.Object3D() : new THREE.Sprite(new THREE.SpriteMaterial({
    depthWrite: false,
    map: makeTex(256, 64, (g) => drawTag(g, name), { smooth: true }),
  }));
  tag.scale.set(1.0, 0.25, 1);
  tag.visible = !!name;               // 이름이 없으면 이름표도 없다
  tag.layers.set(1);                  // 이름표는 내 카메라에만 보인다 (거울 속에는 그리지 않는다)
  root.add(tag);

  const blob = batched ? new THREE.Object3D() : new THREE.Mesh(quad, shadowMat);     // 발밑 그림자
  blob.rotation.x = -Math.PI / 2;
  blob.position.y = 0.014;

  const model = { root, rig, head, body, armL, armR, legL, legR, lids, tag, blob, look, skin, parts, batched, tagSlot: -1, dispose: null };
  if (batched) {
    scene.add(root);
    model.tagSlot = crowd.tagSlot(name);
    crowd.models.add(model);
    model.dispose = () => {           // 나간 사람의 캐릭터를 치울 때 쓴다
      scene.remove(root);
      crowd.models.delete(model);
      crowd.freeTag(model.tagSlot);
    };
  } else {
    scene.add(root, blob);
    model.dispose = () => {
      scene.remove(root, blob);
      rig.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
      tag.material.map.dispose();
      tag.material.dispose();
    };
  }
  return model;
}

/* ───────────── 캐릭터 한 명의 움직임 (나 · 친구가 같은 규칙을 쓴다) ─────────────
   mode:  free      자유롭게 서 있거나 걷는 중
          path      앉을 자리까지 찾아 둔 길을 따라 걷는 중
          sitting   의자에 앉는 동작 중
          seated    앉아 있음
          standing  일어나는 동작 중                                                */
class Actor {
  constructor(look, name = '', batched = false) {
    this.name = name;
    this.model = buildAvatar(look, name, batched);
    this.pos = new THREE.Vector3();
    this.vel = { x: 0, z: 0 };
    this.vy = 0;
    this.air = false;                 // 공중에 떠 있는지 (점프 · 높은 곳에서 떨어지는 중)
    this.bodyYaw = 0;                 // 몸이 향하는 방향
    this.lookYaw = 0;                 // 시선 방향 (고개는 이쪽을 본다)
    this.lookPitch = 0;               // 시선 높낮이 (+ 가 아래)
    this.mode = 'free';
    this.input = { x: 0, z: 0, jump: false };   // 직접 조종할 때 가고 싶은 속도
    this.path = null;
    this.pathAt = 0;
    this.seat = null;
    this.exit = null;                 // 일어설 때 돌아갈 지점
    this.t = 0;                       // 앉기·일어서기 진행도 0~1
    this.yawFrom = 0;
    this.walkPhase = 0;
    this.walkAmt = 0; this.airAmt = 0; this.sitAmt = 0; this.wave = 0;
    this.isSelf = false;              // 내가 조종하는 캐릭터인지 (1인칭이라 내 머리는 숨긴다)
    this.reachAmt = 0; this.reachSide = 0; this.reachFwd = 0;   // 쪽지를 주고받을 때 팔을 뻗는 정도와 방향
    this.writeOn = false; this.writeAmt = 0;                    // 칠판 앞에서 판서하는 중인지 · 팔을 든 정도
    this.hand = { x: 0, y: 1.5 }; this.handTo = { x: 0, y: 1.5 };   // 판서하는 손이 가리키는 칠판 위의 곳 (지금 · 목표)
    this.bubble = null;               // 머리 위 말풍선 (질문 · 반응)
    this.bubbleUntil = 0;
    this.nextBlink = performance.now() + 1500 + Math.random() * 2500;
    this.blinkEnd = 0;
  }

  place(x, z, yaw) {
    this.pos.set(x, floorAt(x, z), z);
    this.bodyYaw = this.lookYaw = yaw;
    this.applyPose();
  }

  // 하던 일을 모두 멈추고 처음 자리에 다시 세운다 (강의실에서 나갔을 때)
  reset(x, z) {
    this.leaveSeat();
    this.mode = 'free';
    this.path = this.exit = null;
    this.vel.x = this.vel.z = this.vy = 0;
    this.air = false;
    this.input.x = this.input.z = 0;
    this.input.jump = false;
    this.walkPhase = this.walkAmt = this.airAmt = this.sitAmt = this.lookPitch = 0;
    this.place(x, z, 0);
  }

  setSelf(on) {
    this.isSelf = on;
    this.model.head.visible = !on;
    this.model.tag.visible = !on && !!this.name;
  }

  // 자리까지 걸어가서 앉기
  goSit(seat) {
    if (this.mode !== 'free' && this.mode !== 'path') return false;
    if (seat.taken && seat.taken !== this) return false;
    let best = null, bestSide = null;
    for (const side of seat.sides) {       // 의자 왼쪽·오른쪽 중 더 가까운 쪽으로 들어간다
      const path = findPath(this.pos.x, this.pos.z, side.x, side.z);
      if (path && (!best || path.cost < best.cost)) { best = path; bestSide = side; }
    }
    if (!best) return false;
    this.cancel();
    this.path = best;
    this.pathAt = 0;
    this.mode = 'path';
    this.seat = seat;
    this.exit = bestSide;
    seat.taken = this;
    return true;
  }

  // 앉지 않고 그냥 걸어가기 (판서하러 칠판 앞으로)
  walkTo(x, z) {
    if (this.mode !== 'free' && this.mode !== 'path') return false;
    if (Math.hypot(x - this.pos.x, z - this.pos.z) < 0.08) {       // 이미 그 자리다: 다른 데로 가던 중이었다면 멈춘다
      if (this.mode === 'path' && !this.seat) this.cancel();
      return true;
    }
    const path = findPath(this.pos.x, this.pos.z, x, z);
    if (!path) return false;
    this.cancel();
    this.path = path;
    this.pathAt = 0;
    this.mode = 'path';
    return true;
  }

  // 걷던 길 그만두기
  cancel() {
    if (this.mode !== 'path') return;
    this.mode = 'free';
    this.path = null;
    this.leaveSeat();
  }

  // 자리 비우기 (그새 다른 사람 차지가 된 자리라면 표시는 건드리지 않는다)
  leaveSeat() {
    if (this.seat && this.seat.taken === this) this.seat.taken = null;
    this.seat = null;
  }

  stand() {
    if (this.mode !== 'seated') return false;
    this.mode = 'standing';
    this.t = 0;
    return true;
  }

  arrive() {
    this.vel.x = this.vel.z = 0;
    this.path = null;
    if (this.seat) {
      this.mode = 'sitting';
      this.t = 0;
      this.yawFrom = this.bodyYaw;
      this.exit = { x: this.pos.x, z: this.pos.z };
    } else {
      this.mode = 'free';
    }
  }

  // 한 프레임 진행. 화면을 다시 그려야 하면 true
  update(dt) {
    let active = false;
    const yaw0 = this.bodyYaw;

    if (this.mode === 'path') {
      active = true;
      let left = WALK * dt;
      while (left > 0 && this.mode === 'path') {
        const wp = this.path[this.pathAt];
        if (!wp) { this.arrive(); break; }
        const dx = wp.x - this.pos.x, dz = wp.z - this.pos.z, d = Math.hypot(dx, dz);
        if (d <= left) {
          this.pos.x = wp.x;
          this.pos.z = wp.z;
          left -= d;
          this.pathAt++;
        } else {
          this.vel.x = dx / d * WALK;
          this.vel.z = dz / d * WALK;
          this.pos.x += dx / d * left;
          this.pos.z += dz / d * left;
          left = 0;
        }
      }
    } else if (this.mode === 'free') {
      const ease = 1 - Math.exp(-14 * dt);
      this.vel.x += (this.input.x - this.vel.x) * ease;
      this.vel.z += (this.input.z - this.vel.z) * ease;
      if (this.input.x === 0 && this.input.z === 0 && Math.hypot(this.vel.x, this.vel.z) < 0.03) {
        this.vel.x = this.vel.z = 0;
      }
      if (this.vel.x !== 0 || this.vel.z !== 0) {
        const ox = this.pos.x, oz = this.pos.z;
        const top = (this.air ? this.pos.y : Math.max(this.pos.y, floorAt(ox, oz))) + STEP_UP;     // 여기까지는 걸어서 올라갈 수 있다
        this.pos.x += this.vel.x * dt;
        this.pos.z += this.vel.z * dt;
        collide(this.pos);
        if (floorNear(this.pos.x, this.pos.z) > top) {            // 너무 높은 턱(무대 앞 · 2층 벽)은 못 올라가고, 턱을 따라 미끄러진다
          if (floorNear(this.pos.x, oz) <= top) this.pos.z = oz;
          else if (floorNear(ox, this.pos.z) <= top) this.pos.x = ox;
          else { this.pos.x = ox; this.pos.z = oz; }
        }
        active = true;
      }
    } else if (this.mode === 'sitting' || this.mode === 'standing') {
      active = true;
      this.t = Math.min(1, this.t + dt / 0.42);
      const k = this.t * this.t * (3 - 2 * this.t);               // 부드럽게 시작하고 끝나는 곡선
      const a = this.mode === 'sitting' ? k : 1 - k;              // 0 = 서 있음, 1 = 앉음
      this.pos.x = this.exit.x + (this.seat.sit.x - this.exit.x) * a;
      this.pos.z = this.exit.z + (this.seat.sit.z - this.exit.z) * a;
      this.sitAmt = this.seat.stand ? 0 : a;                      // 교탁 단상에는 앉지 않고 서 있는다
      if (this.mode === 'sitting') this.bodyYaw = this.yawFrom + wrap(this.seat.yaw - this.yawFrom) * k;
      if (this.t >= 1) {
        if (this.mode === 'sitting') {
          this.mode = 'seated';
          this.bodyYaw = this.seat.yaw;
        } else {
          this.mode = 'free';
          this.leaveSeat();
        }
      }
    }

    // 점프 · 중력 · 바닥 높이 (계단식 강의실과 강당에서는 바닥이 높아진다)
    const ground = floorAt(this.pos.x, this.pos.z);
    if (this.input.jump && this.mode === 'free' && !this.air) { this.vy = JUMP; this.air = true; }
    this.input.jump = false;
    if (!this.air && this.pos.y - ground > 0.45) this.air = true;     // 높은 곳에서 발을 내디디면 떨어진다
    const air = this.air;
    if (air) {
      this.vy -= GRAVITY * dt;
      this.pos.y += this.vy * dt;
      if (this.pos.y <= ground) { this.pos.y = ground; this.vy = 0; this.air = false; }
      active = true;
    } else if (this.pos.y !== ground) {                               // 계단은 부드럽게 오르내린다
      this.pos.y += (ground - this.pos.y) * (1 - Math.exp(-16 * dt));
      if (Math.abs(ground - this.pos.y) < 0.004) this.pos.y = ground;
      active = true;
    }

    // 몸 방향: 걷는 쪽으로 돌고, 고개가 한계보다 더 돌아가면 몸이 따라 돈다 (마인크래프트 방식)
    const upright = this.mode === 'free' || this.mode === 'path';
    const sp = upright ? Math.hypot(this.vel.x, this.vel.z) : 0;
    const moving = sp > 0.2;
    if (moving) {
      let want = Math.atan2(this.vel.x, this.vel.z);
      if (this.mode === 'free' && Math.abs(wrap(want - this.lookYaw)) > 1.66) want += Math.PI;   // 뒷걸음질
      this.bodyYaw += wrap(want - this.bodyYaw) * (1 - Math.exp(-12 * dt));
    }
    if (upright) {
      const rel = wrap(this.lookYaw - this.bodyYaw);
      if (Math.abs(rel) > HEAD_TURN) this.bodyYaw = this.lookYaw - Math.sign(rel) * HEAD_TURN;
    }

    // 걷기·점프 동작의 세기
    this.walkAmt += ((moving ? 1 : 0) - this.walkAmt) * (1 - Math.exp(-10 * dt));
    this.airAmt += ((air ? 1 : 0) - this.airAmt) * (1 - Math.exp(-14 * dt));
    if (moving) this.walkPhase += (7 + sp * 2.4) * dt;

    this.applyPose();
    return active || this.walkAmt > 0.002 || this.airAmt > 0.002 || Math.abs(this.bodyYaw - yaw0) > 1e-4;
  }

  // 지금 상태를 3D 모델의 자세로 옮긴다
  applyPose() {
    const m = this.model, sit = this.sitAmt, up = 1 - sit;
    const swing = Math.sin(this.walkPhase) * this.walkAmt * up;
    m.legL.rotation.x = swing * 0.8 - 1.41 * sit;         // 앉으면 다리를 앞으로 뻗는다
    m.legR.rotation.x = -swing * 0.8 - 1.41 * sit;
    m.legL.rotation.y = 0.25 * sit;
    m.legR.rotation.y = -0.25 * sit;
    let lx = (-swing * 0.9 + ARM_SIT * sit) * (1 - this.wave);     // 앉으면 두 팔을 책상 위로, 손을 들 땐 한 팔을 옆으로
    let rx = swing * 0.9 + ARM_SIT * sit;
    let lz = this.airAmt * 2.0 + this.wave * 1.9;               // 점프하면 두 팔을 든다
    let rz = -this.airAmt * 2.0;
    const reach = this.reachAmt;                                // 쪽지를 주고받을 때 상대 쪽으로 팔을 뻗는다
    if (reach > 0) {
      if (this.reachSide > 0) { lx *= 1 - reach; lz += 1.35 * reach; }
      else if (this.reachSide < 0) { rx *= 1 - reach; rz -= 1.35 * reach; }
      else if (this.reachFwd > 1) rx += (-1.4 - rx) * reach;    // 리모컨으로 스크린을 가리킨다
      else if (this.reachFwd > 0) { lx -= 0.6 * reach; rx -= 0.6 * reach; }
      else rx += 2.3 * reach;                                   // 뒷자리: 한 팔을 뒤로 넘긴다
    }
    if (this.writeAmt > 0.002) {                                // 판서: 오른팔을 칠판의 쓰는 곳으로 뻗는다
      const s = Math.sin(this.bodyYaw), c = Math.cos(this.bodyYaw);
      const wx = this.hand.x - this.pos.x, wz = BOARD.z - this.pos.z;
      const ax = wx * c - wz * s + AV.armX, az = wx * s + wz * c;   // 어깨에서 본 옆 · 앞
      const ay = this.hand.y - this.pos.y - AV.shoulder;
      rx += (Math.atan2(-az, -ay) - rx) * this.writeAmt;
      rz += (Math.asin(clamp(ax / (Math.hypot(ax, ay, az) || 1), -0.95, 0.95)) - rz) * this.writeAmt;
    }
    m.armL.rotation.x = lx;
    m.armR.rotation.x = rx;
    m.armL.rotation.z = lz;
    m.armR.rotation.z = rz;
    m.rig.position.y = Math.abs(Math.sin(this.walkPhase)) * 0.04 * this.walkAmt * up + SEAT_RISE * sit;

    // 고개는 시선을 따라간다 (몸통 기준 좌우 한계 안에서)
    m.head.rotation.y = clamp(wrap(this.lookYaw - this.bodyYaw), -HEAD_TURN, HEAD_TURN);
    m.head.rotation.x = clamp(this.lookPitch, -0.9, 0.9) * 0.6;
    m.head.rotation.z = swing * 0.05;

    m.root.position.copy(this.pos);
    m.root.rotation.y = this.bodyYaw;
    m.tag.position.y = AV.leg + AV.body + AV.head + 0.2 + m.rig.position.y;
    if (this.bubble) this.bubble.position.y = m.tag.position.y + 0.42;
    const ground = floorAt(this.pos.x, this.pos.z);
    m.blob.position.set(this.pos.x, ground + 0.014, this.pos.z);
    const bs = 0.8 * (1 - clamp(this.pos.y - ground, 0, 1) * 0.45);
    m.blob.scale.set(bs, bs, 1);
  }

  // 머리 위에 말풍선을 띄우고 손을 든다 (질문 · 반응)
  say(text, ms, bg = '#fffdf2') {
    if (!this.bubble) {
      this.bubble = new THREE.Sprite(new THREE.SpriteMaterial({ depthWrite: false }));
      this.bubble.scale.set(1.7, 0.53, 1);
      this.model.root.add(this.bubble);
    }
    const mat = this.bubble.material;
    if (mat.map) mat.map.dispose();
    mat.map = makeTex(512, 160, (g) => {
      g.fillStyle = '#33241a';
      g.fillRect(0, 0, 512, 160);
      g.fillStyle = bg;
      g.fillRect(6, 6, 500, 148);
      g.fillStyle = '#33241a';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = `800 38px ${UI_FONT}`;
      const lines = [''];                       // 길면 두 줄로 나눈다
      for (const ch of text) {
        if (g.measureText(lines[lines.length - 1] + ch).width > 450 && lines.length < 2) lines.push('');
        lines[lines.length - 1] += ch;
      }
      lines.forEach((line, i) => g.fillText(line, 256, 80 + (i - (lines.length - 1) / 2) * 50, 470));
    }, { smooth: true });
    mat.needsUpdate = true;
    this.bubble.visible = !this.isSelf;
    this.bubbleUntil = performance.now() + ms;
    this.wave = 1;
    this.applyPose();
  }

  // 말풍선을 거둘 때가 됐으면 거두고 true
  tickBubble(now) {
    if (!this.bubble || !this.bubbleUntil || now < this.bubbleUntil) return false;
    this.bubble.visible = false;
    this.bubbleUntil = 0;
    this.wave = 0;
    this.applyPose();
    return true;
  }

  // 스킨을 갈아입는다 (skin 을 주지 않으면 기본 캐릭터의 스킨으로 돌아간다)
  setSkin(skin) {
    const m = this.model;
    skin = skin || m.look.skin;
    if (skin === m.skin) return;
    if (skin.slim !== m.skin.slim) {             // 팔 폭이 다른 스킨이면 팔 도형도 바꾼다 (묶어서 그리는 캐릭터는 자리만)
      const ax = armX(skin.slim);
      if (!m.batched) {
        const [geoL, geoR] = armGeos(skin.slim);
        m.armL.geometry.dispose();
        m.armR.geometry.dispose();
        m.armL.geometry = geoL;
        m.armR.geometry = geoR;
      }
      m.armL.position.x = ax;
      m.armR.position.x = -ax;
    }
    for (const part of m.parts) { part.material = skin.mat; part.renderOrder = 0; }
    m.lids.visible = false;
    m.skin = skin;
    dirty = true;
  }

  // 선생님은 오른손에 리모컨을 들고 있다
  setRemote(on) {
    if (on && !this.remote) {
      this.remote = remoteMesh();
      this.remote.position.set(0, -0.4, 0.07);
      this.remote.rotation.x = -1.35;
      this.model.armR.add(this.remote);
    }
    if (this.remote) this.remote.visible = on;
  }

  // 쪽지를 주고받을 상대가 내 몸 기준으로 어느 쪽에 있는지 정해 둔다
  reachTo(other) {
    const dx = other.pos.x - this.pos.x, dz = other.pos.z - this.pos.z;
    const s = Math.sin(this.bodyYaw), c = Math.cos(this.bodyYaw);
    const side = dx * c - dz * s, fwd = dx * s + dz * c;       // 왼팔 쪽 / 앞쪽으로 얼마나 떨어져 있나
    this.reachSide = Math.abs(side) > Math.abs(fwd) ? Math.sign(side) : 0;
    this.reachFwd = this.reachSide ? 0 : Math.sign(fwd);
  }

  blink(now) {
    const lids = this.model.lids;
    if (this.isSelf || !this.model.root.visible || !this.model.skin.blink) return false;
    if (lids.visible) {
      if (now < this.blinkEnd) return false;
      lids.visible = false;
      this.nextBlink = now + 2200 + Math.random() * 2600;
      return true;
    }
    if (now < this.nextBlink) return false;
    lids.visible = true;
    this.blinkEnd = now + 130;
    return true;
  }
}

/* ───────────── 등장인물 ───────────── */
// 소개 화면에 서 있는 캐릭터: 기본 스킨 둘 + 내 스킨을 입은 세 번째 (스킨을 넣었을 때만 나온다)
const actors = { roy: new Actor(CHARACTERS.roy), stella: new Actor(CHARACTERS.stella), mine: new Actor(CHARACTERS.roy) };
const STAGE_X = { roy: -0.5, stella: 0.5, mine: 1.5 };
for (const key in actors) actors[key].place(STAGE_X[key], 4.4, 0);
actors.mine.model.root.visible = actors.mine.model.blob.visible = false;

let chosen = 'roy';
let nickTouched = false;             // 이름 칸을 직접 고쳤는지 (안 고쳤으면 캐릭터 이름을 따라간다)
let player = actors.roy;             // 내가 조종하는 캐릭터
let mate = actors.stella;            // 강의실에 함께 있는 친구
let mateNext = null, mateTimer = 0;

/* ───────────── 내 스킨: 마인크래프트 스킨 PNG 를 내 캐릭터에 입힌다 ─────────────
   이 브라우저에 저장해 두고, 수업에 들어가면 같은 수업의 사람들에게도 보내서 모두에게 같은 모습으로 보인다 (k 메시지) */
const SKIN_KEY = 'classroom-skin-v1';
const SKIN_URL = /^data:image\/png;base64,[A-Za-z0-9+/=]+$/;
const SKIN_MAX = 40000;              // 스킨 그림(글자로 바꾼 것)의 최대 길이. 64×64 PNG 는 보통 2,000 ~ 6,000자다
let mySkin = null;                   // { skin, d: 보낼 그림, sl: 팔이 가는 스킨인지 }
const imageOf = (src) => new Promise((done, fail) => {
  const img = new Image();
  img.onload = () => done(img);
  img.onerror = fail;
  img.src = src;
});
// 다듬어 둔 스킨 그림(64×64 PNG 를 글자로 바꾼 것)에서 스킨을 만든다. 저장해 둔 것 · 다른 사람이 보낸 것에 쓴다
async function skinFromURL(d, slim) {
  if (typeof d !== 'string' || d.length > SKIN_MAX || !SKIN_URL.test(d)) return null;
  let img;
  try { img = await imageOf(d); } catch { return null; }
  if (img.naturalWidth !== 64 || img.naturalHeight !== 64) return null;
  const canvas = blankSkin();
  canvas.getContext('2d').drawImage(img, 0, 0);
  return makeSkin(canvas, { slim: !!slim });
}
const wearing = () => chosen === 'mine' && !!mySkin;       // 내 스킨을 입고 들어가는지
function wearSkin() {                // 내 스킨을 입은 세 번째 캐릭터를 세운다 (스킨이 없으면 치운다)
  const a = actors.mine, on = !!mySkin;
  a.setSkin(on ? mySkin.skin : null);
  if (!entered) a.model.root.visible = a.model.blob.visible = on;
  const face = $('skinFace');
  face.hidden = $('skinMore').hidden = !on;
  $('skinPlus').hidden = on;
  if (on) {
    const g = face.getContext('2d');
    g.clearRect(0, 0, 8, 8);
    g.drawImage(mySkin.skin.canvas, 8, 8, 8, 8, 0, 0, 8, 8);
  }
  $('skinNote').textContent = on ? '내 스킨을 고르면 다른 사람에게도 이 모습으로 보여요.' : '"내 스킨"을 누르면 마인크래프트 스킨(PNG)을 넣을 수 있어요.';
  dirty = true;
}
function setMySkin(made) {           // made = { canvas, slim } 또는 null (스킨 빼기)
  const old = mySkin;
  mySkin = null;
  if (made) {
    const d = made.canvas.toDataURL('image/png');
    if (d.length <= SKIN_MAX) mySkin = { skin: makeSkin(made.canvas, { slim: made.slim }), d, sl: made.slim ? 1 : 0 };
  }
  if (!mySkin && chosen === 'mine') choose('roy');     // 스킨을 뺐으면 기본 스킨으로 돌아간다
  wearSkin();
  if (old) dropSkin(old.skin);
  try {
    if (mySkin) localStorage.setItem(SKIN_KEY, JSON.stringify({ d: mySkin.d, sl: mySkin.sl }));
    else localStorage.removeItem(SKIN_KEY);
  } catch {}
  return !!mySkin;
}

function choose(who) {
  chosen = who;
  for (const key in actors) {
    const a = actors[key], on = key === who;
    a.wave = on ? 1 : 0;                         // 고른 캐릭터가 한 걸음 나와 손을 든다
    a.pos.z = on ? 4.75 : 4.4;
    a.applyPose();
  }
  document.querySelectorAll('.pick [data-who]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.who === who)));
  dirty = true;
}

/* ───────────── 상태 ───────────── */
let entered = false;
let dirty = true;                    // true 일 때만 화면을 새로 그린다
let jumpQueued = false;
let target = null;                   // 지금 X 키가 가리키는 것 (자리 또는 문)
let takenSeat = null;                // 바라보고 있지만 누가 이미 앉아 있는 자리
let actLabel = '';
const keys = new Set();
const joy = { x: 0, y: 0 };          // 터치 조이스틱

/* ───────────── 지금 바라보고 있는 물체 찾기 (화면 가운데 십자선이 가리키는 것) ───────────── */
const REACH = 2.2;                   // 손이 닿을 만큼 가까운 것만 고를 수 있다 (멀리 있는 물체는 안 된다)
const viewRay = new THREE.Ray(), _hit = new THREE.Vector3();

function lookedAt() {
  const cp = Math.cos(player.lookPitch);
  viewRay.origin.copy(camera.position);
  viewRay.direction.set(Math.sin(player.lookYaw) * cp, -Math.sin(player.lookPitch), Math.cos(player.lookYaw) * cp);
  let found = null, best = REACH * REACH;
  for (const it of interactables) {
    for (const b of it.boxes) {
      if (!viewRay.intersectBox(b, _hit)) continue;
      const d = _hit.distanceToSquared(viewRay.origin);
      if (d < best) { best = d; found = it; }
    }
  }
  return found;
}

/* ── 칠판 크게 보기 (판서 뷰) ──
   칠판을 바라보고 X 를 누르면, 칠판 높이가 화면에 꼭 맞게 정면에서 본다.
   칠판이 화면보다 넓으면 영역으로 나뉘고, 좌우 화살표(또는 위쪽 단추)로 옆 영역으로 옮겨 간다.
   옮겨 갈 때는 카메라가 천천히 출발해서 천천히 멈춘다. 쓸 수 있는 칠판이면 끌어서 쓴다. */
let zoomed = false;                  // 크게 보는 중인지
let zoomAmt = 0;                     // 0 = 내 눈으로 보는 중, 1 = 칠판 정면
let zoomX = 0;                       // 판서 뷰에서 카메라가 서 있는 가로 위치
let areas = [0], areaAt = 0;         // 영역마다 카메라가 설 가로 위치 · 지금 보고 있는 영역
let boardHitX = 0;                   // 방금 칠판의 어디를 바라봤는지
let ghostOn = false;                 // 판서 뷰에서 내 캐릭터를 반투명하게 보여 주는 중인지
const pan = { from: 0, to: 0, t: 1, span: 0.6 };      // 옆 영역으로 옮겨 가는 카메라 이동
const WRITE_Z = 0.55;                // 판서할 때 칠판에서 떨어져 서는 거리
const COARSE = matchMedia('(pointer: coarse)').matches;
// 칠판 보기는 누구나, 앉아서도 서서도 할 수 있다 (판서하러 걸어가는 중에도)
const canZoom = () => player.mode === 'seated' || player.mode === 'free' || (player.mode === 'path' && !player.seat);
const canWrite = () => cfg.board !== 'video' && (isTeacher || cfg.board === 'free');         // 화이트 · 그린은 선생님만, 자유 보드는 누구나
// 자리에서 칠판을 보려면 고개를 어느 쪽으로 돌려야 하는지 (돌릴 수 있는 범위 안에서)
const boardYaw = (s) => s.yaw + clamp(wrap(Math.atan2(BOARD.x - s.sit.x, BOARD.z - s.sit.z) - s.yaw), -SEAT_LOOK, SEAT_LOOK);

function screenLooked() {            // 시선이 칠판에 닿으면 (거리에 상관없이) 칠판을 돌려준다
  const cp = Math.cos(player.lookPitch);
  viewRay.origin.copy(camera.position);
  viewRay.direction.set(Math.sin(player.lookYaw) * cp, -Math.sin(player.lookPitch), Math.cos(player.lookYaw) * cp);
  if (!viewRay.intersectBox(screenObj.boxes[0], _hit)) return null;
  boardHitX = _hit.x;
  return screenObj;
}

// 판서 뷰의 카메라 자리: 칠판 높이가 (위아래 단추 자리를 뺀) 화면 높이에 꼭 맞는 거리와 높이, 그때 보이는 가로 폭
function boardCam() {
  const tan = Math.tan(camera.fov * Math.PI / 360);
  const vh = Math.max(window.innerHeight, 320);                                // (창이 가려져 크기가 0 으로 나올 때를 대비)
  const top = (window.innerWidth < 640 ? 170 : 58) / vh;                       // 화면 위쪽 단추들이 차지하는 몫
  const under = (COARSE ? 350 : 176) / vh;                                     // 화면 아래쪽 단추들이 차지하는 몫
  const fill = clamp(1 - top - under, 0.4, 0.92);
  const half = BOARD.h / (2 * fill);                                           // 화면 높이의 절반이 칠판에서 몇 m 인지
  return { dist: half / tan, y: BOARD.y + BOARD.h / 2 - half * (1 - 2 * top), vis: 2 * half * camera.aspect };
}
// 칠판을 화면 폭에 맞춰 영역으로 나눈다 (이웃한 영역은 조금씩 겹친다)
function layoutAreas() {
  const vis = boardCam().vis, span = Math.max(0, BOARD.w + 0.3 - vis);
  const n = span > 0.05 ? Math.ceil(span / (vis * 0.8)) + 1 : 1;
  areas = Array.from({ length: n }, (_, i) => (n === 1 ? 0 : -span / 2 + i * span / (n - 1)));

const nearestArea = (x) => areas.reduce((best, c, i) => (Math.abs(c - x) < Math.abs(areas[best] - x) ? i : best), 0);

/* 선생님 따라가기 (학생의 칠판 보기): 선생님이 쓰고 있는 곳으로 카메라가 스스로 부드럽게 옮겨 간다.
   내가 직접 옮기거나(← → · 영역 단추 · 끌기) 쓰기 시작하면 꺼지고, "선생님 따라가기" 단추나 F 로 다시 켠다 */
const follow = { on: true, x: 0, at: 0, fresh: false, to: 0, vel: 0 };     // x · at = 선생님이 마지막으로 쓴 곳과 그때, to = 카메라가 가려는 곳
const FOLLOW_RECENT = 20000;         // 이 시간 안에 쓴 곳이면 '지금 쓰고 있는 곳'으로 본다
const FOLLOW_TIME = 0.7;             // 따라가는 데 걸리는 시간의 기준 (천천히 출발해서 천천히 멈춘다)

  follow.fresh = true;

}
function setFollow(on, why = '') {
  if (follow.on === on) return;
  follow.on = on;
  follow.to = zoomX;
  follow.vel = 0;
  follow.fresh = on && followRecent();           // 켜면 선생님이 쓰고 있는 곳으로 바로 간다
  if (on) pan.t = 1;
  showAreas();
  toast(on ? (follow.fresh ? '선생님이 쓰는 곳을 따라가요' : '선생님이 쓰기 시작하면 따라가요') : `${why}따라가기를 껐어요 · F 로 다시 켜기`, 2600);
  dirty = true;
}
const followOff = () => { if (follow.on && zoomed && canFollow()) setFollow(false, '직접 옮겨서 '); };

// 영역 고르기: 카메라가 그 영역으로 옮겨 가고, 판서하는 선생님은 그 앞까지 걸어간다

    pan.from = zoomX;
    pan.to = areas[i];
    pan.t = 0;
    pan.span = clamp(0.4 + Math.abs(pan.to - pan.from) * 0.18, 0.55, 1.6);     // 멀수록 조금 더 오래 걸린다
  }

// (선생님) 칠판 앞으로 걸어간다. x 를 주지 않으면 지금 영역의 가운데
function goWrite(x) {

  const tx = clamp(x === undefined ? areas[areaAt] : x, -lim, lim);
  if (x === undefined) {             // 팔은 우선 손이 닿을 만한 높이의 칠판을 가리킨다
    const bottom = BOARD.y - BOARD.h / 2;
    player.handTo.x = tx + 0.3;
    player.handTo.y = clamp(floorAt(tx, BOARD.z + WRITE_Z) + 1.5, bottom + 0.3, BOARD.y + BOARD.h / 2);
  }
  player.walkTo(tx, BOARD.z + WRITE_Z);

function setZoom(on, hint) {
  const was = zoomed;

  $('aim').hidden = zoomed;
  if (zoomed && !was) {
    layoutAreas();
    areaAt = nearestArea(hint === undefined ? player.pos.x : hint);            // 바라보던 곳(없으면 서 있는 곳)에서 가장 가까운 영역
    zoomX = pan.from = pan.to = areas[areaAt];
    pan.t = 1;
    const tail = follow.on && canFollow();
    if (tail && followRecent()) {                // 선생님이 쓰고 있으면 그곳에서부터 본다
      zoomX = pan.from = pan.to = clamp(follow.x, areas[0], areas[areas.length - 1]);
      areaAt = nearestArea(zoomX);
    }
    follow.to = zoomX;
    follow.vel = 0;
    follow.fresh = false;
    goWrite();
    const move = areas.length > 1 ? ' · ← → 옆으로 이동' : '';
    toast(canWrite() ? `펜을 들고 끌어서 써 보세요${move}${isTeacher ? ' · G를 누르고 있으면 학생들을 돌아봐요' : ''} · Esc로 돌아가기`
      : tail ? '선생님이 쓰는 곳을 따라가요 · ← → 로 직접 옮기기 · Esc로 돌아가기' : `Esc로 돌아가기${move}`, 5000);
  }

    penUp();

  }

  showAreas();
  dirty = true;
}

// 판서 뷰에서 내 캐릭터가 칠판을 가리지 않게 반투명하게 보여 준다 (다른 사람 눈에는 그대로 보인다)
function setGhost(on) {
  if (on === ghostOn) return;
  ghostOn = on;
  const m = player.model, look = m.skin;
  if (on && !look.ghost) {
    look.ghost = new THREE.MeshLambertMaterial({ map: look.mat.map, transparent: true, opacity: 0.45, alphaTest: 0.2, depthWrite: false });
  }
  m.rig.traverse((o) => {
    if (!o.isMesh || (o.material !== look.mat && o.material !== look.ghost)) return;
    o.material = on ? look.ghost : look.mat;
    o.renderOrder = on ? 4 : 0;      // 자료 화면 · 판서보다 나중에 겹쳐 그린다
  });
  m.head.visible = on || !player.isSelf;
}

function zoomThink(dt) {
  if (zoomed && !canZoom()) setZoom(false);
  let active = false;
  if (pan.t < 1) {                   // 옆 영역으로: 천천히 출발해서 천천히 멈춘다
    pan.t = Math.min(1, pan.t + dt / pan.span);
    zoomX = pan.from + (pan.to - pan.from) * pan.t * pan.t * (3 - 2 * pan.t);
    active = true;
  }
  if (zoomed && follow.on && canFollow()) {
    if (follow.fresh) {              // 선생님이 화면 가운데에서 꽤 벗어난 곳에 쓰면 그곳이 가운데에 오게 옮긴다
      follow.fresh = false;
      const goal = clamp(follow.x, areas[0], areas[areas.length - 1]);
      if (Math.abs(goal - follow.to) > boardCam().vis * 0.12) follow.to = goal;
    }
    const off = zoomX - follow.to;
    if (Math.abs(off) > 0.002 || Math.abs(follow.vel) > 0.002) {       // 용수철처럼 부드럽게: 가는 도중에 목표가 바뀌어도 덜컥거리지 않는다
      const om = 2 / FOLLOW_TIME, x = om * dt, ex = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x), tmp = (follow.vel + om * off) * dt;
      follow.vel = (follow.vel - om * tmp) * ex;
      zoomX = follow.to + (off + tmp) * ex;
      const i = nearestArea(zoomX);
      if (i !== areaAt) { areaAt = i; showAreas(); }
      active = true;
    } else if (off) {
      zoomX = follow.to;
      follow.vel = 0;
      active = true;
    }
  }
  const want = zoomed && !glancing ? 1 : 0;       // 돌아보는 동안에는 내 눈으로 강의실을 본다
  if (zoomAmt !== want) {
    zoomAmt += (want - zoomAmt) * (1 - Math.exp(-9 * dt));
    if (Math.abs(want - zoomAmt) < 0.003) zoomAmt = want;
    held.visible = remoteOut && zoomAmt < 0.5;         // 크게 볼 땐 손에 든 리모컨이 화면을 가리지 않게
    active = true;
  }
  setGhost(zoomAmt > 0.3 && player.mode !== 'seated');

}

// 영역 단추: ◀ 1 2 3 ▶ (영역이 둘 이상일 때만 보인다)
function showAreas() {
  const on = zoomed && areas.length > 1, el = $('areas');
  el.hidden = !on;
  if (!on) return;
  if (el.children.length !== areas.length + 3) {
    const make = (text, label, go) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = text;
      b.setAttribute('aria-label', label);
      b.addEventListener('click', () => { go(); canvas.focus(); });
      return b;
    };
    el.replaceChildren(
      make('◀', '왼쪽 영역', () => gotoArea(areaAt - 1)),
      ...areas.map((_, i) => make(String(i + 1), `${i + 1}번 영역`, () => gotoArea(i))),
      make('▶', '오른쪽 영역', () => gotoArea(areaAt + 1)),
      make('선생님 따라가기', '선생님이 쓰는 곳을 따라가기', () => setFollow(!follow.on)),
    );
    el.lastChild.id = 'followBtn';
  }
  [...el.children].forEach((b, i) => {
    if (i === 0) b.disabled = areaAt === 0;
    else if (i <= areas.length) b.setAttribute('aria-pressed', String(i - 1 === areaAt));
    else if (i === areas.length + 1) b.disabled = areaAt === areas.length - 1;
    else {                           // 선생님 따라가기 (학생에게만 보인다)
      b.hidden = !canFollow();

/* ── 판서하는 모습: 칠판 앞에 선 선생님이 칠판을 보고, 오른팔을 쓰는 곳으로 뻗는다 (다른 사람 눈에도 보인다) ── */
let glancing = false, glanceSide = 1;      // 판서하다가 학생들을 돌아보는 중인지 · 어느 쪽으로 돌아섰는지
function writeThink(dt) {
  let active = false;
  const me = player;
  const atBoard = zoomed && isTeacher && canWrite() && me.mode !== 'seated' && Math.abs(me.pos.z - (BOARD.z + WRITE_Z)) < 0.35;
  // 돌아보기: 칠판 앞에서 G 를 누르고 있는 동안 옆으로 서서 고개를 돌려 학생들을 본다. 떼면 다시 칠판을 보고 판서를 잇는다
  const glance = atBoard && me.mode === 'free' && keys.has('KeyG');
  if (glance !== glancing) {
    glancing = glance;
    if (glance) {
      penUp();                                         // 긋던 획은 끝낸다
      closePops();
      glanceSide = me.pos.x > 0.3 ? -1 : 1;            // 칠판 가운데 쪽으로 몸을 연다
    }
    dirty = true;
  }
  me.writeOn = atBoard && !glancing && (me.mode === 'free' || pen.id !== null);
  if (atBoard && me.mode === 'free') {                 // 다 왔으면 칠판 쪽으로 돌아선다 (돌아보는 중에는 학생 쪽으로)
    const lookTo = glancing ? Math.atan2(-me.pos.x * 0.7, HD * 0.9) : FRONT;       // 강의실 한가운데쯤
    const bodyTo = glancing ? lookTo + glanceSide * 1.2 : FRONT;                   // 몸은 옆으로, 고개만 학생 쪽으로
    const pitchTo = glancing ? 0.08 : -0.3;
    const k = 1 - Math.exp(-9 * dt), turn = wrap(bodyTo - me.bodyYaw), head = wrap(lookTo - me.lookYaw), nod = pitchTo - me.lookPitch;
    if (Math.abs(turn) > 0.004 || Math.abs(head) > 0.004 || Math.abs(nod) > 0.004) {
      me.bodyYaw += turn * k;
      me.lookYaw += head * k;
      me.lookPitch += nod * k;
      me.applyPose();
      active = true;
    }
  }
  const all = [me];
  for (const peer of peers.values()) all.push(peer.actor);
  for (const a of all) {
    const want = a.writeOn ? 1 : 0, dx = a.handTo.x - a.hand.x, dy = a.handTo.y - a.hand.y;
    if (a.writeAmt === want && (!want || Math.abs(dx) + Math.abs(dy) < 0.003)) continue;
    const k = 1 - Math.exp(-12 * dt);

    a.hand.x += dx * k;
    a.hand.y += dy * k;

    active = true;

}

// 앉아 있을 때: 앞·뒤·옆 한 칸에 앉은 친구의 자리를 바라보고 있으면 그 자리를 돌려준다
let whisperNear = false;             // 소곤거릴 수 있는 친구가 앞·뒤·옆에 앉아 있는지
let whisperHinted = false;           // 이번에 앉은 뒤로 안내를 띄웠는지
let seatHinted = false;
function whisperLooked() {
  whisperNear = false;
  const mine = player.seat;
  if (!mine) return null;
  const cp = Math.cos(player.lookPitch);
  viewRay.origin.copy(camera.position);
  viewRay.direction.set(Math.sin(player.lookYaw) * cp, -Math.sin(player.lookPitch), Math.cos(player.lookYaw) * cp);
  let found = null, best = REACH * REACH;
  for (const s of seats) {
    const who = s.taken;
    if (!isNeighbor(mine, s) || !who || who === player || who.sitAmt < 0.9) continue;
    if (who.peerId ? !link : who !== mate || online()) continue;    // 함께 접속한 사람, 또는 혼자 입장했을 때의 친구
    whisperNear = true;
    // 친구의 책상·의자뿐 아니라 친구 몸을 바라봐도 된다. 단, 칠판 쪽에 앉은 친구는 칠판을 볼 때 늘 시야에 걸리므로 의자를 봐야 한다
    const front = Math.abs(wrap(Math.atan2(s.sit.x - mine.sit.x, s.sit.z - mine.sit.z) - Math.atan2(BOARD.x - mine.sit.x, BOARD.z - mine.sit.z))) < 0.6;
    for (const b of front ? s.boxes : [...s.boxes, s.body]) {

// 소곤거릴 수 있는 이웃 자리인지 (강의실을 지을 때 자리마다 이웃을 정해 둔다)
function isNeighbor(a, b) {
  return !!a && !!b && a.near.includes(b);
}

/* ── 상호작용 규칙 ──
   X        바라본 것(테두리가 뜬 것)에 하는 행동 하나. 바라본 것이 없으면 아무 일도 하지 않는다
            자리 · 교탁 · 문은 손이 닿을 만큼 가까이서, 칠판은 멀리서도 고를 수 있다

   ← →      이전 · 다음: 칠판 보기에서는 옆 영역, 자리나 교탁에 있는 선생님에게는 슬라이드
   Q · E    학생 전용: 질문 · 이해했어요

function updateTarget() {
  let t = null;
  takenSeat = null;
  if (entered && !zoomed && player.mode === 'free') {
    const seen = lookedAt();
    if (seen && seen.taken) takenSeat = seen;      // 이미 누가 앉은 자리는 고를 수 없다
    else t = seen || screenLooked();               // 칠판 보기는 누구나, 어디서나
  } else if (entered && !zoomed && player.mode === 'seated') {
    t = whisperLooked() || screenLooked();         // 앉아서는 옆자리 친구와 소곤거리거나 칠판을 본다
  }
  const seated = entered && player.mode === 'seated' && !player.seat.stand;      // 교탁에 서 있는 것은 학생 메뉴와 상관없다
  if ($('askBtn').hidden === seated) $('askBtn').hidden = $('okBtn').hidden = !seated;     // 앉으면 학생 메뉴가 뜬다
  if (!seated) whisperHinted = seatHinted = false;

  } else if (whisperNear && !whisperHinted) {          // 나중에 옆에 친구가 앉으면 그때 알려 준다
    whisperHinted = true;
    toast('옆자리 친구를 바라보면 X 키로 소곤거릴 수 있어요', 5000);
  }
  if (!seated && !($('ask').hidden && $('whisper').hidden)) { $('ask').hidden = $('whisper').hidden = true; }
  if (t !== target) {
    target = t;

  const label = !target ? ''
    : target.kind === 'door' ? '나가기'
    : target.kind === 'screen' ? (canWrite() ? '칠판에 쓰기' : '칠판 보기')
    : target.kind === 'whisper' ? '소곤거리기'
    : target.stand ? '교탁에 서기' : '앉기';
  if (label !== actLabel) {
    actLabel = label;
    $('act').hidden = !label;
    $('actText').textContent = label;
  }
  // Esc 단추: 한 단계 뒤로
  const back = !entered ? ''
    : zoomed ? '돌아가기'
    : player.mode === 'seated' ? (player.seat.stand ? '내려오기' : '일어나기')
    : player.mode === 'path' ? '멈추기' : '';

    $('backBtn').hidden = !back;
