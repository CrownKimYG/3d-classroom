<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D 강의실</title>
<style>
  :root {
    --ink: #33241a;
    --paper: #fff6e3;
    --coral: #ff8257;
    --mint: #8fcdb0;
    --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #241c15; color: var(--ink); font-family: var(--font);
    -webkit-user-select: none; user-select: none;
  }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; outline: none; cursor: grab;
  }
  #view.drag { cursor: grabbing; }
  #view.pen { cursor: crosshair; }

  /* ── 입장 화면 ── */
  #entry {
    position: fixed; inset: 0; display: grid; align-items: center; justify-items: start;
    padding: 20px clamp(16px, 7vw, 110px);
    background: linear-gradient(90deg, rgba(36, 24, 14, .62), rgba(36, 24, 14, .08) 70%);
  }
  .card {
    width: min(372px, 100%); background: var(--paper);
    border: 3px solid var(--ink); box-shadow: 8px 8px 0 rgba(0, 0, 0, .38);
    padding: 22px 22px 18px;
  }
  .room-no {
    display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .14em;
    background: var(--mint); border: 2px solid var(--ink); padding: 3px 8px;
  }
  h1 { margin: 0; font-size: 24px; line-height: 1.1; letter-spacing: -.02em; }
  .note:empty { display: none; }
  .sub { margin: 0 0 14px; font-size: 14px; line-height: 1.55; opacity: .78; }
  /* 입장 순서: 한 항목을 정하면 다음 항목이 나타난다 */
  .step { margin-top: 14px; }
  .step:not([hidden]) { animation: stepIn .25s ease-out; }
  @keyframes stepIn { from { opacity: 0; transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .step:not([hidden]) { animation: none; } }
  .step > label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 800; }
  .line { display: flex; gap: 8px; }
  .mini {
    flex: none; padding: 0 16px; font: 800 14px var(--font); color: #fff; background: var(--ink);
    border: 3px solid var(--ink); border-radius: 0; cursor: pointer;
  }
  .line input[readonly] { background: #f3e9d2; }
  .fields input, .line input {
    display: block; width: 100%; padding: 8px 10px;
    font: inherit; font-size: 16px; font-weight: 700; color: var(--ink);
    background: #fff; border: 3px solid var(--ink); border-radius: 0;
    outline: none; -webkit-user-select: text; user-select: text;
  }
  .line input:focus { background: #f2fbf6; }
  .line input::placeholder { font-size: 13px; font-weight: 500; color: rgba(51, 36, 26, .45); }
  .note { margin: 8px 0 0; font-size: 12px; line-height: 1.5; opacity: .75; }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick button {
    display: flex; align-items: center; gap: 10px; padding: 10px;
    font: inherit; font-size: 16px; font-weight: 800; text-align: left; color: var(--ink);
    background: #fff; border: 3px solid var(--ink); border-radius: 0; cursor: pointer;
  }
  .pick i { flex: none; width: 24px; height: 24px; background: var(--c); border: 2px solid var(--ink); }
  .pick small { display: block; font-size: 11px; font-weight: 600; opacity: .7; }
  .pick.three { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .pick.three button { flex-direction: column; gap: 6px; padding: 10px 4px; font-size: 14px; text-align: center; --c: #ffd84a; }
  .pick canvas, .pick.three i { flex: none; width: 36px; height: 36px; image-rendering: pixelated; border: 2px solid var(--ink); }
  .pick.three i { display: grid; place-items: center; font: 800 22px/1 var(--font); font-style: normal; background: #fff; }
  .pick [hidden] { display: none; }
  .skin { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .skin > span:first-child { flex: 1; font-size: 12px; line-height: 1.45; opacity: .8; }
  .skin #skinMore { display: flex; gap: 6px; flex: none; }
  .skin [hidden] { display: none !important; }
  .skin .mini { flex: none; white-space: nowrap; }
  .pick button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--c) 30%, #fff);
    box-shadow: 0 4px 0 var(--ink); transform: translateY(-2px);
  }
  .go {
    width: 100%; margin-top: 14px; font: inherit; font-size: 18px; font-weight: 800;
    padding: 12px; color: #fff; background: var(--coral);
    border: 3px solid var(--ink); border-radius: 0; box-shadow: 0 5px 0 var(--ink); cursor: pointer;
  }
  .go:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .keys {
    list-style: none; margin: 20px 0 0; padding: 14px 0 0;
    border-top: 2px dashed rgba(51, 36, 26, .3);
    display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; font-size: 12.5px;
  }
  kbd {
    display: inline-block; min-width: 21px; padding: 1px 5px; margin-right: 2px;
    font: 700 11px ui-monospace, Menlo, Consolas, monospace; text-align: center; color: var(--ink);
    background: #fff; border: 2px solid var(--ink); border-bottom-width: 3px;
  }

  /* ── 입장 후 화면 위 표시 ── */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .chip {
    position: absolute; background: rgba(255, 246, 227, .93);
    border: 2px solid var(--ink); padding: 6px 10px; font: 600 12px var(--font); color: var(--ink);
  }
  /* 시스템 정보 (F3): 마인크래프트의 F3 화면처럼 반투명 띠에 흰 글씨로 한 줄씩 */
  #perf {
    position: absolute; left: 12px; top: 124px; display: grid; justify-items: start; gap: 2px; pointer-events: none;
    font: 600 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #fff; text-shadow: 1px 1px 0 #3a3a3a;
  }
  #perf[hidden] { display: none; }
  #perf span { padding: 1px 6px; background: rgba(60, 60, 60, .6); white-space: pre; }
  #att { left: 12px; top: 12px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* 화면 가운데 십자선: 이것으로 바라본 물체에 테두리가 뜬다 */
  #hud > #aim {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px;
    pointer-events: none; filter: drop-shadow(0 0 1px rgba(30, 20, 12, .95));
  }
  #aim::before, #aim::after { content: ""; position: absolute; background: #fff; }
  #aim::before { left: 7px; top: 0; width: 2px; height: 16px; }
  #aim::after { left: 0; top: 7px; width: 16px; height: 2px; }

  #room { left: 12px; top: 48px; cursor: pointer; border-radius: 0; }
  /* 입장 화면: 지난번처럼 들어가기 · 처음으로 · 강의실 미리 고르기, 입장 직후의 초대 링크 안내 */
  #entry .card { max-height: calc(100vh - 40px); overflow-y: auto; }      /* 화면이 낮으면 카드 안에서 스크롤 */
  #roleNote { margin: 6px 0 0; font-weight: 800; opacity: 1; }
  .again { margin-top: 10px; font-size: 15px; }
  .again small { display: block; font-size: 11px; font-weight: 600; opacity: .75; }
  .linkish {
    margin-top: 12px; padding: 0; font: 700 12px var(--font); color: var(--ink); opacity: .7;
    background: none; border: 0; text-decoration: underline; cursor: pointer;
  }
  #stepRoom label small { font-weight: 600; opacity: .7; margin-left: 4px; }
  #stepRoom .seg + .seg { margin-top: 6px; }
  #invite {
    left: 50%; top: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    padding: 6px 8px 6px 12px; font-size: 13px; font-weight: 800; background: var(--paper); box-shadow: 0 4px 0 var(--ink); white-space: nowrap;
  }
  #invite button { font: 800 13px var(--font); color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 0; cursor: pointer; padding: 5px 10px; }
  #inviteCopy { color: #fff !important; background: var(--coral) !important; }
  #toast {
    left: 50%; top: 18%; transform: translateX(-50%); max-width: min(560px, 90vw); text-align: center; line-height: 1.5;
    font-size: 14px; font-weight: 800; background: var(--paper); box-shadow: 0 4px 0 var(--ink);
  }

  /* ── 퇴장 확인창 ── */
  #exit, #confirm {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(36, 24, 14, .55);
  }
  #exit h2, #confirm h2 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.02em; }
  #exit p, #confirm p { margin: 0; font-size: 14px; line-height: 1.6; }
  #exit b { font-variant-numeric: tabular-nums; }

  /* ── 선생님: 입장 화면의 체크 칸, 큰 스크린을 조작하는 리모컨 ── */
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--coral); }
  #remoteBtn { left: 12px; top: 84px; cursor: pointer; border-radius: 0; box-shadow: 0 3px 0 var(--ink); }
  #remote {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 148px;
    display: grid; gap: 8px; padding: 14px 12px 20px; background: #2b2e36;
    border: 3px solid #14161b; border-radius: 22px; box-shadow: 0 6px 0 rgba(0, 0, 0, .35);
  }
  #remoteLed {
    padding: 5px 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font: 700 12px ui-monospace, Menlo, Consolas, monospace; color: #9dffb0;
    background: #10231a; border: 2px solid #14161b; border-radius: 6px;
  }
  #remote button {
    padding: 8px 4px; font: 800 13px var(--font); color: #fff; background: #4a4f5c;
    border: 2px solid #14161b; border-radius: 10px; box-shadow: 0 3px 0 #14161b; cursor: pointer;
  }
  #remote button:active { transform: translateY(2px); box-shadow: 0 1px 0 #14161b; }
  #remote button:disabled { opacity: .4; cursor: default; }
  #remote .power { background: #e0503c; }
  #remote #laserBtn[aria-pressed="true"] { color: #2b0906; background: #ff6b5e; box-shadow: 0 3px 0 #14161b, 0 0 12px #ff3b30; }
  /* 자주 쓰는 것이 위로: 장 넘기기 → 포인터 · 판서 → 띄우기(하위 메뉴) · 끄기 → 더보기(하위 메뉴) */
  #remote .arrows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #remote .arrows button { padding: 0; font-size: 20px; border-radius: 50%; aspect-ratio: 1; }
  #remote .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #remote .pair button { display: grid; justify-items: center; gap: 3px; padding: 8px 2px 6px; }
  #remote kbd {
    padding: 0 5px; min-width: 0; font: 800 10px var(--font); color: #14161b; background: #c9ccd2;
    border: 0; border-radius: 3px; box-shadow: none;
  }
  #remote .menu { position: relative; display: grid; }
  #remote .more::after { content: '◂'; position: absolute; left: 8px; opacity: .7; }      /* 왼쪽으로 하위 메뉴가 열린다 */
  #remote .more { position: relative; }
  #remote .more[aria-expanded="true"] { background: #6a7181; }
  #remote .pop {
    position: absolute; right: calc(100% + 18px); top: 50%; transform: translateY(-50%); z-index: 3; width: 168px;
    display: grid; gap: 6px; padding: 10px; background: #2b2e36; border: 3px solid #14161b; border-radius: 16px;
    box-shadow: 0 6px 0 rgba(0, 0, 0, .35);
  }
  #remote .pop[hidden] { display: none; }
  #remote .pop button { display: grid; gap: 1px; padding: 8px 10px; text-align: left; }
  #remote .pop small { font-size: 10.5px; font-weight: 600; opacity: .72; }
  /* ── 강의실 설정 창 · 소리 단추 · 펜 고르기 ── */
  #soundBtn { right: 12px; top: 46px; cursor: pointer; border-radius: 0; }
  #setup {
    left: 12px; top: 120px; width: 316px; max-width: calc(100% - 24px); max-height: calc(100% - 136px);
    overflow-y: auto; padding: 10px 10px 12px; background: var(--paper); box-shadow: 0 4px 0 var(--ink);
  }
  #setup .head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
  #setup .head button { font: 800 16px var(--font); color: var(--ink); background: none; border: 0; cursor: pointer; }
  #setup h3 { margin: 10px 0 4px; font-size: 12px; font-weight: 800; }
  #setupNote { margin: 5px 0 0; font-size: 11px; opacity: .75; }
  .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(52px, 1fr)); gap: 4px; }
  .seg button {
    padding: 6px 2px; font: 800 12px/1.25 var(--font); color: var(--ink); background: #fff;
    border: 2px solid var(--ink); border-radius: 0; cursor: pointer;
  }
  .seg small { display: block; font-size: 10px; font-weight: 600; opacity: .75; }
  .seg button[aria-pressed="true"] { color: #fff; background: var(--coral); }
  .seg button:disabled { opacity: .4; cursor: default; }
  .seg button:focus-visible { outline: 3px solid var(--mint); outline-offset: 1px; }
  #pens {
    left: 50%; bottom: 116px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 12px; padding: 6px 8px;
  }
  #pens .grp { display: flex; align-items: center; gap: 4px; }
  #areas button, #pens .pop button {
    font: 800 12px var(--font); color: var(--ink); background: #fff; border: 2px solid var(--ink);
    border-radius: 0; cursor: pointer; padding: 6px 8px;
  }
  #areas button[aria-pressed="true"] { color: #fff; background: var(--coral); }
  /* 펜 도구 단추: 마인크래프트의 소지품 칸처럼 생긴 네모 칸에 픽셀 그림을 담는다. 고른 칸은 흰 테두리가 둘러진다 */
  #pens .slot {
    position: relative; width: 38px; height: 38px; padding: 0; display: grid; place-items: center;
    background: #8b8b8b; border: 2px solid var(--ink); border-radius: 0; cursor: pointer; color: #fff;
    box-shadow: inset 2px 2px 0 #4a4a4a, inset -2px -2px 0 #d8d8d8;
  }
  #pens .slot[aria-pressed="true"] { background: #b9b9b9; border-color: var(--coral); box-shadow: inset 0 0 0 3px #fff; }
  #pens .slot:focus-visible, #pens .pop button:focus-visible { outline: 3px solid var(--mint); outline-offset: 1px; }
  #pens img { width: 32px; height: 32px; image-rendering: pixelated; pointer-events: none; display: block; }
  #pens .more::after {                 /* 누르면 하위 메뉴가 열리는 칸: 오른쪽 아래의 작은 계단 세모 */
    content: ''; position: absolute; right: 3px; bottom: 3px; width: 2px; height: 2px; background: #fff;
    box-shadow: -2px 0 #fff, -4px 0 #fff, 0 -2px #fff, -2px -2px #fff, 0 -4px #fff;
  }
  #pens .menu { position: relative; display: flex; }
  #pens .pop {
    position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); z-index: 2;
    display: flex; gap: 4px; padding: 5px; background: rgba(255, 246, 227, .97); border: 2px solid var(--ink);
  }
  #pens .pop[hidden], #pens [hidden] { display: none !important; }
  #pens .pop button { display: grid; justify-items: center; gap: 2px; padding: 4px 6px; font-size: 11px; white-space: nowrap; }
  #pens .pop button[aria-pressed="true"] { color: #fff; background: var(--coral); }
  #pens .pop button[hidden] { display: none; }
  #pens .pop .slot { padding: 0; }
  #pens .block {                       /* 색: 양털 블록처럼 위 · 왼쪽이 밝고 아래 · 오른쪽이 어두운 네모 */
    width: 24px; height: 24px; background: var(--c, #333); pointer-events: none;
    box-shadow: inset 3px 3px 0 rgba(255, 255, 255, .38), inset -3px -3px 0 rgba(0, 0, 0, .3), 0 0 0 2px #1b1b1b;
  }
  #penSizes i { width: var(--d); height: var(--d); background: #fff; box-shadow: 0 0 0 2px #1b1b1b; pointer-events: none; }
  /* 판서 뷰의 영역 단추: ◀ 1 2 3 ▶ */
  #areas {
    left: 50%; top: 12px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 5px 6px;
  }
  #areas button { min-width: 30px; padding: 5px 6px; }
  #areas #followBtn { margin-left: 6px; padding: 5px 9px; }
  #areas button:disabled { opacity: .35; cursor: default; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .row .go { font-size: 16px; }
  .go.ghost { color: var(--ink); background: #fff; }
  .go:focus-visible, .pick button:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  /* 조작법: 화면 가운데의 반투명 가상 키보드. 누른 키에 불이 들어오고, 눌러 본 키에는 초록 테가 남는다 */
  #keys { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; pointer-events: none; }
  #keys[hidden] { display: none; }
  .kb {
    --u: clamp(30px, 5.4vw, 50px);
    max-width: calc(100% - 16px); padding: 14px 16px; color: #fff6e3;
    background: rgba(24, 19, 14, .62); border: 2px solid rgba(255, 246, 227, .5);
  }
  .kbTop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 10px; }
  .kbTop b { font-size: 16px; }
  .kbTop span { font-size: 12px; opacity: .85; }
  #keyRows { display: grid; gap: 4px; }
  .krow { display: flex; gap: 4px; }
  .key {
    position: relative; flex: none; width: calc(var(--u) * var(--w, 1) + 4px * (var(--w, 1) - 1)); height: var(--u);
    background: rgba(139, 139, 139, .55); border: 2px solid rgba(20, 16, 12, .8);
    box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .28), inset -2px -2px 0 rgba(0, 0, 0, .3);
  }
  .key b { position: absolute; left: 4px; top: 2px; font-size: 11px; font-weight: 800; }
  .key span { position: absolute; left: -4px; right: -4px; bottom: 4px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: -.5px; white-space: nowrap; }
  .key.none { opacity: .35; }
  .key.done { border-color: #7ee08f; }
  .key.on { color: var(--ink); background: #fff6e3; box-shadow: inset 0 0 0 2px var(--coral); transform: translateY(1px); }
  .kgap { flex: none; width: calc(var(--u) * var(--w)); }
  /* 키에 마우스를 올리면 그 키의 설명이 키 바로 위에 뜬다 */
  .key[data-tip] { pointer-events: auto; cursor: help; }
  .key[data-tip]:hover { z-index: 3; border-color: #fff6e3; }
  .key[data-tip]:hover::after {
    content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
    width: max-content; max-width: 250px; padding: 7px 10px; font-size: 12px; font-weight: 600; line-height: 1.5; letter-spacing: 0;
    white-space: normal; text-align: left; color: var(--ink); background: #fff6e3; border: 2px solid var(--ink);
  }
  .kbFoot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 12px; pointer-events: auto; }
  .kbFoot label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .kbFoot button, #keysBtn { font: 800 13px var(--font); color: var(--ink); cursor: pointer; }
  .kbFoot button { padding: 6px 12px; background: #fff6e3; border: 2px solid var(--ink); border-radius: 0; }
  .kbFoot kbd, #keysBtn kbd { display: inline-block; margin-right: 4px; padding: 0 5px; font: 800 11px var(--font); color: #fff6e3; background: var(--ink); }
  #keysBtn { left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 12px; }
  #keysBtn[hidden] { display: none; }
  /* 아래쪽 단추: 윗줄에는 바라본 것에 하는 일(주황색 X), 아랫줄에는 늘 쓰는 단추들 */
  #acts { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); display: grid; justify-items: center; gap: 10px; }
  #acts .row { display: flex; gap: 8px; }
  #acts .row:not(:has(button:not([hidden]))) { display: none; }
  #acts button {
    font: 800 16px var(--font); color: var(--ink); background: var(--paper);
    padding: 10px 16px; border: 3px solid var(--ink); border-radius: 0;
    box-shadow: 0 4px 0 var(--ink); cursor: pointer; white-space: nowrap;
  }
  #acts #act { color: #fff; background: var(--coral); }
  #acts button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  #acts kbd { margin-right: 8px; }

<script type="module">
/* ════════════════════════════════════════════════════════════════
   3D 강의실  —  파일 하나로 돌아가는 가벼운 three.js 장면

   부하를 줄이는 방법 (이 파일 전체에 적용되어 있어요)
   1. 책상·의자처럼 반복되는 물체는 InstancedMesh 로 한 번에 그린다
   2. 텍스처는 그림 파일 없이 작은 캔버스(16~128px)에 코드로 그린다
   3. 실시간 그림자 대신 바닥에 깔린 반투명 "가짜 그림자"를 쓴다
   4. 움직임이 없으면 화면을 다시 그리지 않는다 (렌더 온 디맨드)
   5. 고해상도 화면에서도 픽셀 배율을 1.5배까지만 쓴다
   6. 충돌·길찾기는 3D 엔진 없이 간단한 계산으로 처리한다
   ════════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);

function fail(message) {
  $('entry').hidden = true;
  $('hud').hidden = true;
  $('fail').textContent = message;
  $('fail').hidden = false;
}

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js');
} catch (err) {
  fail('3D 엔진(three.js)을 내려받지 못했어요. 인터넷 연결을 확인한 뒤 새로고침 해 주세요.');
  throw err;
}

/* ───────────── 설정 (강의실의 크기와 자리 배치는 아래 "강의실 짓기"의 FORMS 에 있어요) ───────────── */
const CHARACTERS = {                                      // 기본 스킨 두 가지: 옷·머리 색 (이름은 없다. 이름은 들어올 때 적은 것만 쓴다)
  roy: {
    label: '초록 후드', hood: '#5fc46b', hoodDark: '#3f9f52', pants: '#44568a',
    hair: '#5a3a2a', hairLight: '#7b5340', longHair: false, pin: false,
  },
  stella: {
    label: '분홍 후드', hood: '#ff9cc2', hoodDark: '#e9749f', pants: '#7c6bb0',
    hair: '#4b2e39', hairLight: '#6d4656', longHair: true, pin: true,
  },
};
const DOOR = { z: 5.7, w: 1.3, h: 2.3, y: 0 };            // 나가는 문 (오른쪽 벽). 위치는 강의실 형태마다 다르다
const WALK = 2.4, RUN = 4.4, JUMP = 3.7, GRAVITY = 12;    // 걷기·달리기 속도, 점프 세기, 중력
// 캐릭터의 몸은 마인크래프트와 같은 비율이다: 한 점(u) = 4cm, 머리 8×8×8 · 몸통 8×12×4 · 팔다리 4×12×4 점 (키 32점 = 1.28m)
const AV = { u: 0.04, leg: 0.48, body: 0.48, head: 0.32, armX: 0.24, shoulder: 0.88 };     // armX · shoulder = 어깨 관절의 옆 위치 · 높이
const EYE_H = AV.leg + AV.body + AV.head / 2;             // 눈높이 = 머리 한가운데
const SEAT_RISE = -0.11;                                  // 앉으면 엉덩이가 의자 높이까지 내려간다
const MATE_WANDERS = true;                                // (혼자 입장했을 때) 친구가 가끔 자리를 옮길지

// 다른 기기의 사람들과 함께 접속하려면 Supabase 프로젝트의 주소와 공개 키를 따옴표 안에 붙여 넣으세요.
// 비워 두면 수업 코드는 "이 컴퓨터, 같은 브라우저의 다른 탭"끼리만 연결됩니다.
const SUPABASE_URL = 'https://hytmgqimlenezxczahda.supabase.co';          // Supabase 프로젝트 "3d-classroom"
const SUPABASE_KEY = 'sb_publishable_Txj300KhZywVoWekncW1rA_3go0XLOW';   // 공개(Publishable) 키. secret 키는 절대 넣지 마세요
const MAX_PIXEL_RATIO = 1.5;                              // 낮출수록 가볍고, 높일수록 선명

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const TAU = Math.PI * 2;
const wrap = (a) => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;   // 각도를 -180°~180° 로 맞춘다
const FRONT = Math.PI;             // 스크린 쪽을 바라보는 방향 (0 = 뒤쪽 벽)

// 항상 같은 무늬가 나오도록 하는 간단한 난수
function rng(seed) {
  return () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

// 캔버스에 그림을 그려 텍스처로 만든다. 기본은 "픽셀이 또렷한" 도트 스타일
function makeTex(w, h, draw, { smooth = false, repeat = false } = {}) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (!smooth) t.magFilter = THREE.NearestFilter;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// 같은 모양 여러 개를 한 번의 그리기 호출로 처리 (InstancedMesh)
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();
const _p = new THREE.Vector3(), _s = new THREE.Vector3();
function instanced(geo, mat, list) {
  const mesh = new THREE.InstancedMesh(geo, mat, list.length);
  list.forEach((it, i) => {
    _e.set(...(it.r || [0, 0, 0]));
    _m.compose(_p.set(...it.p), _q.setFromEuler(_e), _s.set(...(it.s || [1, 1, 1])));
    mesh.setMatrixAt(i, _m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  return addStatic(mesh);
}

// 아틀라스(여러 그림을 모은 한 장)에서 원하는 칸을 면에 입힌다
function setFaceUV(geo, face, [x, y, w, h], size = 64) {
  const uv = geo.attributes.uv, e = 0.02;
  const u0 = (x + e) / size, u1 = (x + w - e) / size;
  const v0 = 1 - (y + h - e) / size, v1 = 1 - (y + e) / size;
  for (let i = 0; i < 4; i++) {
    const k = face * 4 + i;
    uv.setXY(k, uv.getX(k) > 0.5 ? u1 : u0, uv.getY(k) > 0.5 ? v1 : v0);
  }
}
function atlasBox(w, h, d, faces) {
  const geo = new THREE.BoxGeometry(w, h, d);
  ['px', 'nx', 'py', 'ny', 'pz', 'nz'].forEach((name, f) => setFaceUV(geo, f, faces[name] || faces.all));
  return geo;
}

function drawClock(g) {
  g.clearRect(0, 0, 64, 64);
  g.fillStyle = '#33241a';
  g.beginPath(); g.arc(32, 32, 31, 0, 7); g.fill();
  g.fillStyle = '#fffdf5';
  g.beginPath(); g.arc(32, 32, 26, 0, 7); g.fill();
  g.fillStyle = '#33241a';
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    g.fillRect(32 + Math.sin(a) * 21 - 1.5, 32 - Math.cos(a) * 21 - 1.5, 3, 3);
  }
  const now = new Date(), min = now.getMinutes(), hour = (now.getHours() % 12) + min / 60;
  const hand = (a, len, width) => {
    g.strokeStyle = '#33241a'; g.lineWidth = width; g.lineCap = 'round';
    g.beginPath(); g.moveTo(32, 32); g.lineTo(32 + Math.sin(a) * len, 32 - Math.cos(a) * len); g.stroke();
  };
  hand(hour * Math.PI / 6, 12, 4);
  hand(min * Math.PI / 30, 19, 3);
  g.fillStyle = '#ff8257';
  g.beginPath(); g.arc(32, 32, 3, 0, 7); g.fill();
  return min;
}
let clockMinute = -1;
const clockTex = makeTex(64, 64, (g) => { clockMinute = drawClock(g); }, { smooth: true });

/* 아바타의 스킨: 마인크래프트 스킨과 같은 64×64 펼침면을 쓴다 (그래서 마인크래프트 스킨 PNG 를 그대로 입힐 수 있다).
   부위마다 [오른쪽 옆 · 앞 · 왼쪽 옆 · 뒤] 가 한 줄로 놓이고 그 위에 [윗면 · 아랫면] 이 놓인다.
     머리 (0,0)   몸통 (16,16)   오른팔 (40,16)   오른다리 (0,16)   왼팔 (32,48)   왼다리 (16,48)
   slim = 팔 폭이 3점인 스킨, blink = 눈 깜빡임 그림(56,16)이 들어 있는 스킨 (기본 캐릭터만) */
function makeSkin(canvas, { slim = false, blink = false } = {}) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  return { canvas, slim, blink, ghost: null, mat: new THREE.MeshLambertMaterial({ map: tex, alphaTest: 0.5 }) };
}
function dropSkin(skin) {
  crowd.freeSkin(skin);               // 스킨 모음에서 쓰던 칸을 돌려준다
  skin.mat.map.dispose();
  skin.mat.dispose();
  if (skin.ghost) skin.ghost.dispose();
}
const blankSkin = () => Object.assign(document.createElement('canvas'), { width: 64, height: 64 });

// 기본 스킨 두 가지(초록 후드 · 분홍 후드)를 그린다: 후드티 · 바지 · 운동화
function defaultSkin(look) {
  const canvas = blankSkin(), g = canvas.getContext('2d');
  const R = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  const SKIN = '#ffdcb8', SKIN_D = '#f2c29b', EYE = '#2e2433', SHOE = '#fafafa', SOLE = '#d5d5d5', PIN = '#ffd84a';
  const { hood: HOOD, hoodDark: HOOD_D, pants: PANTS, hair: HAIR, hairLight: HAIR_L } = look;
  const long = look.longHair;

  // 머리: 정수리 (8,0) · 턱 밑 (16,0)
  R(HAIR, 8, 0, 8, 8); R(HAIR_L, 10, 2, 3, 1); R(HAIR_L, 9, 3, 1, 2); R(HAIR_L, 13, 5, 2, 1);
  R(SKIN_D, 16, 0, 8, 8);
  // 얼굴 (8,8)
  R(SKIN, 8, 8, 8, 8); R(HAIR, 8, 8, 8, 2); R(HAIR_L, 10, 8, 2, 1);
  R(HAIR, 8, 10, 1, long ? 6 : 2); R(HAIR, 15, 10, 1, long ? 6 : 2);
  R(HAIR, 10, 10, 1, 1); R(HAIR, 12, 10, 2, 1);
  if (look.pin) R(PIN, 13, 9, 2, 1);               // 머리핀
  R('#ffffff', 9, 11, 1, 2); R(EYE, 10, 11, 1, 2); R(EYE, 13, 11, 1, 2); R('#ffffff', 14, 11, 1, 2);
  R('#ff9d9d', 9, 13, 1, 1); R('#ff9d9d', 14, 13, 1, 1);
  R('#c9584e', 11, 14, 2, 1);
  R(SKIN_D, 9, 15, 6, 1);
  // 오른쪽 옆머리 (0,8): 오른쪽 끝이 얼굴 쪽 · 왼쪽 옆머리 (16,8): 왼쪽 끝이 얼굴 쪽
  R(SKIN, 0, 8, 8, 8); R(HAIR, 0, 8, 8, 3); R(HAIR, 0, 11, 4, long ? 5 : 3); R(HAIR, 7, 11, 1, long ? 5 : 1); R(SKIN_D, 4, 12, 1, 2);
  R(SKIN, 16, 8, 8, 8); R(HAIR, 16, 8, 8, 3); R(HAIR, 20, 11, 4, long ? 5 : 3); R(HAIR, 16, 11, 1, long ? 5 : 1); R(SKIN_D, 19, 12, 1, 2);
  // 뒤통수 (24,8)
  R(HAIR, 24, 8, 8, 8); R(HAIR_L, 26, 9, 3, 1); R(HAIR_L, 29, 11, 2, 1);
  if (!long) { R(SKIN, 24, 15, 8, 1); R(HAIR, 24, 15, 2, 1); R(HAIR, 27, 15, 2, 1); R(HAIR, 31, 15, 1, 1); }
  // 감은 눈 (56,16): 눈 자리만 덮고 나머지는 투명
  R(SKIN_D, 57, 19, 2, 2); R(SKIN_D, 61, 19, 2, 2); R(EYE, 57, 20, 2, 1); R(EYE, 61, 20, 2, 1);

  // 몸통: 어깨 위 (20,16) · 아래 (28,16) · 오른쪽 옆 (16,20) · 앞 (20,20) · 왼쪽 옆 (28,20) · 뒤 (32,20)
  R(HOOD_D, 20, 16, 8, 4); R(PANTS, 28, 16, 8, 4);
  R(HOOD, 16, 20, 24, 12); R(HOOD_D, 16, 31, 24, 1);
  R(HOOD_D, 22, 20, 4, 2); R(SKIN, 23, 20, 2, 1); R('#ffffff', 22, 22, 1, 2); R('#ffffff', 25, 22, 1, 2);
  R(HOOD_D, 21, 26, 6, 1); R(HOOD_D, 21, 26, 1, 3); R(HOOD_D, 26, 26, 1, 3);
  R(HOOD_D, 33, 20, 6, 4); R(HOOD, 34, 20, 4, 3);

// 마인크래프트 스킨 그림을 이 캐릭터에 맞게 다듬는다. 스킨이 아니면 null
//   · 64×64 (요즘 스킨) 과 64×32 (옛 스킨: 왼팔 · 왼다리는 오른쪽을 뒤집어 쓴다) 를 받는다. 큰 그림(128 …)은 64 로 줄인다
//   · 겉옷 층(모자 · 재킷 · 소매 · 바지 겉감)은 따로 그리지 않고 속 그림 위에 겹쳐 한 장으로 만든다 (그릴 도형을 늘리지 않으려고)
function skinFromImage(img) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (!(w >= 64 && w <= 1024 && w % 64 === 0 && (h === w || h * 2 === w))) return null;
  const old = h !== w;
  const src = Object.assign(document.createElement('canvas'), { width: 64, height: old ? 32 : 64 });
  const sg = src.getContext('2d', { willReadFrequently: true });
  sg.imageSmoothingEnabled = false;
  sg.drawImage(img, 0, 0, 64, src.height);
  const clear = (x, y, cw, ch) => sg.getImageData(x, y, cw, ch).data.every((v, i) => i % 4 !== 3 || v === 0);       // 모두 투명한지
  const solid = (x, y, cw, ch) => sg.getImageData(x, y, cw, ch).data.every((v, i) => i % 4 !== 3 || v === 255);    // 모두 불투명한지
  const slim = !old && clear(54, 20, 2, 12);       // 팔이 3점짜리 스킨은 오른팔 칸의 끝 두 줄이 비어 있다

  const canvas = blankSkin(), g = canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#000000';                         // 속 그림의 빈 곳은 마인크래프트처럼 검게 나온다
  g.fillRect(0, 0, 64, 64);
  g.drawImage(src, 0, 0);
  if (old) {                                       // 옛 스킨: 오른팔 · 오른다리를 좌우로 뒤집어 왼쪽을 만든다
    const flip = (sx, sy, cw, ch, dx, dy) => {
      g.save();
      g.translate(dx + cw, dy);
      g.scale(-1, 1);
      g.drawImage(src, sx, sy, cw, ch, 0, 0, cw, ch);
      g.restore();
    };
    for (const [sx, sy, dx, dy] of [[0, 16, 16, 48], [40, 16, 32, 48]]) {
      flip(sx + 4, sy, 4, 4, dx + 4, dy); flip(sx + 8, sy, 4, 4, dx + 8, dy);
      flip(sx, sy + 4, 4, 12, dx + 8, dy + 4); flip(sx + 4, sy + 4, 4, 12, dx + 4, dy + 4);
      flip(sx + 8, sy + 4, 4, 12, dx, dy + 4); flip(sx + 12, sy + 4, 4, 12, dx + 12, dy + 4);
    }
  }
  if (!old || !solid(32, 0, 32, 16)) g.drawImage(src, 32, 0, 32, 16, 0, 0, 32, 16);     // 모자 (옛 스킨의 꽉 찬 모자 칸은 그림이 아니다)
  if (!old) {
    g.drawImage(src, 0, 32, 56, 16, 0, 16, 56, 16);          // 오른다리 · 몸통 · 오른팔의 겉옷
    g.drawImage(src, 0, 48, 16, 16, 16, 48, 16, 16);         // 왼다리 겉옷
    g.drawImage(src, 48, 48, 16, 16, 32, 48, 16, 16);        // 왼팔 겉옷
  }
  return { canvas, slim };
}

          P.desk.push({ p: [cx, y + 0.62, z0 + 0.2], s: [5.4, 0.05, 0.34] }, { p: [cx, y + 0.3, z0 + 0.05], s: [5.4, 0.6, 0.04] });

          for (let i = 0; i < 8; i++) {
            const x = side * (1.18 + i * 0.66);
            addSeat(P, x, y, z0 + 1.27, FRONT, { solid: true, deskBox: boxOf(x - 0.33, x + 0.33, y, y + 0.645, z0 + 0.03, z0 + 0.37) });
          }
        }
      }
    },
  },
  hall: {
    name: '강당', note: '220명', look: 'theater', w: 20, d: 26, h: 8.6, curtains: true,
    board: [9.6, 5.4, 1.65], doorZ: -1.2, spawn: [-7, 7, 3.4, 5.6], lectern: [6, -10.6],
    floorAt(x, z) {
      if (z < -8.6) return 0.72;                                                       // 무대
      if (z < -7.7 && Math.abs(x) < 1.6) return z < -8.15 ? 0.48 : 0.24;               // 무대로 오르는 두 단
      if (z >= 6.5) return z < 8.5 ? 3.0 : z < 9.9 ? 3.3 : 3.6;                        // 2층 (세 단)
      if (Math.abs(x) > 8.6 && z > 1) return (z - 1) / 5.5 * 3.0;                      // 2층으로 올라가는 양쪽 계단
      return 0;
    },
    fixed(P, unit) {
      const row = (y, z) => {                      // 가운데 통로 양옆으로 의자 10개씩
        for (const side of [-1, 1]) for (let i = 0; i < 10; i++) addSeat(P, side * (1.23 + i * 0.66), y, z, FRONT, { solid: true });

      // 1층 객석 여덟 줄
      for (let j = 0; j < 8; j++) row(0, -6 + j * 1.2);
      // 2층으로 올라가는 계단: 기울인 판 하나 + 안쪽 난간 벽
      const slope = Math.atan2(3, 5.5), len = Math.hypot(3, 5.5);
      for (const side of [-1, 1]) {
        const ramp = new THREE.Mesh(strip(1.4, len, 1, len / 0.3), stairMat);
        ramp.rotation.x = -(Math.PI / 2 + slope);
        ramp.position.set(side * 9.3, 1.5, 3.75);
        addStatic(ramp);
        const geo = new THREE.BufferGeometry();
        const x = side * 8.6;
        geo.setAttribute('position', new THREE.Float32BufferAttribute([x, 0, 1, x, 0, 6.5, x, 3.9, 6.5, x, 0.9, 1], 3));
        geo.setIndex([0, 1, 2, 0, 2, 3]);
        geo.computeVertexNormals();
        addStatic(new THREE.Mesh(geo, trimMat));
        obstacles.push({ x0: x - 0.05, x1: x + 0.05, z0: 1, z1: 6.5 });
      }
      // 2층: 바닥 세 단 + 아래쪽 벽 + 앞 난간 + 객석 세 줄
      slab(-HW, HW, 6.5, 8.5, 3.0, floorMat, unit);
      slab(-HW, HW, 8.5, 9.9, 3.3, floorMat, unit);
      slab(-HW, HW, 9.9, HD, 3.6, floorMat, unit);

      obstacles.push({ x0: -8.6, x1: 8.6, z0: 6.5, z1: 6.66 });
      [7.95, 9.45, 10.85].forEach((z, r) => row(3.0 + r * 0.3, z));
    },

};

function addStatic(mesh) {                     // 움직이지 않는 물체: 위치 계산을 한 번만 하고 고정
  mesh.updateMatrix();
  mesh.matrixAutoUpdate = false;
  roomGroup.add(mesh);
  return mesh;
}
function clearRoom() {
  if (!roomGroup) return;
  roomGroup.traverse((o) => {
    if (o.isInstancedMesh) o.dispose();
    if (o.geometry && !o.geometry.userData.keep) o.geometry.dispose();
  });
  scene.remove(roomGroup);
}
const boxOf = (x0, x1, y0, y1, z0, z1) => new THREE.Box3(
  new THREE.Vector3(Math.min(x0, x1), y0, Math.min(z0, z1)), new THREE.Vector3(Math.max(x0, x1), y1, Math.max(z0, z1)));

// 무늬를 uw × uh 번 되풀이하는 판
function strip(w, h, uw, uh) {
  const geo = new THREE.PlaneGeometry(w, h);
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * uw, uv.getY(i) * uh);
  return geo;
}
// 바닥 판: 무늬가 어느 판에서나 같은 크기로 이어지게 위치 기준으로 입힌다
function slab(x0, x1, z0, z1, y, mat, unit) {
  const geo = new THREE.PlaneGeometry(x1 - x0, z1 - z0);
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) {
    uv.setXY(i, (x0 + uv.getX(i) * (x1 - x0)) / unit, -(z0 + (1 - uv.getY(i)) * (z1 - z0)) / unit);
  }
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set((x0 + x1) / 2, y, (z0 + z1) / 2);
  return addStatic(m);
}
// 계단 턱: 앞을 보는 세로 판
function riser(x0, x1, z, y0, y1) {
  const m = new THREE.Mesh(quad, trimMat);
  m.scale.set(x1 - x0, y1 - y0, 1);
  m.rotation.y = Math.PI;
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, z);
  return addStatic(m);
}
function solid(x, y, z, sx, sy, sz, mat) {
  const m = new THREE.Mesh(box, mat);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);
  return addStatic(m);
}
// 벽: 무늬는 가로 2m 마다 되풀이하고, 세로는 바닥에서 4.6m 까지 한 장
function wallPiece(width, height, x, y0, z, turn) {
  const m = new THREE.Mesh(strip(width, height, width / 2, height / 4.6), wallMat);
  m.position.set(x, y0 + height / 2, z);
  m.rotation.y = turn;
  return addStatic(m);
}

/* ── 자리 하나: 의자를 놓고, 앉는 위치와 바라보는 방향을 적어 둔다 ──
   yaw = 앉아서 몸이 향하는 방향 (FRONT = 칠판 쪽). 테이블에 둘러앉는 자리는 테이블 가운데를 본다 */
function addSeat(P, x, y, z, yaw, { g = null, deskBox = null, solid: block = false, reach = 1.3 } = {}) {
  const sn = Math.sin(yaw), cs = Math.cos(yaw);
  const at = (side, fwd) => ({ x: x + side * cs + fwd * sn, z: z - side * sn + fwd * cs });    // 의자 기준 옆 · 앞으로 떨어진 곳
  const r = [0, yaw, 0], back = at(0, -0.2);
  P.chair.push({ p: [x, y + 0.34, z], r, s: [0.42, 0.05, 0.42] });
  if (block) {                                 // 극장식 의자: 등받이가 아래까지 내려오고 받침이 하나
    P.chair.push({ p: [back.x, y + 0.58, back.z], r, s: [0.42, 0.46, 0.05] });
    P.metal.push({ p: [x, y + 0.16, z], r, s: [0.3, 0.32, 0.3] });
  } else {                                     // 교실 의자: 다리 4개 (뒷다리는 등받이까지 이어진다)
    P.chair.push({ p: [back.x, y + 0.66, back.z], r, s: [0.42, 0.3, 0.05] });
    for (const side of [-0.18, 0.18]) {
      const f = at(side, 0.18), b = at(side, -0.2);
      P.metal.push({ p: [f.x, y + 0.16, f.z], r, s: [0.04, 0.32, 0.04] });
      P.metal.push({ p: [b.x, y + 0.4, b.z], r, s: [0.04, 0.8, 0.04] });
    }
  }
  const half = Math.min(0.27, 0.215 * (Math.abs(sn) + Math.abs(cs)));
  obstacles.push({ x0: x - half, x1: x + half, z0: z - half, z1: z + half });
  const sit = at(0, 0.06);
  const chairBox = boxOf(x - half, x + half, y, y + 0.81, z - half, z + half);
  const seat = {
    kind: 'seat', x, y, z, yaw, g, reach,                           // reach = 이 거리 안의 자리는 이웃으로 본다
    sit,                                                             // 앉았을 때 몸의 위치
    cand: [at(-0.525, 0), at(0.525, 0), at(0, 0.5), at(0, -0.52 - (half - 0.215) * 2.5)],   // 앉기 직전에 설 수 있는 곳 후보 (옆 · 앞 · 뒤)
    sides: [],                                                       // 그 가운데 실제로 설 수 있는 곳
    chairBox,
    boxes: deskBox ? [deskBox, chairBox] : [chairBox],               // 바라보기 판정과 테두리에 쓴다
    body: boxOf(sit.x - 0.36, sit.x + 0.36, y + 0.3, y + 1.5, sit.z - 0.36, sit.z + 0.36),   // 앉은 사람의 몸
    near: [],                                                        // 소곤거릴 수 있는 이웃 자리
    taken: null,                                                     // 지금 이 자리를 쓰는 캐릭터
    whisper: null,
  };
  seats.push(seat);
  return seat;
}

// 개인 책상: 상판 + 서랍 + 다리 4개, 뒤에 의자 (z = 책상 가운데)
function soloDesk(P, x, y, z) {
  P.desk.push({ p: [x, y + 0.6, z], s: [1.0, 0.05, 0.58] }, { p: [x, y + 0.5, z - 0.03], s: [0.86, 0.13, 0.44] });
  for (const dx of [-0.45, 0.45]) for (const dz of [-0.24, 0.24]) P.metal.push({ p: [x + dx, y + 0.29, z + dz], s: [0.05, 0.58, 0.05] });
  P.shadow.push({ p: [x, y + 0.012, z + 0.3], r: FLAT, s: [1.5, 1.7, 1] });
  obstacles.push({ x0: x - 0.5, x1: x + 0.5, z0: z - 0.29, z1: z + 0.29 });
  addSeat(P, x, y, z + 0.62, FRONT, { reach: 1.75, deskBox: boxOf(x - 0.5, x + 0.5, y, y + 0.625, z - 0.29, z + 0.29) });
}
// 2인 짝꿍 책상: 넓은 책상 하나에 의자 둘이 나란히 칠판을 본다 (zc = 책상과 의자를 합친 자리의 가운데)
function pairDesk(P, x, zc) {
  const z = zc - 0.28, g = {};
  P.desk.push({ p: [x, 0.6, z], s: [1.3, 0.05, 0.58] }, { p: [x, 0.5, z - 0.03], s: [1.16, 0.13, 0.44] });
  for (const dx of [-0.6, 0.6]) for (const dz of [-0.24, 0.24]) P.metal.push({ p: [x + dx, 0.29, z + dz], s: [0.05, 0.58, 0.05] });
  P.shadow.push({ p: [x, 0.012, z + 0.3], r: FLAT, s: [1.9, 1.7, 1] });
  obstacles.push({ x0: x - 0.65, x1: x + 0.65, z0: z - 0.29, z1: z + 0.29 });
  for (const side of [-1, 1]) {
    addSeat(P, x + side * 0.33, 0, z + 0.62, FRONT, { g, deskBox: boxOf(x, x + side * 0.65, 0, 0.625, z - 0.29, z + 0.29) });
  }
}
// 4인 · 6인 테이블: 네모 테이블 양옆에 마주 앉는다. 칠판은 고개만 돌리면 보인다
function rectTable(P, x, z, tw, td, offs) {
  const g = {}, part = td / offs.length;
  P.desk.push({ p: [x, 0.6, z], s: [tw, 0.05, td] });
  for (const dx of [-1, 1]) for (const dz of [-1, 1]) {
    P.metal.push({ p: [x + dx * (tw / 2 - 0.08), 0.29, z + dz * (td / 2 - 0.08)], s: [0.06, 0.58, 0.06] });
  }
  P.shadow.push({ p: [x, 0.012, z], r: FLAT, s: [tw + 1.7, td + 0.9, 1] });
  obstacles.push({ x0: x - tw / 2, x1: x + tw / 2, z0: z - td / 2, z1: z + td / 2 });
  for (const side of [-1, 1]) offs.forEach((o, i) => {
    const z0 = z - td / 2 + i * part;          // 테이블에서 이 자리 몫
    addSeat(P, x + side * (tw / 2 + 0.3), 0, z + o, -side * Math.PI / 2,
      { g, deskBox: boxOf(x, x + side * tw / 2, 0, 0.625, z0, z0 + part) });
  });
}
// 10인 원형 테이블: 칠판 쪽은 비워 두고 둘러앉는다
function roundTable(P, x, z) {
  const g = {};
  P.round.push({ p: [x, 0.6, z], s: [1.15, 0.05, 1.15] });
  P.metal.push({ p: [x, 0.3, z], s: [0.2, 0.58, 0.2] }, { p: [x, 0.02, z], s: [0.9, 0.04, 0.9] });
  P.shadow.push({ p: [x, 0.012, z], r: FLAT, s: [3.7, 3.7, 1] });
  obstacles.push({ x0: x - 0.9, x1: x + 0.9, z0: z - 0.9, z1: z + 0.9 });
  for (let i = 0; i < 10; i++) {
    const a = (-140 + i * 280 / 9) * Math.PI / 180;      // 0 = 칠판에서 가장 먼 쪽
    addSeat(P, x + Math.sin(a) * 1.47, 0, z + Math.cos(a) * 1.47, a + Math.PI, { g });
  }
}

// 테이블을 놓을 자리 정하기: 놓는 곳 안에 가로세로로 고르게, 앞줄부터, 정원을 넘지 않게
function fit([x0, x1, z0, z1], T, cap) {
  const W = x1 - x0, D = z1 - z0, units = Math.max(1, Math.floor(cap / T.per));
  let cols = Math.max(1, Math.floor((W + T.gap) / (T.fw + T.gap)));
  let rows = Math.max(1, Math.floor((D + T.gap) / (T.fd + T.gap)));
  while (rows > 1 && cols * (rows - 1) >= units) rows--;
  while (cols > 1 && (cols - 1) * rows >= units) cols--;
  let n = Math.min(units, cols * rows);
  if (n > cols && n % cols && n % cols < cols / 2) n -= n % cols;      // 마지막 줄에 한두 개만 남으면 그 줄은 비운다
  rows = Math.ceil(n / cols);
  const px = Math.min(T.fw + T.gap * 2, W / cols), pz = Math.min(T.fd + T.gap * 2.5, D / rows);
  const out = [];
  for (let j = 0; j < rows; j++) {
    const m = Math.min(cols, n - j * cols);
    for (let i = 0; i < m; i++) out.push({ x: (x0 + x1) / 2 + (i - (m - 1) / 2) * px, z: z0 + T.fd / 2 + j * pz });
  }
  return out;
}
