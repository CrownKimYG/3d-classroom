let backLabel = '';
const slidesMine = () => presenting() && show.mode === 'slides';      // 내가 슬라이드를 띄워 둔 중인지

// X: 바라본 것에 하는 행동
function act() {
  if (!entered || zoomed) return;
  if (!target) {
    if (takenSeat) toast(takenSeat.stand ? `${polite(takenSeat.taken.name)}이 교탁에 서 있어요` : `${polite(takenSeat.taken.name)}이 앉은 자리예요`);
    return;
  }
  if (target.kind === 'door') askExit();
  else if (target.kind === 'screen') setZoom(true, boardHitX);
  else if (target.kind === 'whisper') openWhisper(target.seat.taken.peerId || 'mate');
  else if (player.goSit(target)) mySeatAt = Date.now();       // 자리를 고른 시각 (둘이 동시에 고르면 빠른 쪽이 앉는다)
  dirty = true;
}
// Esc: 한 단계 뒤로. 뒤로 갈 것이 있었으면 true
function back() {
  if (!entered) return false;
  if (!$('setup').hidden) $('setup').hidden = true;
  else if (zoomed) setZoom(false);
  else if (player.mode === 'seated') player.stand();
  else if (player.mode === 'path') player.cancel();
  else return false;
  canvas.focus();
  dirty = true;
  return true;
}

const polite = (name) => (name.endsWith('선생님') ? name : `${name} 님`);     // "지영 님", "김 선생님"
let toastTimer = 0;
function toast(text, ms = 2600) {
  $('toast').textContent = text;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, ms);
}

/* ───────────── 입력 → 내 캐릭터 ───────────── */
function readInput() {
  if (zoomed) {                        // 칠판을 크게 보는 동안에는 걷지 않는다
    player.input.x = player.input.z = 0;
    jumpQueued = false;
    return;
  }
  let ix = joy.x, iz = joy.y;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iz += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iz -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  const il = Math.hypot(ix, iz);
  if (il > 1) { ix /= il; iz /= il; }
  if (il > 0.05 && player.mode === 'path') player.cancel();     // 직접 움직이면 자동 이동은 그만둔다
  const speed = keys.has('ShiftLeft') || keys.has('ShiftRight') ? RUN : WALK;
  const s = Math.sin(player.lookYaw), c = Math.cos(player.lookYaw);
  player.input.x = (iz * s - ix * c) * speed;    // 보고 있는 쪽이 "앞"
  player.input.z = (iz * c + ix * s) * speed;
  if (jumpQueued) player.input.jump = true;
  jumpQueued = false;
}

// 자리로 걸어가 앉는 동안에는 시선이 가는 방향을 따라간다 (직접 둘러보는 중이면 그대로 둔다)
function autoLook(dt) {
  if (lookId !== null) return false;
  let want = null, pitch = 0.1;
  if (player.mode === 'path' && Math.hypot(player.vel.x, player.vel.z) > 0.2) want = Math.atan2(player.vel.x, player.vel.z);
  else if (player.mode === 'sitting') {
    const s = player.seat;
    if (s.stand) want = s.yaw;                                 // 교탁에 서면 강의실을 마주 본다
    else {                                                     // 앉으면 칠판 한가운데를 본다
      want = boardYaw(s);
      pitch = -clamp(Math.atan2(BOARD.y - (s.y + EYE_H + SEAT_RISE), Math.hypot(BOARD.x - s.sit.x, BOARD.z - s.sit.z)), -0.1, 0.6);
    }
  }
  if (want === null) return false;
  const k = 1 - Math.exp(-5 * dt), d = wrap(want - player.lookYaw);
  player.lookYaw += d * k;
  player.lookPitch += (pitch - player.lookPitch) * k;
  return true;
}

/* ───────────── 친구: 자리에 앉아 있다가 가끔 다른 자리로 옮긴다 ───────────── */
function freeSeat() {
  const open = seats.filter((s) => !s.taken);
  return open.length ? open[Math.random() * open.length | 0] : null;
}

function mateThink(dt) {
  const c = mate;
  if (c.mode === 'seated' && MATE_WANDERS) {
    mateTimer -= dt;
    if (mateTimer <= 0) {
      mateTimer = 25 + Math.random() * 20;
      mateNext = freeSeat();
      if (mateNext) c.stand();
    }
  } else if (c.mode === 'free' && mateNext) {
    const s = mateNext;
    mateNext = c.goSit(s) ? null : freeSeat();
  }

  // 시선: 걸을 땐 가는 쪽, 내가 가까이 오면 나를, 아니면 스크린을 본다
  let wantYaw = c.bodyYaw, wantPitch = 0;
  const dx = player.pos.x - c.pos.x, dz = player.pos.z - c.pos.z, dist = Math.hypot(dx, dz);
  if (c.mode === 'path') {
    if (Math.hypot(c.vel.x, c.vel.z) > 0.2) wantYaw = Math.atan2(c.vel.x, c.vel.z);
  } else if (dist < 3 && dist > 0.4) {
    wantYaw = Math.atan2(dx, dz);
  } else if (c.mode === 'seated') {
    wantYaw = FRONT;
    wantPitch = -0.2;
  }
  if (c.mode !== 'free' && c.mode !== 'path') {     // 앉아 있을 땐 몸은 그대로, 고개만 돌린다
    wantYaw = c.bodyYaw + clamp(wrap(wantYaw - c.bodyYaw), -HEAD_TURN, HEAD_TURN);
  }
  const k = 1 - Math.exp(-6 * dt);
  const dy = wrap(wantYaw - c.lookYaw), dp = wantPitch - c.lookPitch;
  c.lookYaw += dy * k;
  c.lookPitch += dp * k;
  const looking = Math.abs(dy) > 0.003 || Math.abs(dp) > 0.003;
  return c.update(dt) || looking;
}

/* ───────────── 출석 시간: 강의실에 있는 동안만 쌓이고, 나가도 기록은 남는다 ───────────── */
const STORE_KEY = 'classroom-attendance-v1';
const attendance = { roy: 0, stella: 0, mine: 0 };       // 캐릭터별로 쌓인 시간 (1000 = 1초)
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY)) || {};
  for (const who in attendance) attendance[who] = Math.max(0, Number(saved[who]) || 0);
} catch {}                                      // 저장소를 못 쓰는 브라우저에서는 이번 접속 동안만 기억한다

let attending = false, attTick = Date.now(), attSaved = 0, attShown = '';
function saveAttendance() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(attendance)); } catch {}
}
function clockText(ms) {
  const s = Math.floor(ms / 1000), two = (n) => String(n).padStart(2, '0');
  return `${two(Math.floor(s / 3600))}:${two(Math.floor(s / 60) % 60)}:${two(s % 60)}`;
}
function tickAttendance() {
  const now = Date.now();
  if (attending && !document.hidden) attendance[chosen] += Math.min(now - attTick, 2000);   // 화면을 보고 있는 동안만
  attTick = now;
  if (!attending) return;
  const text = `${myName || (isTeacher ? '선생님' : '학생')} · 출석 ${clockText(attendance[chosen])}`;
  if (text !== attShown) { attShown = text; $('att').textContent = text; }
  if (now - attSaved > 5000) { attSaved = now; saveAttendance(); }
}
function showRecords() {
  for (const who in attendance) $('rec-' + who).textContent = `출석 ${clockText(attendance[who])}`;
}
showRecords();
addEventListener('pagehide', () => {            // 창을 닫아도 기록이 남게, 함께 있던 사람들에겐 나갔다고 알린다
  tickAttendance();
  saveAttendance();
  if (link) link.send({ t: 'b', id: myId });
});

/* ───────────── 문: 바라보고 X 를 누르면 나갈지 물어본다 ───────────── */
let paused = false;                  // 확인창이 떠 있는 동안 움직임을 멈춘다

function askExit() {
  paused = true;
  keys.clear();
  joy.x = joy.y = 0;
  player.cancel();
  player.vel.x = player.vel.z = 0;
  player.input.x = player.input.z = 0;
  $('exitTime').textContent = clockText(attendance[chosen]);
  $('exit').hidden = false;
  $('stayBtn').focus();
}
function stay() {
  paused = false;
  $('exit').hidden = true;
  canvas.focus();
  dirty = true;
}
function leave() {
  tickAttendance();                  // 나가는 순간까지만 더하고
  attending = false;                 // 그 뒤로는 쌓지 않는다 (이미 쌓인 시간은 그대로 둔다)
  saveAttendance();
  showRecords();
  for (const n of notes.splice(0)) scene.remove(n.mesh);
  whispers.clear();
  whisperPeer = '';
  $('ask').hidden = $('whisper').hidden = true;
  endShow();                         // 띄워 둔 강의 자료를 내리고
  gestures.length = 0;
  setZoom(false);
  zoomAmt = 0;
  setGhost(false);
  setLaser(false);
  for (const id of [...lasers.keys()]) removeLaser(id);
  player.setRemote(false);
  player.reachAmt = 0;
  $('remoteBtn').hidden = true;
  netLeave();                        // 함께 있던 사람들에게 나갔다고 알리고 연결을 끊는다
  paused = entered = false;
  resetConfig();                     // 강의실 · 칠판 · BGM 을 처음 모습으로
  $('setup').hidden = true;
  setRemoteOut(false);
  $('exit').hidden = true;
  $('hud').hidden = true;
  setKeys(false);
  $('entry').hidden = false;
  player.setSelf(false);
  for (const key in actors) {
    const a = actors[key];
    a.model.root.visible = a.model.blob.visible = key !== 'mine' || !!mySkin;
    a.reset(STAGE_X[key], 4.4);
  }
  mateNext = null;
  choose(chosen);
}
$('stayBtn').addEventListener('click', stay);
$('leaveBtn').addEventListener('click', leave);

/* ───────────── 함께 접속하기 ─────────────
   같은 수업 코드로 들어온 사람끼리 이름·위치·앉은 자리를 주고받는다.
   따로 서버 프로그램을 두지 않고, 각자 자기 상태를 방 전체에 알리는 방식이다.
     s (state)  내 이름·위치·시선·앉은 자리. 움직이는 동안 자주, 가만히 있으면 가끔 보낸다
     h (hello)  방금 들어왔으니 모두 자기 상태를 알려 달라는 인사
     b (bye)    나간다는 알림
   통로는 두 가지: Supabase Realtime(다른 기기와 연결) 또는 BroadcastChannel(같은 브라우저의 탭끼리) */
const MAX_PEERS = 40;
const myId = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const peers = new Map();             // 다른 사람들: id → { id, actor, from, goal, t, span, last, seat, at }
let link = null;                     // 연결 통로 { send, close }
let linkState = '';                  // 화면에 보여 줄 연결 상태
let roomCode = '', myName = '';
let mySeatAt = 0;                    // 내가 지금 자리를 고른 시각
let lastSent = '', lastSentAt = 0, netTimer = 0, joinTicket = 0, roomShown = '';

const online = () => roomCode !== '';
const round2 = (v) => Math.round(v * 100) / 100;

// 사람이 많을수록 덜 자주 보낸다 (Supabase 무료 요금제의 초당 메시지 한도를 아끼기 위해)
function netPace() {
  const n = peers.size + 1;
  const sendMs = Math.min(1000, 200 * Math.max(1, n / 4));
  const beatMs = Math.max(10000, n * 500);
  return { sendMs, beatMs, goneMs: beatMs * 3.5 };
}

function snapshot() {
  const p = player, mine = !!p.seat && p.seat.taken === p;
  return {
    t: 's', id: myId, n: myName, c: chosen, tc: isTeacher ? 1 : 0,
    cf: CFG_KEYS.flatMap((kind) => [cfg[kind], cfgAt[kind]]),      // 강의실 설정과 바꾼 시각
    p: [round2(p.pos.x), round2(p.pos.y), round2(p.pos.z)],
    r: [round2(wrap(p.bodyYaw)), round2(wrap(p.lookYaw)), round2(p.lookPitch)],
    s: round2(p.sitAmt),
    k: mine ? seats.indexOf(p.seat) : -1,        // 앉았거나 앉으러 가는 자리 번호
    a: mine ? mySeatAt : 0,
    w: p.writeOn ? [round2(p.handTo.x), round2(p.handTo.y)] : 0,     // 판서하는 손이 가리키는 곳
  };
}

// 스킨 주고받기 (k 메시지). 내가 들어왔을 때와 새 사람이 들어왔을 때 내 스킨을 한 번씩 보낸다.
// 여럿이 한꺼번에 보내지 않도록, 사람이 많을수록 저마다 다른 만큼 기다렸다가 보낸다
let skinDue = 0;                     // 내 스킨을 보낼 시각 (0 = 보낼 것 없음)
const peerSkins = new Map();         // id → { d, skin }: 다른 사람들의 스킨
let skinTold = false;                // 이번에 내 스킨을 알린 적이 있는지 (기본 스킨으로 바꿔 들어오면 "스킨 없음"을 알려야 한다)
function queueSkin(soon) {
  if ((!wearing() && !skinTold) || (skinDue && !soon)) return;
  skinDue = Date.now() + (soon ? 300 : 500 + Math.random() * Math.min(8000, peers.size * 150));
}
async function onSkin(m) {
  if (typeof m.d !== 'string') return;
  const have = peerSkins.get(m.id);
  if (have && have.d === m.d) return;
  const entry = { d: m.d, skin: null };
  if (peerSkins.size >= 300 && !have) {          // 너무 많이 쌓이면 지금 없는 사람의 것부터 버린다
    for (const [id, it] of peerSkins) if (!peers.has(id)) { peerSkins.delete(id); if (it.skin) dropSkin(it.skin); break; }
    if (peerSkins.size >= 300) return;
  }
  peerSkins.set(m.id, entry);
  entry.skin = await skinFromURL(m.d, m.sl);     // 스킨이 아니면 null → 기본 캐릭터로 보인다
  if (peerSkins.get(m.id) !== entry) { if (entry.skin) dropSkin(entry.skin); return; }      // 그사이에 또 다른 스킨이 왔다
  const peer = peers.get(m.id);
  if (peer) peer.actor.setSkin(entry.skin);
  if (have && have.skin) dropSkin(have.skin);
}

// 내 상태 보내기: 달라졌으면 바로, 그대로면 가끔만
function netTick() {
  if (!link || !entered) return;
  const now = Date.now(), pace = netPace();
  if (skinDue && now >= skinDue) {
    skinDue = 0;
    if (wearing()) { skinTold = true; link.send({ t: 'k', id: myId, d: mySkin.d, sl: mySkin.sl }); }
    else if (skinTold) link.send({ t: 'k', id: myId, d: '', sl: 0 });
  }
  if (now - lastSentAt > pace.goneMs - 2000) mySeatAt = now;     // 오래 조용했으면(탭을 떠나 있었으면) 자리 순서를 새로 받는다
  const msg = snapshot(), body = JSON.stringify([msg.p, msg.r, msg.s, msg.k, msg.w]);
  const wait = body === lastSent ? pace.beatMs : pace.sendMs;
  if (now - lastSentAt < wait) return;
  lastSent = body;
  lastSentAt = now;
  link.send(msg);
}

// 다른 사람의 소식 받기
function netReceive(m) {
  if (!entered || !m || typeof m !== 'object' || typeof m.id !== 'string' || m.id === myId) return;
  if (m.t === 'h') {                 // 새로 온 사람에게 곧바로 내 상태와 (발표 중이면) 강의 자료를 알린다
    lastSent = '';
    lastSentAt = 0;
    laserSent = '';
    if (presenting()) setTimeout(resendShow, 400);
    if (strokes.length && inkKeeper(m.id)) setTimeout(() => sendInk(m.id), 700);     // 지금까지의 판서도 보내 준다
    queueSkin(false);                // 내 스킨도 보내 준다
    return;
  }
  if (m.t === 'k') { onSkin(m); return; }
  if (m.t === 'b') { dropPeer(m.id); return; }
  if (m.t === 'p') { onShow(m); return; }
  if (m.t === 'rtc') { if (m.to === myId) onRtc(m); return; }
  if (m.t === 'q' || m.t === 'e' || m.t === 'w') { onClassMsg(m); return; }
  if (m.t === 'l') { onLaser(m); return; }
  if (m.t === 'd') { onInk(m); return; }
  if (m.t === 'z') { onZap(m); return; }
  if (m.t !== 's' || !Array.isArray(m.p) || !Array.isArray(m.r)) return;
  onConfig(m.cf);                    // 강의실 설정이 나보다 새것이면 먼저 따라 바꾼다 (위치와 자리 번호를 읽기 전에)

  const num = (v, lo, hi) => (Number.isFinite(v) ? clamp(v, lo, hi) : 0);
  const goal = {
    x: num(m.p[0], -HW, HW), y: num(m.p[1], 0, 12), z: num(m.p[2], -HD, HD),
    body: num(m.r[0], -4, 4), yaw: num(m.r[1], -4, 4), pitch: num(m.r[2], -1.4, 1.4),
    sit: num(m.s, 0, 1),
  };
  const now = Date.now();
  let peer = peers.get(m.id);
  if (!peer) {
    if (peers.size >= MAX_PEERS) return;
    const look = Object.hasOwn(CHARACTERS, m.c) ? CHARACTERS[m.c] : CHARACTERS.roy;
    const actor = new Actor(look, `${String(m.n || (m.tc ? '' : '학생')).slice(0, 12)}${m.tc ? ' 선생님' : ''}`.trim(), true);
    actor.peerId = m.id;
    if (peerSkins.get(m.id)?.skin) actor.setSkin(peerSkins.get(m.id).skin);
    if (m.tc) actor.setRemote(true);
    peer = { id: m.id, actor, teacher: !!m.tc, from: goal, goal, t: 1, span: 0.2, last: now, seat: null, at: 0 };
    peers.set(m.id, peer);
    placePeer(peer, 1);
  } else {
    const a = peer.actor;                        // 지금 있는 곳에서 새로 받은 곳까지, 소식 간격만큼의 시간에 걸쳐 옮긴다
    peer.from = { x: a.pos.x, y: a.pos.y, z: a.pos.z, body: a.bodyYaw, yaw: a.lookYaw, pitch: a.lookPitch, sit: a.sitAmt };
    peer.span = clamp((now - peer.last) / 1000, 0.1, netPace().sendMs * 0.0015);
    peer.t = 0;
    peer.goal = goal;
    peer.last = now;
  }
  peer.actor.writeOn = Array.isArray(m.w) && m.w.length === 2;      // 칠판 앞에서 판서하는 중
  if (peer.actor.writeOn) {
    peer.actor.handTo.x = num(m.w[0], -HW, HW);
    peer.actor.handTo.y = num(m.w[1], 0, 14);
    if (peer.teacher) followNote(peer.actor.handTo.x);
  }
  // 자리 번호는 강의실과 배치가 같을 때만 뜻이 통한다
  const sameRoom = Array.isArray(m.cf) && m.cf[0] === cfg.form && m.cf[2] === cfg.table;
  setPeerSeat(peer, sameRoom && Number.isInteger(m.k) ? m.k : -1, Number(m.a) || 0);
  dirty = true;
}

function placePeer(peer, k) {
  const a = peer.actor, f = peer.from, g = peer.goal;
  a.pos.set(f.x + (g.x - f.x) * k, f.y + (g.y - f.y) * k, f.z + (g.z - f.z) * k);
  a.bodyYaw = f.body + wrap(g.body - f.body) * k;
  a.lookYaw = f.yaw + wrap(g.yaw - f.yaw) * k;
  a.lookPitch = f.pitch + (g.pitch - f.pitch) * k;
  a.sitAmt = f.sit + (g.sit - f.sit) * k;
  a.applyPose();
}

// 다른 사람의 캐릭터를 받은 위치까지 부드럽게 옮기고, 움직인 만큼 팔다리를 흔든다
function peersThink(dt) {
  let active = false;
  for (const peer of peers.values()) {
    const a = peer.actor;
    if (peer.t >= 1 && a.walkAmt < 0.002 && a.airAmt < 0.002) continue;
    const ox = a.pos.x, oz = a.pos.z;
    peer.t = Math.min(1, peer.t + dt / peer.span);
    const sp = dt > 0 ? Math.hypot(peer.from.x + (peer.goal.x - peer.from.x) * peer.t - ox,
      peer.from.z + (peer.goal.z - peer.from.z) * peer.t - oz) / dt : 0;
    const moving = sp > 0.25 && a.sitAmt < 0.5;
    a.walkAmt += ((moving ? 1 : 0) - a.walkAmt) * (1 - Math.exp(-10 * dt));
    a.airAmt += ((a.pos.y - floorAt(a.pos.x, a.pos.z) > 0.3 ? 1 : 0) - a.airAmt) * (1 - Math.exp(-14 * dt));
    if (moving) a.walkPhase += (7 + Math.min(sp, RUN) * 2.4) * dt;
    placePeer(peer, peer.t);
    active = true;
  }
  return active;
}

// 자리 주인 정하기. 한 자리에는 한 사람만 앉는다
function setPeerSeat(peer, index, at) {
  const seat = index >= 0 && index < seats.length ? seats[index] : null;
  peer.at = at;
  if (peer.seat === seat) return;
  if (peer.seat && peer.seat.taken === peer.actor) peer.seat.taken = null;
  peer.seat = null;
  if (!seat) return;
  const holder = seat.taken;
  if (holder === player) {
    // 둘이 거의 동시에 같은 자리를 골랐다 → 먼저 고른 쪽(같으면 id 가 앞서는 쪽)이 앉는다. 양쪽이 같은 계산을 하므로 결과가 엇갈리지 않는다
    if (mySeatAt < at || (mySeatAt === at && myId < peer.id)) return;      // 내가 먼저: 상대가 물러난다
    giveUpSeat();
  } else if (holder) {
    const other = [...peers.values()].find((p) => p.actor === holder);
    if (!other) return;                                                    // 혼자 모드의 친구가 앉아 있는 경우
    if (other.at < at || (other.at === at && other.id < peer.id)) return;  // 먼저 온 사람이 그대로 앉는다
    other.seat = null;
  }
  seat.taken = peer.actor;
  peer.seat = seat;
}

// 내가 고른 자리를 다른 사람이 먼저 차지했을 때
function giveUpSeat() {
  if (player.mode === 'path') player.cancel();
  else if (player.mode === 'seated') player.stand();
  else if (player.mode === 'sitting') { player.mode = 'standing'; player.t = 1 - player.t; }
  toast('다른 사람이 먼저 앉은 자리예요');
  dirty = true;
}

function dropPeer(id) {
  const peer = peers.get(id);
  if (!peer) return;
  if (show.by === id) endShow(false);                // 발표하던 선생님이 나가면 스크린도 원래대로
  removeLaser(id);
  if (show.pcs.has(id)) { show.pcs.get(id).close(); show.pcs.delete(id); }
  if (peer.seat && peer.seat.taken === peer.actor) peer.seat.taken = null;
  if (whisperPeer === id) closeWhisper();
  if (peer.actor.bubble && peer.actor.bubble.material.map) peer.actor.bubble.material.map.dispose();
  if (peer.actor.remote) peer.actor.remote.removeFromParent();       // 함께 쓰는 도형이라 따로 떼어 둔다
  for (let i = gestures.length - 1; i >= 0; i--) if (gestures[i].actor === peer.actor) gestures.splice(i, 1);
  peer.actor.model.dispose();
  peers.delete(id);
  dirty = true;
}

// 한동안 소식이 없는 사람은 나간 것으로 본다
function sweepPeers() {
  const now = Date.now(), goneMs = netPace().goneMs;
  for (const peer of peers.values()) if (now - peer.last > goneMs) dropPeer(peer.id);
}

function showRoom() {
  const text = online() ? `수업 코드 ${roomCode} · ${peers.size + 1}명 · ${linkState} · 링크 복사` : '';
  if (text === roomShown) return;
  roomShown = text;
  $('room').hidden = !text;
  $('room').textContent = text;
}

// 통로 1: 같은 브라우저의 다른 탭끼리 (아무 설정 없이 바로 된다)
function openLocal(topic) {
  const bc = new BroadcastChannel(topic);
  bc.onmessage = (e) => netReceive(e.data);
  return { send: (m) => bc.postMessage(m), close: () => bc.close() };
}

// 통로 2: Supabase Realtime 의 Broadcast (다른 기기와 연결된다)
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`불러오지 못했어요: ${src}`));
    document.head.append(s);
  });
}
async function openSupabase(topic) {
  if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false },
  });
  const channel = client.channel(topic, { config: { broadcast: { self: false } } });
  let ready = false;
  const send = (m) => {
    if (ready) Promise.resolve(channel.send({ type: 'broadcast', event: 'm', payload: m })).catch(() => {});
  };
  channel.on('broadcast', { event: 'm' }, (msg) => netReceive(msg && msg.payload));
  channel.subscribe((status) => {
    ready = status === 'SUBSCRIBED';
    linkState = ready ? '온라인' : status === 'CLOSED' ? '연결 끊김' : '연결 문제 · 다시 시도 중';
    if (ready) { lastSent = ''; lastSentAt = 0; send({ t: 'h', id: myId }); queueSkin(true); }
    showRoom();
  });
  return { send, close: () => client.removeChannel(channel) };
}

async function netJoin() {
  const ticket = ++joinTicket;       // 연결을 기다리는 사이에 나가 버린 경우를 가려낸다
  const topic = 'classroom-' + [...roomCode].map((ch) => ch.codePointAt(0).toString(16)).join('-');
  lastSent = '';
  lastSentAt = 0;
  try {
    if (SUPABASE_URL && SUPABASE_KEY) {
      linkState = '연결 중…';
      showRoom();
      const opened = await openSupabase(topic);
      if (ticket !== joinTicket) { opened.close(); return; }
      link = opened;
    } else {
      link = openLocal(topic);
      linkState = '이 컴퓨터의 탭끼리';
      link.send({ t: 'h', id: myId });
      queueSkin(true);
    }
    clearInterval(netTimer);
    netTimer = setInterval(netTick, 100);
  } catch (err) {
    console.warn('함께 접속하기 연결 실패', err);
    if (ticket === joinTicket) linkState = '연결 실패 · 혼자 보는 중';
  }
  showRoom();
}

function netLeave() {
  joinTicket++;
  clearInterval(netTimer);
  if (link) {
    try { link.send({ t: 'b', id: myId }); link.close(); } catch {}
    link = null;
  }
  for (const id of [...peers.keys()]) dropPeer(id);
  roomCode = linkState = '';
  showRoom();
}

// 다른 탭을 보다가 돌아오면 서로의 상태를 다시 맞춘다
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !link) return;
  lastSent = '';
  link.send({ t: 'h', id: myId });
  queueSkin(true);
});

/* ───────────── 강의 자료: 선생님이 큰 스크린에 띄운다 ─────────────
   · 슬라이드  PDF·이미지 파일. 지금 보이는 한 장을 그림으로 줄여 방 전체에 보낸다 (p 메시지)
   · 화면 공유 선생님 화면을 WebRTC 로 한 사람씩 직접 보낸다. 연결을 맺는 대화만 방 통로를 쓴다 (rtc 메시지) */
let isTeacher = false;
const show = {
  mode: 'off',                       // off | slides | live
  by: '',                            // 띄운 사람의 id
  page: 0, total: 0, source: null, ticket: 0,
  stream: null, pcs: new Map(), lastFrame: 0,
  video: liveVideo,
};
const presenting = () => show.mode !== 'off' && show.by === myId;

function setShow(mode, by) {
  show.mode = mode;
  show.by = by;
  screen.visible = mode !== 'off';   // 끄면 칠판 바탕만 보인다
  if (mode !== 'live') liveMesh.visible = false;
  showLed();
  dirty = true;
}

// 리모컨의 작은 표시창: 지금 스크린 상태
function showLed() {
  const mine = presenting();
  $('remoteLed').textContent = show.mode === 'off' ? '꺼짐'
    : !mine ? '다른 선생님이 띄움'
    : show.mode === 'slides' ? `${show.page + 1} / ${show.total}`
    : show.mode === 'text' ? '문구 표시 중' : '화면 공유 중';
  $('prevBtn').disabled = $('nextBtn').disabled = !(mine && show.mode === 'slides');
  $('stopBtn').disabled = show.mode === 'off';     // 띄운 것이 있을 때만 끌 수 있다
}

// 스크린(16:9)에 비율을 지켜 가며 그린다
function drawFit(src, w, h) {
  showCtx.clearRect(0, 0, SHOW_W, SHOW_H);           // 화이트 · 그린 · 자유 보드에서는 칠판 바탕이 그대로 비친다
  if (cfg.board === 'video') {
    showCtx.fillStyle = '#0f1220';
    showCtx.fillRect(0, 0, SHOW_W, SHOW_H);
  }
  if (src && w && h) {
    const k = Math.min(SHOW_W / w, SHOW_H / h);
    showCtx.drawImage(src, (SHOW_W - w * k) / 2, (SHOW_H - h * k) / 2, w * k, h * k);
  }
  showTex.needsUpdate = true;
  dirty = true;
}
function showNote(text) {
  drawFit();
  showCtx.fillStyle = BOARDS[cfg.board].dim;
  showCtx.font = `700 44px ${UI_FONT}`;
  showCtx.textAlign = 'center';
  showCtx.textBaseline = 'middle';
  showCtx.fillText(text, SHOW_W / 2, SHOW_H / 2, SHOW_W - 160);
}

// 띄우던 것을 내린다. announce = 내가 띄운 것이면 다른 사람들에게도 알릴지
function endShow(announce = true) {
  const mine = presenting();
  for (const pc of show.pcs.values()) pc.close();
  show.pcs.clear();
  if (mine && show.stream) for (const track of show.stream.getTracks()) track.stop();
  if (live.handle) show.video.cancelVideoFrameCallback(live.handle);       // 새 장면 알림 그만 받기
  live.handle = 0;
  live.fresh = false;
  live.w = live.h = 0;
  liveMesh.visible = false;
  show.video.pause();
  show.video.srcObject = null;
  show.stream = show.source = null;
  show.ticket++;
  if (mine && announce && link) link.send({ t: 'p', id: myId, k: 'off' });
  setShow('off', '');
}

/* ── 슬라이드 (선생님 쪽) ── */
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
async function loadPdf(file) {
  if (!window.pdfjsLib) {
    await loadScript(PDFJS + 'build/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'build/pdf.worker.min.js';
  }
  return window.pdfjsLib.getDocument({
    data: await file.arrayBuffer(),
    cMapUrl: PDFJS + 'cmaps/', cMapPacked: true,          // 한글 글꼴이 든 PDF 를 제대로 그리려면 필요하다
    standardFontDataUrl: PDFJS + 'standard_fonts/',
  }).promise;
}
function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`그림을 열지 못했어요: ${file.name}`));
    img.src = URL.createObjectURL(file);
  });
}

async function openFiles(files) {
  const list = [...files];
  if (!list.length) return;
  if (list.some((f) => /\.pptx?$/i.test(f.name))) {
    toast('PPT 파일은 PowerPoint에서 PDF로 저장한 뒤 열어 주세요. 화면 공유로 보여 줄 수도 있어요.', 7000);
    return;
  }
  try {
    let total, source;
    const pdf = list.find((f) => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
    if (pdf) {
      toast('자료를 여는 중…', 20000);
      const doc = await loadPdf(pdf);
      total = doc.numPages;
      source = async (n) => {                        // 필요한 쪽만 그때그때 그린다
        const page = await doc.getPage(n + 1);
        const base = page.getViewport({ scale: 1 });
        const viewport = page.getViewport({ scale: Math.min(SHOW_W / base.width, SHOW_H / base.height) });
        const c = document.createElement('canvas');
        c.width = Math.round(viewport.width);
        c.height = Math.round(viewport.height);
        await page.render({ canvasContext: c.getContext('2d'), viewport }).promise;
        return c;
      };
    } else {
      const images = list.filter((f) => f.type.startsWith('image/'))
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      if (!images.length) { toast('PDF나 이미지 파일을 골라 주세요'); return; }
      const loaded = await Promise.all(images.map(loadImage));
      total = loaded.length;
      source = async (n) => loaded[n];
    }
    endShow(false);
    show.source = source;
    show.total = total;
    show.page = 0;
    setShow('slides', myId);
    await gotoPage(0);
    toast(`자료를 띄웠어요 · ${total}장 (리모컨 ◀ ▶ · PageUp/PageDown · 교탁에서는 ← →)`, 6000);
  } catch (err) {
    console.warn('강의 자료 열기 실패', err);
    toast('자료를 열지 못했어요');
  }
}

async function gotoPage(n) {
  if (!presenting() || show.mode !== 'slides' || !show.source) return;
  const ticket = ++show.ticket;                      // 빠르게 넘길 때 마지막으로 고른 쪽만 남긴다
  show.page = clamp(n, 0, show.total - 1);
  showLed();
  const src = await show.source(show.page);
  if (ticket !== show.ticket) return;
  drawFit(src, src.width, src.height);
  sendSlide();
}

// 지금 보이는 한 장을 작게 줄인 그림으로 보낸다 (Supabase 메시지 한 개는 256KB 까지)
function sendSlide() {
  if (!link || !presenting() || show.mode !== 'slides') return;
  const c = document.createElement('canvas');
  c.width = 960;
  c.height = 540;
  c.getContext('2d').drawImage(showCanvas, 0, 0, 960, 540);
  let quality = 0.7, data = c.toDataURL('image/jpeg', quality);
  while (data.length > 170000 && quality > 0.25) {
    quality -= 0.15;
    data = c.toDataURL('image/jpeg', quality);
  }
  link.send({ t: 'p', id: myId, k: 'img', n: show.page + 1, of: show.total, d: data });
}

/* ── 문구 (선생님 쪽): 적은 글을 스크린 한가운데에 띄운다 ── */
function drawText(text) {
  showCtx.clearRect(0, 0, SHOW_W, SHOW_H);           // 화이트 · 그린 · 자유 보드에는 칠판에 쓴 글씨처럼 글자만 얹는다
  if (cfg.board === 'video') {
    const bg = showCtx.createLinearGradient(0, 0, SHOW_W, SHOW_H);
    bg.addColorStop(0, '#24376a');
    bg.addColorStop(1, '#131b38');
    showCtx.fillStyle = bg;
    showCtx.fillRect(0, 0, SHOW_W, SHOW_H);
  }
  const size = text.length <= 10 ? 128 : text.length <= 22 ? 100 : text.length <= 44 ? 76 : 58;   // 짧을수록 크게
  showCtx.font = `800 ${size}px ${UI_FONT}`;
  showCtx.fillStyle = BOARDS[cfg.board].text;
  showCtx.textAlign = 'center';                    // 가운데 정렬
  showCtx.textBaseline = 'middle';
  const lines = [''];                              // 폭을 넘으면 줄을 바꾼다 (되도록 띄어쓴 곳에서)
  for (const ch of text) {
    const cur = lines[lines.length - 1];
    if (showCtx.measureText(cur + ch).width <= SHOW_W - 160) { lines[lines.length - 1] = cur + ch; continue; }
    const cut = cur.lastIndexOf(' ');
    if (ch !== ' ' && cut > 0) { lines[lines.length - 1] = cur.slice(0, cut); lines.push(cur.slice(cut + 1) + ch); }
    else lines.push(ch === ' ' ? '' : ch);
  }
  const gap = size * 1.32;
  lines.forEach((line, i) => showCtx.fillText(line.trim(), SHOW_W / 2, SHOW_H / 2 + (i - (lines.length - 1) / 2) * gap));
  showTex.needsUpdate = true;
  dirty = true;
}
function showText(text) {
  endShow(false);
  show.text = text;
  drawText(text);
  setShow('text', myId);
  resendShow();
}

function resendShow() {
  if (!presenting()) return;
  if (show.mode === 'text') { if (link) link.send({ t: 'p', id: myId, k: 'txt', x: show.text }); }
  else if (show.mode === 'slides') sendSlide();
  else if (link) link.send({ t: 'p', id: myId, k: 'live' });
}

/* ── 화면 공유 (선생님 쪽) ── */
function playLive(stream) {
  const v = show.video;
  v.srcObject = stream;
  v.play().catch(() => {});
  if (!live.rvfc) return;
  if (live.handle) v.cancelVideoFrameCallback(live.handle);
  const tick = () => {               // 새 장면이 올 때마다 불린다 (화면이 멈춰 있으면 불리지 않는다)
    live.fresh = true;
    live.handle = v.requestVideoFrameCallback(tick);
  };
  live.handle = v.requestVideoFrameCallback(tick);
}
// 매 프레임: 새 장면이 왔고 칠판이 화면에 보이면 그래픽 카드로 보낸다
function liveThink(now) {
  const v = show.video;
  if (!(v.readyState >= 2 && v.videoWidth)) return;
  if (!live.rvfc && now - live.polled > 80) {  // 새 장면을 알려 주지 않는 브라우저에서는 전처럼 정해진 간격으로 올린다
    live.polled = now;
    live.fresh = true;
  }
  const big = v.videoWidth * v.videoHeight > LIVE_MAX;
  if (!live.fresh || now - live.at < (pixels.level > 0 ? 125 : big ? 80 : LIVE_GAP)) return;      // 자동 해상도가 내려가 있으면(버거운 컴퓨터) 더 드물게
  live.seen.setFromProjectionMatrix(live.view.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
  if (!live.seen.intersectsBox(screenObj.boxes[0])) return;       // 칠판이 안 보이면 미뤄 둔다 (다시 보이면 바로 올린다)
  live.fresh = false;
  live.at = now;
  if (big) {                         // 아주 큰 화면: 1280×720 캔버스에 줄여 그려서 올린다
    liveMesh.visible = false;
    live.w = live.h = 0;
    drawFit(v, v.videoWidth, v.videoHeight);
    lap.upN++;
    lap.upPx += SHOW_W * SHOW_H;
    return;
  }
  if (live.w !== v.videoWidth || live.h !== v.videoHeight || !liveMesh.visible) {
    live.w = v.videoWidth;
    live.h = v.videoHeight;
    drawFit();                       // 자료 화면은 빈 바탕으로 (영상 양옆 · 위아래의 남는 곳)
    fitLive();
    liveMesh.visible = true;
  }
  liveTex.needsUpdate = true;
  lap.upN++;
  lap.upPx += live.w * live.h;
  dirty = true;
}
function startLive(stream) {
  endShow(false);
  show.stream = stream;
  playLive(stream);
  setShow('live', myId);
  const track = stream.getVideoTracks()[0];
  if (track) track.addEventListener('ended', () => { if (show.stream === stream) endShow(); });   // 브라우저의 "공유 중지"를 눌렀을 때
  if (link) link.send({ t: 'p', id: myId, k: 'live' });
}
async function shareScreen() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    toast('이 브라우저에서는 화면 공유를 쓸 수 없어요');
    return;
  }
  const asked = performance.now();
  try {
    startLive(await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { max: 15 }, width: { max: 1920 }, height: { max: 1200 } }, audio: false,       // 보는 쪽이 감당할 만한 크기와 빠르기로
    }));
  } catch (err) {
    console.warn('화면 공유 실패', err);
    // 고르는 창이 뜨기도 전에 바로 거절되면 사용자가 취소한 게 아니라 브라우저나 운영체제가 막은 것이다
    const blockedAtOnce = performance.now() - asked < 400;
    if (err && err.name === 'NotAllowedError' && !blockedAtOnce) {
      toast('화면 공유를 취소했어요');
    } else {
      toast('이 창에서는 화면 공유가 막혀 있어요. 크롬·엣지에서 열고, 맥이라면 시스템 설정 > 개인정보 보호 및 보안 > 화면 기록에서 브라우저를 허용해 주세요.', 12000);
    }
  }
}

/* ── 다른 사람이 띄운 자료 받기 ── */
function onShow(m) {
  if (peers.has(m.id)) pointRemote(peers.get(m.id).actor);         // 선생님이 리모컨으로 스크린을 가리킨다
  if (m.k === 'off') {
    if (show.by === m.id) endShow(false);
    return;
  }
  if (m.k === 'img') {
    if (typeof m.d !== 'string' || !m.d.startsWith('data:image/jpeg;base64,') || m.d.length > 400000) return;
    if (presenting() || show.mode === 'live') endShow(false);      // 새로 띄운 쪽을 따른다
    show.page = (m.n | 0) - 1;
    show.total = m.of | 0;
    setShow('slides', m.id);
    const img = new Image();
    img.onload = () => { if (show.by === m.id && show.mode === 'slides') drawFit(img, img.width, img.height); };
    img.src = m.d;
  } else if (m.k === 'txt' && typeof m.x === 'string') {
    if (presenting() || show.mode === 'live') endShow(false);
    show.text = m.x.slice(0, 80);
    setShow('text', m.id);
    drawText(show.text);
  } else if (m.k === 'live') {
    if (show.mode === 'live' && show.by === m.id) return;          // 이미 받고 있다
    endShow(false);
    setShow('live', m.id);
    showNote('화면 공유를 연결하는 중…');
    rtcSend(m.id, { type: 'want' });                               // "나에게도 보내 주세요"
  }
}

/* ── WebRTC 연결 맺기 ── */
const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const rtcSend = (to, d) => { if (link) link.send({ t: 'rtc', id: myId, to, d }); };

function makePc(peerId) {
  if (show.pcs.has(peerId)) show.pcs.get(peerId).close();
  const pc = new RTCPeerConnection(RTC_CONFIG);
  pc.queue = Promise.resolve();                      // 받은 순서대로 하나씩 처리하기 위한 줄
  pc.onicecandidate = (e) => { if (e.candidate) rtcSend(peerId, { type: 'ice', c: e.candidate.toJSON() }); };
  show.pcs.set(peerId, pc);
  return pc;
}

function onRtc(m) {
  const d = m.d, from = m.id;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'want') {                           // (선생님) 보고 싶다는 사람에게 연결을 제안한다
    if (!presenting() || show.mode !== 'live' || !show.stream) return;
    const pc = makePc(from);
    for (const track of show.stream.getTracks()) pc.addTrack(track, show.stream);
    pc.queue = pc.createOffer()
      .then((offer) => pc.setLocalDescription(offer))
      .then(() => rtcSend(from, { type: 'offer', sdp: pc.localDescription.sdp }))
      .catch((err) => console.warn('화면 공유 연결 실패', err));
  } else if (d.type === 'offer') {                   // (보는 사람) 제안을 받아 답한다
    if (show.mode !== 'live' || show.by !== from || typeof d.sdp !== 'string') return;
    const pc = makePc(from);
    pc.ontrack = (e) => playLive(e.streams[0] || new MediaStream([e.track]));
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed' && show.pcs.get(from) === pc) showNote('화면 공유 연결에 실패했어요');
    };
    pc.queue = pc.setRemoteDescription({ type: 'offer', sdp: d.sdp })
      .then(() => pc.createAnswer())
      .then((answer) => pc.setLocalDescription(answer))
      .then(() => rtcSend(from, { type: 'answer', sdp: pc.localDescription.sdp }))
      .catch((err) => console.warn('화면 공유 연결 실패', err));
  } else {
    const pc = show.pcs.get(from);
    if (!pc) return;
    if (d.type === 'answer' && typeof d.sdp === 'string') {
      pc.queue = pc.queue.then(() => pc.setRemoteDescription({ type: 'answer', sdp: d.sdp })).catch(() => {});
    } else if (d.type === 'ice' && d.c) {
      pc.queue = pc.queue.then(() => pc.addIceCandidate(d.c)).catch(() => {});
    }
  }
}

/* ── 리모컨: 선생님이 강의실 어디서든 큰 스크린을 조작한다 (R 키로 꺼내고 넣는다) ── */
const remoteBody = new THREE.MeshLambertMaterial({ color: '#2b2e36' });
const remoteDot = new THREE.MeshBasicMaterial({ color: '#ff5a4d' });
function remoteMesh() {              // 작은 리모컨 모형: 몸통 + 빨간 전원 단추

function setRemoteOut(on) {

// 리모컨을 든 팔을 앞으로 뻗어 스크린을 가리킨다 (다른 사람 눈에도 보인다)
function pointRemote(actor) {
  if (gestures.some((g) => g.actor === actor)) return;
  actor.reachSide = 0;
  actor.reachFwd = 2;
  gestures.push({ actor, t: 0 });
  dirty = true;
}
function gesturesThink(dt) {
  for (let i = gestures.length - 1; i >= 0; i--) {
    const g = gestures[i];
    g.t += dt / 0.6;
    const aiming = [...lasers.values()].some((L) => L.actor === g.actor);     // 레이저를 쏘는 중이면 팔을 계속 들고 있는다
    g.actor.reachAmt = aiming ? 1 : g.t >= 1 ? 0 : Math.sin(Math.PI * g.t);
    g.actor.applyPose();
    if (g.t >= 1) gestures.splice(i, 1);
  }
  if (heldKick > 0) {
    heldKick = Math.max(0, heldKick - dt * 5);
    held.position.z = -0.4 - 0.05 * Math.sin(Math.PI * heldKick);
    return true;
  }
  return gestures.length > 0;
}

/* ───────────── BGM: 음악 파일 없이 코드로 만들어 내는 배경 음악 (다섯 가지 분위기) ─────────────
   소리를 그때그때 합성하므로 내려받을 파일도, 저작권 걱정도 없다. 선생님이 고르면 모두에게 같은 분위기가 흐르고,
   소리를 켜고 끄는 것은 각자 정한다. */
const VOL = 0.5;
let ac = null, master = null, noiseBuf = null;
let soundOn = true;                  // 내 기기에서 소리를 들을지
let bgmNow = null;                   // 지금 흐르는 음악 { out, fx, loops, timer }

function audioReady() {              // 브라우저는 사용자가 무언가 누른 뒤에만 소리를 허락한다 → 입장할 때 준비해 둔다
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = soundOn ? VOL : 0;
    master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume().catch(() => {});
  return true;
}
const hz = (midi) => 440 * 2 ** ((midi - 69) / 12);       // 건반 번호 → 주파수

// 음 하나: 부드럽게 시작해서 서서히 사라진다
function tone(bus, midi, t, dur, vol, type = 'sine', attack = 0.02) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.value = hz(midi);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(bus);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function noise() {
  if (!noiseBuf) {
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}
// 짧은 잡음 한 번 (하이햇 · 빗방울)
function hit(bus, t, dur, vol, freq, q = 1, type = 'highpass') {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noise();
  f.type = type;
  f.frequency.value = freq;
  f.Q.value = q;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(bus);
  s.start(t, Math.random() * 1.5);
  s.stop(t + dur + 0.02);
}
function kick(bus, t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(130, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.16);
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g).connect(bus);
  o.start(t);
  o.stop(t + 0.25);
}

// 화음 (맨 앞이 베이스)
const CALM = [[48, 60, 64, 67, 71], [45, 57, 60, 64, 67], [41, 57, 60, 65, 69], [43, 59, 62, 67, 69]];
const FOCUS = [[38, 50, 57, 60, 65], [34, 50, 53, 57, 62], [41, 53, 57, 60, 64], [36, 52, 55, 60, 64]];
const BRIGHT = [[48, 60, 64, 67], [43, 59, 62, 67], [45, 57, 60, 64], [41, 57, 60, 65]];
const pick = (list) => list[Math.random() * list.length | 0];

/* step = 한 박의 길이(초) · echo = [메아리 간격, 되울림] · play(bus, i, t) = i 번째 박에 낼 소리를 t 시각에 예약 */
const MOODS = {
  off: { name: '끔' },
  calm: {                            // 느린 분산 화음
    name: '잔잔한', step: 0.4545, echo: [0.34, 0.3],
    play(bus, i, t) {
      const ch = CALM[(i >> 3) % 4], s = i & 7;
      if (s === 0) tone(bus, ch[0], t, 3.5, 0.2, 'sine', 0.05);
      tone(bus, ch[[1, 2, 3, 4, 3, 2, 3, 2][s]], t, 1.7, 0.085, 'triangle');
      if (s === 4 && Math.random() < 0.4) tone(bus, ch[4] + 12, t, 2.2, 0.04);
    },
  },
  focus: {                           // 길게 깔리는 화음 + 드문드문 한 음
    name: '집중', step: 1, echo: [0.5, 0.35],
    play(bus, i, t) {
      const ch = FOCUS[(i >> 2) % 4];
      if (i % 4 === 0) {
        tone(bus, ch[0], t, 4.4, 0.16, 'sine', 0.5);
        for (let k = 1; k < ch.length; k++) tone(bus, ch[k], t, 4.8, 0.045, 'sine', 1.4);
      } else if (Math.random() < 0.4) {
        tone(bus, pick([74, 77, 79, 81, 84]), t + (Math.random() < 0.5 ? 0 : 0.5), 1.4, 0.03, 'triangle');
      }
    },
  },
  bright: {                          // 가벼운 박자 + 통통 튀는 가락
    name: '활기찬', step: 0.268,
    play(bus, i, t) {
      const ch = BRIGHT[(i >> 3) % 4], s = i & 7;
      if (s === 0 || s === 4) kick(bus, t);
      if (s & 1) hit(bus, t, 0.05, 0.035, 7000);
      if (s === 0 || s === 3 || s === 4 || s === 6) tone(bus, ch[0], t, 0.3, 0.2, 'sine', 0.01);
      if (s !== 7 || Math.random() < 0.5) tone(bus, ch[1 + [0, 1, 2, 1, 0, 2, 1, 2][(s + (i >> 4)) % 8]] + 12, t, 0.34, 0.06, 'triangle', 0.01);
    },
  },
  rain: {                            // 빗소리 + 가끔 한 음
    name: '빗소리', step: 0.5, echo: [0.4, 0.3],
    start(bus, loops) {
      const s = ac.createBufferSource(), hp = ac.createBiquadFilter(), lp = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noise();
      s.loop = true;
      hp.type = 'highpass';
      hp.frequency.value = 500;
      lp.type = 'lowpass';
      lp.frequency.value = 5000;
      g.gain.value = 0.1;
      s.connect(hp).connect(lp).connect(g).connect(bus);
      s.start();
      loops.push(s);
    },
    play(bus, i, t) {
      for (let k = 0; k < 3; k++) {
        if (Math.random() < 0.6) hit(bus, t + Math.random() * 0.5, 0.05, 0.03 + Math.random() * 0.03, 2500 + Math.random() * 3500, 8, 'bandpass');
      }
      if (i % 4 === 0 && Math.random() < 0.45) tone(bus, pick([60, 62, 64, 67, 69, 72]), t, 3, 0.05, 'sine', 0.03);
    },
  },
  dream: {                           // 낮게 깔리는 음 위로 종소리가 오르내린다
    name: '몽환적', step: 0.556, echo: [0.42, 0.5],
    play(bus, i, t) {
      if (i % 16 === 0) {
        tone(bus, 36, t, 9.4, 0.12, 'sine', 2.5);
        tone(bus, 43, t, 9.4, 0.07, 'sine', 3);
      }
      if (Math.random() < 0.6) {
        this.at = clamp((this.at ?? 3) + (Math.random() * 5 | 0) - 2, 0, 7);
        const n = [72, 74, 76, 79, 81, 84, 86, 88][this.at];
        tone(bus, n, t, 3.2, 0.055, 'sine', 0.01);
        tone(bus, n + 19, t, 1.2, 0.012, 'sine', 0.01);
      }
    },
  },
};

function playBgm(key) {
  if (bgmNow) {                      // 흐르던 음악은 서서히 줄여서 끈다
    const old = bgmNow;
    bgmNow = null;
    clearInterval(old.timer);
    old.out.gain.setTargetAtTime(0, ac.currentTime, 0.15);
    setTimeout(() => {
      for (const s of old.loops) { try { s.stop(); } catch {} }
      for (const n of old.fx) n.disconnect();
    }, 900);
  }
  const mood = MOODS[key];
  if (!mood || !mood.play || !entered || !audioReady()) return;
  const out = ac.createGain(), bus = ac.createGain();
  out.gain.value = 0;
  out.gain.setTargetAtTime(1, ac.currentTime, 0.4);
  out.connect(master);
  bus.connect(out);
  const now = { out, fx: [out, bus], loops: [], timer: 0, i: 0, t: ac.currentTime + 0.1 };
  if (mood.echo) {                   // 메아리: 소리를 조금 늦춰 작게 되돌린다
    const delay = ac.createDelay(1), back = ac.createGain(), wet = ac.createGain();
    delay.delayTime.value = mood.echo[0];
    back.gain.value = mood.echo[1];
    wet.gain.value = 0.5;
    bus.connect(delay);
    delay.connect(back);
    back.connect(delay);
    delay.connect(wet);
    wet.connect(out);
    now.fx.push(delay, back, wet);
  }
  if (mood.start) mood.start(bus, now.loops);
  const tick = () => {               // 1.5초 앞까지 미리 예약해 둔다 (다른 탭을 보고 있어도 끊기지 않게)
    if (now.t < ac.currentTime) now.t = ac.currentTime + 0.05;
    while (now.t < ac.currentTime + 1.5) {
      mood.play(bus, now.i++, now.t);
      now.t += mood.step;
    }
  };
  tick();
  now.timer = setInterval(tick, 300);
  bgmNow = now;
}

function showSound() {
  const on = entered && cfg.bgm !== 'off';
  $('soundBtn').hidden = !on;
  if (on) $('soundBtn').textContent = `♪ ${MOODS[cfg.bgm].name} · 소리 ${soundOn ? '켬' : '끔'}`;
}
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  if (master) master.gain.setTargetAtTime(soundOn ? VOL : 0, ac.currentTime, 0.05);
  showSound();
  canvas.focus();
});

/* ───────────── 판서: 칠판을 정면에서 보면서(크게 보기) 끌어서 쓴다 ─────────────
   화이트 · 그린보드에는 선생님만, 자유 보드에는 앉아 있는 학생도 쓸 수 있다.
   판서는 "획" 단위로 기억한다. 그래서 획 하나를 통째로 지우거나, 나중에 들어온 사람에게 그대로 다시 보내 줄 수 있다.
     d  판서 소식
        s · k · c · w · p   획 이름 · 도구(0 볼펜, 1 만년필, 2 지우개) · 색 번호 · 굵기 번호 · 이어 붙일 점들 [u, v, …] (칠판 왼쪽 아래가 0,0)
        e                   통째로 지울 획 이름들
        x                   모두 지우기
        all                 나중에 들어온 사람에게 보내 주는 지금까지의 획들 (r = 받기 전에 비우기) */
const PEN_W = [0.55, 1, 1.9];        // 굵기 세 단계
const TOOL_NO = { ball: 0, fount: 1, rub: 2 };
const round4 = (v) => Math.round(v * 10000) / 10000;
const pen = { id: null, tool: 'ball', erase: 'rub', write: 'ball', color: 0, size: 1, key: '', n: 0, last: null, out: [], gone: [], zout: [], zend: false, sentAt: 0 };

/* 획에서 아직 그리지 않은 부분을 그린다 (from = 이미 그린 점의 수).
   점과 점을 곧은 선으로 이으면 빨리 그은 획에서 꺾인 자국이 보인다. 그래서 꺾이는 점마다
   "앞 가운데점 → (꺾이는 점 쪽으로 휘어서) → 뒤 가운데점" 으로 둥글게 잇는다. 점의 수도 그리는 횟수도 그대로라 부담은 같다.
   조각 i 는 점 i+1 이 와야 그릴 수 있어서 펜 끝이 반 칸쯤 늦게 따라오고, 획을 끝낼 때 마지막 점을 한 번 더 받아 끝까지 닿는다 (penEnd) */
function inkDraw(st, from) {
  const c = ink.ctx, W = ink.canvas.width, H = ink.canvas.height, p = st.pts, n = p.length / 2;
  const base = H * 0.009 * PEN_W[st.size];
  const X = (i) => p[i * 2] * W, Y = (i) => (1 - p[i * 2 + 1]) * H;
  const MX = (i) => (X(i) + X(i + 1)) / 2, MY = (i) => (Y(i) + Y(i + 1)) / 2;        // 점 i 와 i+1 의 가운데
  c.lineCap = c.lineJoin = 'round';
  c.globalCompositeOperation = st.tool === 2 ? 'destination-out' : 'source-over';
  c.strokeStyle = st.tool === 2 ? '#000000' : BOARDS[cfg.board].pens[st.color] || BOARDS[cfg.board].text;
  if (from === 0) {                  // 첫 점: 점 하나를 찍는다
    c.lineWidth = st.tool === 2 ? base * 7 : st.tool === 1 ? base * 1.3 : base;
    c.beginPath();
    c.moveTo(X(0), Y(0));
    c.lineTo(X(0) + 0.01, Y(0));
    c.stroke();
  }
  const first = Math.max(0, from - 1), last = n - 2;         // 이번에 그릴 조각들
  if (st.tool === 1) {               // 만년필: 펜촉이 비스듬해서, 긋는 방향에 따라 획이 가늘어지고 굵어진다
    for (let i = first; i <= last; i++) {
      const sx = i ? MX(i - 1) : X(0), sy = i ? MY(i - 1) : Y(0), ex = MX(i), ey = MY(i);
      const want = base * 1.7 * (0.25 + 0.75 * Math.abs(Math.sin(Math.atan2(ey - sy, ex - sx) + Math.PI / 4)));
      st.w = st.w ? st.w * 0.6 + want * 0.4 : want;
      c.lineWidth = st.w;
      c.beginPath();
      c.moveTo(sx, sy);
      c.quadraticCurveTo(X(i), Y(i), ex, ey);
      c.stroke();
    }
  } else if (first <= last) {        // 볼펜(굵기가 고르다) · 지우개(문지른 곳만 지운다)
    c.lineWidth = st.tool === 2 ? base * 7 : base;
    c.beginPath();
    c.moveTo(first ? MX(first - 1) : X(0), first ? MY(first - 1) : Y(0));
    for (let i = first; i <= last; i++) c.quadraticCurveTo(X(i), Y(i), MX(i), MY(i));
    c.stroke();
  }
  // 방금 그린 곳을 감싸는 네모 (선 굵기의 절반 + 가장자리 번짐만큼 넉넉하게) → 그 조각들만 그래픽 카드로 다시 보낸다
  if (!ink.full) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = Math.max(0, from - 2); i < n; i++) {
      const x = X(i), y = Y(i);
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    }
    const pad = (st.tool === 2 ? base * 7 : base * 1.7) / 2 + 2;
    inkMark(x0 - pad, y0 - pad, x1 + pad, y1 + pad);
  }
}

  if (!Array.isArray(m.p) || m.p.length > 2000 || m.p.length % 2 || !m.p.every(Number.isFinite)) return;
  zapAdd(m.s, Number.isInteger(m.w) && m.w >= 0 && m.w <= 2 ? m.w : 1, m.p.map((v) => clamp(v, 0, 1)), !!m.e);
  if (peer.teacher && m.p.length) followNote(BOARD.x + (clamp(m.p[m.p.length - 2], 0, 1) - 0.5) * BOARD.w);      // 학생 화면이 따라갈 곳
}

// 펜이 (u, v) 에 닿았다: 긋거나, 문질러 지우거나, 닿은 획을 통째로 지운다
function penAt(uv) {
  if (pen.tool === 'laser') {
    zapAdd(pen.key, pen.size, uv);
    pen.zout.push(uv[0], uv[1]);
  } else if (pen.tool === 'wipe') {
    const keys = strokesNear(uv[0], uv[1], BOARD.h * 0.035 * PEN_W[pen.size]);
    if (keys.length) {
      inkErase(keys);
      pen.gone.push(...keys);
    }
  } else {
    inkAdd(pen.key, TOOL_NO[pen.tool], pen.color, pen.size, uv);
    pen.out.push(uv[0], uv[1]);
  }
  pen.last = uv;
  // 판서하는 선생님: 팔은 쓰는 곳을 가리키고, 쓰는 곳이 멀어지면 몸도 따라 옮겨 간다
  const hx = (uv[0] - 0.5) * BOARD.w;
  player.handTo.x = hx;
  player.handTo.y = BOARD.y + (uv[1] - 0.5) * BOARD.h;
  if (player.mode === 'free' && Math.abs(hx - 0.3 - player.pos.x) > 0.9) goWrite(hx - 0.3);
}
function penDown(e) {
  const laser = pen.tool === 'laser';
  if (pen.id !== null || zoomAmt < 0.97 || !(laser ? canZap() : canWrite())) return;
  const uv = boardUV(e);
  if (!uv) return;
  if (follow.on && canFollow()) setFollow(false, '직접 쓰기 시작해서 ');
  pen.id = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  pen.key = `${myId}-${laser ? 'z' : ''}${++pen.n}`;
  penAt(uv);
}
// 획을 끝낸다: 마지막 점을 한 번 더 적어서, 둥글게 이어 그리던 획이 마지막 점까지 닿게 한다
function penEnd() {
  if (!pen.last || pen.tool === 'wipe') return;
  if (pen.tool === 'laser') {        // 레이저 펜: 다 그었다고 알린다 (펜 끝의 밝은 점이 꺼지고, 손을 멈춘 것으로 센다)
    zapAdd(pen.key, pen.size, [], true);
    pen.zend = true;
    return;
  }
  inkAdd(pen.key, TOOL_NO[pen.tool], pen.color, pen.size, pen.last);
  pen.out.push(pen.last[0], pen.last[1]);
}
function penMove(e) {
  const uv = boardUV(e);
  if (!uv) {                         // 칠판 밖으로 나가면 획을 끊는다
    penEnd();
    penFlush();
    pen.last = null;
    return;
  }
  if (!pen.last) pen.key = `${myId}-${pen.tool === 'laser' ? 'z' : ''}${++pen.n}`;       // 다시 들어오면 새 획
  else if (Math.hypot((uv[0] - pen.last[0]) * BOARD.w, (uv[1] - pen.last[1]) * BOARD.h) < 0.012) return;
  penAt(uv);
  // 사람이 많을수록 덜 자주 보낸다 (그은 선은 내 화면에는 바로 보인다)
  if (pen.out.length + pen.zout.length >= 240 || Date.now() - pen.sentAt > Math.max(150, netPace().sendMs * 0.75)) penFlush();
}
function penFlush() {
  if (link && pen.out.length) {
    link.send({ t: 'd', id: myId, s: pen.key, k: TOOL_NO[pen.tool], c: pen.color, w: pen.size, p: pen.out.map(round4) });
  }
  if (link && pen.gone.length) link.send({ t: 'd', id: myId, e: pen.gone });
  if (link && (pen.zout.length || pen.zend)) link.send({ t: 'z', id: myId, s: pen.key, w: pen.size, p: pen.zout.map(round4), e: pen.zend ? 1 : 0 });
  pen.out = [];
  pen.gone = [];
  pen.zout = [];
  pen.zend = false;
  pen.sentAt = Date.now();
}
function penUp() {
  if (pen.id === null) return;
  penEnd();
  penFlush();
  pen.id = pen.last = null;
}

// 받은 획이 제대로 된 것인지
function okStroke(key, tool, color, size, pts) {
  return typeof key === 'string' && key.length <= 40 && (tool === 0 || tool === 1 || tool === 2)
    && Number.isInteger(color) && color >= 0 && color <= 4 && Number.isInteger(size) && size >= 0 && size <= 2
    && Array.isArray(pts) && pts.length >= 2 && pts.length <= 6000 && pts.length % 2 === 0 && pts.every(Number.isFinite);
}
const in01 = (v) => clamp(v, 0, 1);
// 다른 사람이 쓴 것 받기
function onInk(m) {
  const peer = peers.get(m.id);
  if (!peer || cfg.board === 'video') return;
  if (Array.isArray(m.all)) {        // 내가 들어오기 전에 쓰여 있던 판서
    if (m.to !== myId) return;
    if (m.r) inkClear(false);
    for (const it of m.all.slice(0, 3000)) {
      if (Array.isArray(it) && okStroke(...it)) inkAdd(it[0], it[1], it[2], it[3], it[4].map(in01));
    }
    return;
  }
  if (m.x) {                         // 모두 지우기는 선생님만
    if (peer.teacher) inkClear(false);
    return;
  }
  if (cfg.board !== 'free' && !peer.teacher) return;
  if (Array.isArray(m.e)) {          // 획 지우개: 학생은 자기가 그은 획만
    inkErase(m.e.slice(0, 300).filter((key) => typeof key === 'string' && (peer.teacher || key.startsWith(m.id + '-'))));
    return;
  }
  if (typeof m.s === 'string' && m.s.startsWith(m.id + '-') && okStroke(m.s, m.k, m.c, m.w, m.p)) {
    inkAdd(m.s, m.k, m.c, m.w, m.p.map(in01));
    if (peer.teacher) followNote(BOARD.x + (in01(m.p[m.p.length - 2]) - 0.5) * BOARD.w);     // 방금 그은 획의 끝
  }
}
// 새로 온 사람에게 지금까지의 판서를 보내 줄 한 사람: 선생님 가운데(없으면 모두 가운데) id 가 가장 앞선 사람
function inkKeeper(newId) {
  const all = [[myId, isTeacher], ...[...peers.values()].map((p) => [p.id, p.teacher])].filter((x) => x[0] !== newId);
  const pool = all.some((x) => x[1]) ? all.filter((x) => x[1]) : all;
  return pool.map((x) => x[0]).sort()[0] === myId;
}
function sendInk(to) {
  if (!link || !strokes.length) return;
  let batch = [], count = 0, first = 1;
  const flush = () => {              // 메시지 한 개가 너무 커지지 않게 나눠 보낸다
    link.send({ t: 'd', id: myId, to, all: batch, r: first });
    first = 0;
    batch = [];
    count = 0;
  };
  for (const st of strokes) {
    for (let i = 0; i < st.pts.length; i += 3000) {
      const part = st.pts.slice(i, i + 3000).map(round4);
      batch.push([st.key, st.tool, st.color, st.size, part]);
      count += part.length;
      if (count >= 9000) flush();
    }
  }
  if (batch.length) flush();
}

// 하위 메뉴 (지우개 · 색): 한 번에 하나만 열린다. 닫은 것이 있으면 true

/* ───────────── 강의실 설정: 선생님이 고르면 같은 수업의 모두에게 적용된다 ─────────────
   내 상태를 알리는 s 메시지에 설정 네 가지와 "바꾼 시각"을 함께 실어 보낸다. 받는 쪽은 더 나중에 바뀐 것을 따른다 */
const CFG_KEYS = ['form', 'table', 'board', 'bgm', 'size'];
const CFG_SETS = { form: FORMS, table: TABLES, board: BOARDS, bgm: MOODS, size: BSIZES };
const CFG_TITLE = { form: '강의실', table: '자리 배치', board: '칠판', bgm: 'BGM', size: '칠판 크기' };
const CFG_FIRST = { form: 'mid', table: 'solo', board: 'video', bgm: 'off', size: 'm' };

// 하던 일을 멈추고 그 자리에 세운다 (강의실을 새로 지으면 자리가 모두 바뀌므로)
function freeActor(a) {
  a.leaveSeat();
  a.mode = 'free';
  a.path = a.exit = null;
  a.sitAmt = a.reachAmt = 0;
  a.vel.x = a.vel.z = a.vy = 0;
  a.air = false;
}
// 들어왔을 때 서는 곳: 여럿이 겹쳐 서지 않게 정해진 구역의 빈 곳 아무 데나
// 들어올 때(entering)는 누구나 문 옆 거울 앞에 선다. 수업 중에 강의실이 바뀌어 다시 설 때는 학생은 거울 앞, 선생님은 칠판 앞
function spawn(a, entering = false) {
  const m = mirrorGlass.visible ? mirrorGlass.position : null;
  const [x0, x1, z0, z1] = a === player && isTeacher && !entering ? [-1.5, 1.5, TEACH_Z, TEACH_Z + 0.4]
    : m ? [m.x - 1.9, m.x - 1.1, m.z - 0.7, m.z + 0.7] : ROOM.spawn;
  const c = nearestFree(x0 + Math.random() * (x1 - x0), z0 + Math.random() * (z1 - z0));
  const x = c < 0 ? (x0 + x1) / 2 : cellX(c), z = c < 0 ? (z0 + z1) / 2 : cellZ(c);
  a.pos.set(x, floorAt(x, z), z);
}
// 새로 놓인 책상 속에 서 있게 됐다면 가까운 빈 곳으로 비켜난다
function settle(a) {
  collide(a.pos);
  const c = nearestFree(a.pos.x, a.pos.z);
  if (c >= 0 && c !== cellAt(a.pos.x, a.pos.z)) { a.pos.x = cellX(c); a.pos.z = cellZ(c); }
  a.pos.y = floorAt(a.pos.x, a.pos.z);
}
// 강의실을 새로 짓는다.
//   moved = 형태가 바뀌어서 모두 새 강의실의 입구에서 다시 시작한다
//   keep  = 자리는 그대로라서 (칠판 크기만 바뀜) 앉아 있던 사람은 그대로 앉아 있는다
function rebuild(moved, keep = false) {
  setZoom(false);
  zoomAmt = 0;
  for (const key of [...zaps.keys()]) zapDrop(key);      // 남아 있던 레이저 펜 자국도 치운다
  follow.at = 0;                     // 새 칠판에서는 선생님이 쓴 곳을 처음부터 다시 기억한다
  follow.fresh = false;
  setGhost(false);
  whisperPeer = '';
  $('ask').hidden = $('whisper').hidden = true;
  for (const n of notes.splice(0)) scene.remove(n.mesh);
  const who = [player, mate].map((a) => [a, seats.indexOf(a.seat)]);          // 누가 몇 번 자리에 있었는지
  const taken = seats.map((s) => s.taken);
  const peerSeat = [...peers.values()].map((peer) => [peer, seats.indexOf(peer.seat)]);
  if (!keep) {
    freeActor(player);
    freeActor(mate);
  }
  for (const peer of peers.values()) { peer.seat = null; peer.actor.reachAmt = 0; }
  target = takenSeat = null;
  showOutline([]);
  buildRoom();
  if (keep) {                        // 같은 번호의 새 자리에 그대로 이어 준다
    seats.forEach((s, i) => { s.taken = taken[i] || null; });
    for (const [a, i] of who) a.seat = i < 0 ? null : seats[i];
    for (const [peer, i] of peerSeat) peer.seat = i < 0 ? null : seats[i];
  } else if (entered) {
    if (moved) {
      spawn(player);
      player.bodyYaw = player.lookYaw = isTeacher ? 0 : FRONT;
      player.lookPitch = 0.05;
    } else settle(player);
  }
  player.applyPose();
  lastSent = '';
  lastSentAt = 0;
  dirty = true;
}

function applyConfig(ch) {           // ch = 바뀐 항목들
  if (ch.form || ch.table) rebuild(!!ch.form);
  else if (ch.size) rebuild(false, true);
  if (ch.form || ch.board || ch.size) {      // 강의실이나 칠판을 바꾸면 판서는 지워진다 (모두 같은 때 바꾸므로 따로 알리지 않는다)
    penUp();
    inkClear(false);
  }
  if (ch.board) {
    applyBoard();
    if (show.mode === 'text') drawText(show.text);                                           // 칠판 색에 맞춰 다시 쓴다
    else if (presenting() && show.mode === 'slides') setTimeout(() => gotoPage(show.page), 600);
  }
  if (ch.bgm) playBgm(cfg.bgm);
  showSetup();
  showPens();
  showSound();
  dirty = true;
}
const cfgText = (kind) => `${CFG_TITLE[kind]} · ${CFG_SETS[kind][cfg[kind]].name}`;

// 바꿀지 묻는 창
let confirmGo = null;                // "바꾸기"를 누르면 할 일
function askConfirm(title, text, go) {
  confirmGo = go;
  $('confirmTitle').textContent = title;
  $('confirmText').textContent = text;
  $('confirm').hidden = false;
  keys.clear();
  $('confirmNo').focus();
}
function closeConfirm(yes) {
  const go = confirmGo;
  confirmGo = null;
  $('confirm').hidden = true;
  canvas.focus();
  if (yes && go) go();
}
$('confirmNo').addEventListener('click', () => closeConfirm(false));
$('confirmYes').addEventListener('click', () => closeConfirm(true));

// 선생님이 고름. 다른 사람에게 영향을 주는 변경은 먼저 묻는다 (sure = 이미 물어봤다)
function setConfig(kind, key, sure = false) {
  if (!isTeacher || cfg[kind] === key || !Object.hasOwn(CFG_SETS[kind], key)) return;
  if (!sure) {
    const moves = (kind === 'form' || kind === 'table') && (peers.size > 0 || seats.some((s) => s.taken));
    const wipes = (kind === 'form' || kind === 'board' || kind === 'size') && strokes.length > 0;
    const warn = [
      moves && (kind === 'form' ? '모두 새 강의실의 입구에서 다시 시작해요.' : '앉아 있던 사람이 모두 일어서요.'),
      wipes && '칠판에 쓴 것이 지워져요.',
    ].filter(Boolean).join(' ');
    if (warn) {
      askConfirm(`${CFG_TITLE[kind]} → ${CFG_SETS[kind][key].name}`, `${warn} 바꿀까요?`, () => setConfig(kind, key, true));
      return;
    }
  }
  cfg[kind] = key;
  cfgAt[kind] = Date.now();
  applyConfig({ [kind]: true });
  if (creator && kind in preset) {   // 다음에 "지난번처럼" 들어올 때도 이 강의실로 시작한다
    preset[kind] = key;
    showPreset();
    saveProfile();
  }
  lastSent = '';
  lastSentAt = 0;                    // 곧바로 모두에게 알린다
  toast(kind === 'form' || kind === 'table' ? `${cfgText(kind)} · 자리 ${seatCount()}개` : cfgText(kind));
}
// 다른 사람이 알려 준 설정: 내가 아는 것보다 나중에 바뀐 항목만 따른다
function onConfig(list) {
  if (!Array.isArray(list)) return;
  const ch = {};
  CFG_KEYS.forEach((kind, i) => {
    const key = list[i * 2], at = Number(list[i * 2 + 1]) || 0;
    if (typeof key !== 'string' || !Object.hasOwn(CFG_SETS[kind], key) || at <= cfgAt[kind]) return;
    cfgAt[kind] = at;
    if (cfg[kind] !== key) { cfg[kind] = key; ch[kind] = true; }
  });
  const changed = Object.keys(ch);
  if (!changed.length) return;
  applyConfig(ch);
  toast(changed.map(cfgText).join(' / '), 4000);
}
// 강의실에서 나가면 처음 모습으로 돌려놓는다 (다음에 들어갈 수업의 설정은 그 수업에서 새로 받는다)
function resetConfig() {
  const ch = {};
  for (const kind of CFG_KEYS) {
    cfgAt[kind] = 0;
    if (cfg[kind] !== CFG_FIRST[kind]) { cfg[kind] = CFG_FIRST[kind]; ch[kind] = true; }
  }
  penUp();
  inkClear(false);
  applyConfig(ch);
}

// 설정 창: 항목마다 단추를 늘어놓고, 지금 고른 것을 눌린 모양으로 보여 준다
const SEGS = [['form', 'segForm'], ['table', 'segTable'], ['board', 'segBoard'], ['size', 'segSize'], ['bgm', 'segBgm']];

  }

}

$('setupBtn').addEventListener('click', () => { $('setup').hidden = !$('setup').hidden; canvas.focus(); });
$('setupClose').addEventListener('click', () => { $('setup').hidden = true; canvas.focus(); });

// 문구 띄우기: 리모컨 단추를 누르면 입력 칸이 열리고, Enter 를 누르면 스크린 한가운데에 뜬다

/* ── 레이저 포인터: 리모컨으로 스크린을 가리키면 빨간 점이 찍히고, 모두에게 보인다 (l 메시지) ── */
const laserDotMat = new THREE.MeshBasicMaterial({
  transparent: true, depthWrite: false,
  map: makeTex(32, 32, (g) => {
    const grd = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    grd.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grd.addColorStop(0.25, 'rgba(255, 50, 40, 1)');
    grd.addColorStop(0.55, 'rgba(255, 40, 30, .55)');
    grd.addColorStop(1, 'rgba(255, 40, 30, 0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 32, 32);
  }, { smooth: true }),
});
const laserBeamMat = new THREE.LineBasicMaterial({ color: '#ff3b30', transparent: true, opacity: 0.5 });
const lasers = new Map();            // 쏘는 사람 id → { dot, beam, actor, u, v, tu, tv, last }
let laserOn = false, laserSent = '', laserSentAt = 0;
const _from = new THREE.Vector3();

function laserFor(id, actor) {
  let L = lasers.get(id);
  if (L) return L;
  const dot = new THREE.Mesh(quad, laserDotMat);
  dot.renderOrder = 3;               // 자료 화면 · 판서보다 위에 그린다
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  const beam = new THREE.LineSegments(geo, laserBeamMat);
  beam.frustumCulled = false;
  scene.add(dot, beam);
  L = { dot, beam, actor, u: 0.5, v: 0.5, tu: 0.5, tv: 0.5, last: 0 };
  lasers.set(id, L);
  return L;
}
function removeLaser(id) {
  const L = lasers.get(id);
  if (!L) return;
  scene.remove(L.dot, L.beam);
  L.beam.geometry.dispose();
  lasers.delete(id);
  if (L.actor !== player) { L.actor.reachAmt = 0; L.actor.applyPose(); }
  dirty = true;
}
function setLaser(on) {
  laserOn = on && remoteOut;
  $('laserBtn').setAttribute('aria-pressed', String(laserOn));
  if (!laserOn) {
    removeLaser(myId);
    player.reachAmt = 0;
    if (link && laserSent && laserSent !== 'off') link.send({ t: 'l', id: myId, off: 1 });
    laserSent = '';
  }
  dirty = true;
}

// 다른 선생님의 레이저 위치 받기
function onLaser(m) {
  const peer = peers.get(m.id);
  if (!peer) return;
  if (m.off || !Number.isFinite(m.u) || !Number.isFinite(m.v)) { removeLaser(m.id); return; }
  const L = laserFor(m.id, peer.actor);
  L.tu = clamp(m.u, 0, 1);
  L.tv = clamp(m.v, 0, 1);
  if (!L.last) { L.u = L.tu; L.v = L.tv; }
  L.last = Date.now();
  peer.actor.reachSide = 0;            // 리모컨 든 팔을 스크린 쪽으로 뻗고 있는다
  peer.actor.reachFwd = 2;
  peer.actor.reachAmt = 1;
  peer.actor.applyPose();
  dirty = true;
}

function laserThink(dt) {
  let active = false;
  const now = Date.now();
  if (laserOn) {
    // 레이저가 스크린의 어디에 닿는지 (0~1, 왼쪽 아래가 0,0).
    // 칠판 보기(판서)에서는 마우스 포인터가 가리키는 곳, 평소에는 내 시선이 닿는 곳
    const cp = Math.cos(player.lookPitch);
    const dx = Math.sin(player.lookYaw) * cp, dy = -Math.sin(player.lookPitch), dz = Math.cos(player.lookYaw) * cp;
    let hit = null;
    if (zoomed && zoomAmt > 0.9 && hover.on) hit = boardUV(hover);
    else if (dz < -1e-4) {
      const t = (BOARD.z - camera.position.z) / dz;
      const u = (camera.position.x + dx * t) / BOARD.w + 0.5;
      const v = (camera.position.y + dy * t - BOARD.y) / BOARD.h + 0.5;
      if (u >= 0 && u <= 1 && v >= 0 && v <= 1) hit = [u, v];
    }
    player.reachSide = 0;
    player.reachFwd = 2;
    player.reachAmt = 1;
    if (hit) {
      const L = laserFor(myId, player);
      L.u = hit[0];
      L.v = hit[1];
    } else {
      removeLaser(myId);
    }
    // 달라졌을 때만, 너무 자주는 말고 보낸다
    const body = hit ? `${hit[0].toFixed(3)},${hit[1].toFixed(3)}` : 'off';
    const wait = body === laserSent ? 2000 : Math.max(120, netPace().sendMs * 0.6);
    if (link && now - laserSentAt >= wait && !(body === 'off' && laserSent === 'off')) {
      laserSent = body;
      laserSentAt = now;
      link.send(hit ? { t: 'l', id: myId, u: +hit[0].toFixed(3), v: +hit[1].toFixed(3) } : { t: 'l', id: myId, off: 1 });
    }
  }
  for (const [id, L] of lasers) {
    if (id !== myId) {
      if (now - L.last > 6000) { removeLaser(id); continue; }       // 소식이 끊기면 지운다
      const k = 1 - Math.exp(-18 * dt), du = L.tu - L.u, dv = L.tv - L.v;
      L.u += du * k;
      L.v += dv * k;
      if (Math.abs(du) + Math.abs(dv) > 0.0005) active = true;
    }
    const x = (L.u - 0.5) * BOARD.w, y = BOARD.y + (L.v - 0.5) * BOARD.h, z = BOARD.z + 0.02;
    L.dot.position.set(x, y, z);
    L.dot.scale.setScalar(Math.max(0.3, BOARD.h * 0.075));          // 강의실 뒤에서도 보일 크기
    if (id === myId) held.getWorldPosition(_from);                  // 빛줄기는 리모컨에서 나온다
    else _from.set(L.actor.pos.x, L.actor.pos.y + L.actor.model.rig.position.y + 0.86, L.actor.pos.z);
    const p = L.beam.geometry.attributes.position;
    p.setXYZ(0, _from.x, _from.y, _from.z);
    p.setXYZ(1, x, y, z);
    p.needsUpdate = true;
  }
  return active;
}

/* ───────────── 학생 메뉴: 앉아 있을 때 질문(Q) · 이해했어요(E) · 옆자리와 소곤거리기(X) ─────────────
     q  질문. 모두에게 말풍선으로 보이고, 선생님 화면에는 알림도 뜬다
     e  "이해했어요" 반응
     w  옆자리 친구에게 보내는 쪽지. 글은 받는 사람 화면에만 보이고, 쪽지가 오가는 모습은 모두에게 보인다 */
const whispers = new Map();          // 상대 id → 주고받은 쪽지 목록
let whisperPeer = '';                // 지금 소곤거리기 창이 열려 있는 상대
let lastOk = 0;

function openAsk() {
  $('ask').hidden = false;
  $('askText').value = '';
  $('askText').focus();
}
function closeAsk() {
  $('ask').hidden = true;
  canvas.focus();
}
$('ask').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('askText').value.trim().slice(0, 60);
  closeAsk();
  if (!text || player.mode !== 'seated') return;
  if (link) link.send({ t: 'q', id: myId, x: text });
  toast('질문을 올렸어요');
});
$('askText').addEventListener('keydown', (e) => { if (e.code === 'Escape') closeAsk(); });
$('askBtn').addEventListener('click', openAsk);

function sendOk() {
  if (player.mode !== 'seated' || Date.now() - lastOk < 2000) return;
  lastOk = Date.now();
  if (link) link.send({ t: 'e', id: myId });
  toast('"이해했어요"를 보냈어요');
}
$('okBtn').addEventListener('click', () => { sendOk(); canvas.focus(); });

// 소곤거릴 상대: 함께 접속한 사람, 또는 혼자 입장했을 때의 친구('mate')
function partner(id) {
  if (id === 'mate') return online() ? null : { actor: mate, seat: mate.seat };
  return peers.get(id) || null;
}

// 혼자 입장했을 때 친구가 보내는 답장
const MATE_LINES = ['쉿, 수업 중이야!', '끝나고 얘기하자!', '나도 잘 모르겠어…', '선생님이 보셔!', '응응, 알겠어 :)'];
function mateReply() {
  if (online() || !entered || player.mode !== 'seated' || mate.mode !== 'seated' || !isNeighbor(player.seat, mate.seat)) return;
  keepWhisper('mate', false, MATE_LINES[Math.random() * MATE_LINES.length | 0]);
  if ($('whisper').hidden || whisperPeer === 'mate') openWhisper('mate', false);
  passNote(mate, player);
  toast(`${polite(mate.name || '친구')}의 쪽지가 왔어요`);
}

function openWhisper(id, focus = true) {
  const peer = partner(id);
  if (!peer) return;
  whisperPeer = id;
  $('whisperName').textContent = `${polite(peer.actor.name)}과 소곤소곤`;
  $('whisperLog').replaceChildren(...(whispers.get(id) || []).slice(-30).map((w) => {
    const line = document.createElement('div');
    if (w.mine) line.className = 'me';
    line.textContent = w.text;
    return line;
  }));
  $('whisper').hidden = false;
  $('whisperLog').scrollTop = $('whisperLog').scrollHeight;
  if (focus) $('whisperText').focus();
}
function closeWhisper() {
  whisperPeer = '';
  $('whisper').hidden = true;
  canvas.focus();
}
function keepWhisper(id, mine, text) {
  if (!whispers.has(id)) whispers.set(id, []);
  whispers.get(id).push({ mine, text });
}
$('whisperForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('whisperText').value.trim().slice(0, 60);
  const peer = partner(whisperPeer);
  if (!text || !peer || (whisperPeer !== 'mate' && !link)) return;
  if (player.mode !== 'seated' || !isNeighbor(player.seat, peer.seat) || peer.actor.sitAmt < 0.9) {
    toast('앞·뒤·옆자리에 함께 앉아 있을 때만 소곤거릴 수 있어요');
    return;
  }
  $('whisperText').value = '';
  if (whisperPeer === 'mate') setTimeout(mateReply, 1500);
  else link.send({ t: 'w', id: myId, to: whisperPeer, x: text });
  keepWhisper(whisperPeer, true, text);
  openWhisper(whisperPeer);
  passNote(player, peer.actor);
});
$('whisperText').addEventListener('keydown', (e) => { if (e.code === 'Escape') closeWhisper(); });
$('whisperClose').addEventListener('click', closeWhisper);

function onClassMsg(m) {
  const peer = peers.get(m.id);
  if (!peer) return;
  const text = typeof m.x === 'string' ? m.x.slice(0, 60) : '';
  if (m.t === 'q' && text) {
    peer.actor.say(`질문: ${text}`, 12000);
    if (isTeacher) toast(`질문 · ${peer.actor.name}: ${text}`, 9000);
  } else if (m.t === 'e') {
    peer.actor.say('이해했어요!', 4000, '#d9f5e3');
  } else if (m.t === 'w') {
    const to = m.to === myId ? player : peers.get(m.to) && peers.get(m.to).actor;
    if (to) passNote(peer.actor, to);
    if (m.to === myId && text) {
      keepWhisper(m.id, false, text);
      if ($('whisper').hidden || whisperPeer === m.id) openWhisper(m.id, false);
      toast(`${polite(peer.actor.name)}의 쪽지가 왔어요`);
    }
  }
  dirty = true;
}

/* ── 쪽지가 오가는 모습: 보내는 사람이 팔을 뻗고, 쪽지가 포물선으로 날아가고, 받는 사람도 팔을 뻗는다 ── */
const notes = [];
const noteMat = new THREE.MeshBasicMaterial({ color: '#fffdf2' });
function passNote(from, to) {
  const mesh = new THREE.Mesh(box, noteMat);
  mesh.scale.set(0.14, 0.012, 0.1);
  scene.add(mesh);
  from.reachTo(to);
  to.reachTo(from);
  notes.push({ mesh, from, to, t: 0 });
  dirty = true;
}
function notesThink(dt) {
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    n.t = Math.min(1, n.t + dt / 0.9);
    const a = n.from.pos, b = n.to.pos, k = n.t * n.t * (3 - 2 * n.t);
    const h = 0.86 + (a.y + b.y + n.from.model.rig.position.y + n.to.model.rig.position.y) / 2;
    n.mesh.position.set(a.x + (b.x - a.x) * (0.22 + 0.56 * k), h + Math.sin(Math.PI * k) * 0.2, a.z + (b.z - a.z) * (0.22 + 0.56 * k));
    n.mesh.rotation.y += dt * 5;
    n.from.reachAmt = Math.max(0, 1 - n.t * 1.6);       // 보내는 사람은 처음에, 받는 사람은 끝에 팔을 뻗는다
    n.to.reachAmt = Math.max(0, n.t * 1.6 - 0.6);
    if (n.t >= 1) {
      n.from.reachAmt = n.to.reachAmt = 0;
      scene.remove(n.mesh);
      notes.splice(i, 1);
    }
    n.from.applyPose();
    n.to.applyPose();
  }
  return notes.length > 0;
}

/* ───────────── 카메라: 언제나 1인칭 (내 캐릭터의 눈) ───────────── */
function placeCamera() {
  if (!entered) {                    // 입장 전: 두 캐릭터가 나란히 보이는 소개 구도
    const side = camera.aspect < 1 ? 0 : 0.9;      // 가로 화면에서는 왼쪽 안내 카드를 피해 오른쪽에 세운다
    camera.position.set(-side, 1.15, 7.6);
    camera.lookAt(-side, 0.78, 4.4);
  } else {
    const sy = Math.sin(player.lookYaw), cy = Math.cos(player.lookYaw);
    const cp = Math.cos(player.lookPitch), sp = Math.sin(player.lookPitch);
    const eye = player.pos.y + player.model.rig.position.y + EYE_H;
    const x = player.pos.x + sy * EYE_FWD, z = player.pos.z + cy * EYE_FWD;

/* 자동 해상도: 계속 그리는 중인데 한 장에 24ms 넘게 걸리면(초당 40장 아래) 해상도를 한 단계 낮춰 본다.
   낮춰도 나아지지 않으면 해상도 탓이 아니므로 되돌리고 한동안 다시 해 보지 않는다. 한참 여유가 있으면 한 단계씩 되돌린다 */
const PIXEL_STEPS = [1, 0.85, 0.7, 0.55];
const pixels = { level: 0, trial: null, hold: 0, upHold: 0, wait: 60000, good: 0 };
function applyPixels() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, MAX_PIXEL_RATIO) * PIXEL_STEPS[pixels.level]);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  dirty = true;
}
function pixelThink(gap, busy) {     // 1초마다: 잇달아 그린 장들의 평균 간격(ms)과 그렇게 그린 시간의 합(ms)
  if (busy < 600 || document.hidden) { pixels.good = 0; return; }        // 그 1초의 대부분을 계속 그렸을 때만 판단한다
  const now = performance.now();
  if (pixels.trial) {                // 방금 낮춰 봤다: 나아졌는지
    if (gap > pixels.trial.gap * 0.9) {
      pixels.level = pixels.trial.from;
      pixels.hold = now + pixels.wait;
      pixels.wait = Math.min(pixels.wait * 2, 600000);
      applyPixels();
    } else pixels.upHold = now + 90000;
    pixels.trial = null;
    return;
  }
  if (gap > 24 && pixels.level < PIXEL_STEPS.length - 1) {
    if (now < pixels.hold) return;
    pixels.trial = { from: pixels.level, gap };
    pixels.level++;
    pixels.good = 0;
    applyPixels();
  } else if (gap < 17.5 && pixels.level > 0 && now > pixels.upHold) {
    if (++pixels.good >= 8) {        // 8초 내내 여유가 있었다
      pixels.level--;
      pixels.good = 0;
      pixels.upHold = now + 30000;
      applyPixels();
    }
  } else pixels.good = 0;
}
function resize() {
  applyPixels();

  camera.fov = camera.aspect < 1 ? 82 : 70;      // 세로 화면(휴대폰)에서는 조금 넓게

}

let last = performance.now();
let drawn = 0;
// 시스템 정보에 보여 주는 값 (0.5초마다 lap 에서 옮겨 적는다)
const lapShown = { think: 0, mirror: 0, draw: 0, gap: 0, gapMax: 0, mirrorHz: 0, upN: 0, upPx: 0 };
const info = { calls: 0, triangles: 0 };

// 계산만 한 걸음 진행 (그리기는 따로)
function advance(dt) {
  if (!entered || paused) return;
  readInput();
  if (autoLook(dt)) dirty = true;
  if (player.update(dt)) dirty = true;
  if (online() ? peersThink(dt) : mateThink(dt)) dirty = true;
  if (notesThink(dt)) dirty = true;
  if (gesturesThink(dt)) dirty = true;
  if (laserThink(dt)) dirty = true;
  if (zoomThink(dt)) dirty = true;
  if (writeThink(dt)) dirty = true;
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const t0 = performance.now();
  advance(dt);
  if (actors.roy.blink(now)) dirty = true;
  if (actors.stella.blink(now)) dirty = true;
  for (const peer of peers.values()) {
    if (peer.actor.blink(now)) dirty = true;
    if (peer.actor.tickBubble(now)) dirty = true;
  }
  if (show.mode === 'live') liveThink(now);       // 화면 공유: 새 장면만 그래픽 카드로 보낸다
  if (zaps.size && zapThink(performance.now())) dirty = true;     // 레이저 펜 자국을 서서히 지운다
  if (!dirty && mirrorStale && now - mirrorAt >= mirrorEvery()) dirty = true;     // 미뤄 둔 거울 그림을 마저 그린다
  if (!dirty) { lap.lastDraw = 0; return; }       // 바뀐 게 없으면 그리지 않는다 → 그래픽 카드가 쉰다
  dirty = false;
  placeCamera();
  updateTarget();
  crowd.fill();                       // 다른 사람들의 캐릭터를 묶음에 옮겨 적는다
  inkFlush();                         // 판서에서 바뀐 조각을 그래픽 카드로 보낸다
  const t1 = performance.now(), before = mirrorAt;
  mirrorThink(now);                   // 거울이 가까이 보이면 거울 속 모습부터 그린다
  const t2 = performance.now();
  renderer.render(scene, camera);
  lap.think += t1 - t0;
  lap.mirror += t2 - t1;
  lap.draw += performance.now() - t2;
  lap.n++;
  if (mirrorAt !== before) lap.mirrorN++;
  if (lap.lastDraw && !document.hidden) {         // 잇달아 그린 두 장 사이의 간격
    const gap = now - lap.lastDraw;
    if (gap < 250) { lap.gapSum += gap; lap.gapN++; lap.gapMax = Math.max(lap.gapMax, gap); }
  }
  lap.lastDraw = now;
  info.calls = renderer.info.render.calls + mirrorCalls;
  info.triangles = renderer.info.render.triangles;
  drawn++;
}
// 지난번에 고른 것(역할 · 수업 코드 · 이름 · 캐릭터 · 강의실)을 기억해 두었다가 다시 채워 준다

  if (profile.role && profile.code) {           // 지난번처럼 한 번에 들어가기
    const who = profile.role === 'teacher' ? '선생님' : '학생';
    $('again').replaceChildren('지난번처럼 들어가기', Object.assign(document.createElement('small'), {
      textContent: `${profile.role === 'teacher' ? '선생님' : '학생'} · ${profile.code} · ${profile.name || who}`,
    }));
    $('again').hidden = false;
    $('again').addEventListener('click', () => {
      beginEntry(profile.role, { code: profile.code, create: profile.role === 'teacher' });
      nameDone();
      whoDone();
      enter();
    });
  }
}
if (!(SUPABASE_URL && SUPABASE_KEY)) $('netNote').textContent += ' 지금은 온라인 연결 전이라, 이 컴퓨터의 다른 탭끼리만 만나요.';

requestAnimationFrame(frame);

// 0.5초마다: 부하 표시 갱신 + 벽시계 분침 맞추기
setInterval(() => {
  const fps = drawn * 2;
  drawn = 0;
  perfFps = fps;
  const n = lap.n || 1;
  Object.assign(lapShown, {
    think: lap.think / n, mirror: lap.mirror / n, draw: lap.draw / n,
    gap: lap.gapN ? lap.gapSum / lap.gapN : 0, gapMax: lap.gapMax, mirrorHz: lap.mirrorN * 2,
    upN: lap.upN * 2, upPx: lap.upPx * 2,
  });
  lap.sumGap += lap.gapSum;
  lap.sumN += lap.gapN;
  if (++lap.tick % 2 === 0) {         // 1초마다 자동 해상도를 살핀다
    pixelThink(lap.sumN ? lap.sumGap / lap.sumN : 0, lap.sumGap);
    lap.sumGap = lap.sumN = 0;
  }
  lap.think = lap.mirror = lap.draw = lap.n = lap.gapSum = lap.gapN = lap.gapMax = lap.mirrorN = lap.upN = lap.upPx = 0;
  showPerf();
  tickAttendance();
  sweepPeers();
  showRoom();
  if (new Date().getMinutes() !== clockMinute) {
    clockMinute = drawClock(clockTex.image.getContext('2d'));
    clockTex.needsUpdate = true;
    dirty = true;
  }
}, 500);

// 개발자 도구(F12) 콘솔에서 classroom.player 처럼 들여다볼 수 있게 열어 둔다
window.classroom = {
  actors, seats, scene, renderer, attendance, findPath, advance, act, updateTarget, placeCamera,
  show, openFiles, gotoPage, startLive, endShow, showCanvas, notes, whispers, lasers, showText,
  cfg, cfgAt, setConfig: (kind, key) => setConfig(kind, key, true), askConfig: setConfig, back, ink, pen, inviteLink, teacherKey,
  get role() { return [role, creator, isTeacher]; }, strokes, inkAdd, FORMS, BOARD, spawn, nearestFree, playBgm, gotoArea, boardCam,
  get areas() { return [areas, areaAt, zoomX]; },
  get zoom() { return [zoomed, zoomAmt]; }, frame, zaps, zapAdd, liveTex, liveMesh, live, inkTex, showTex, startLive, endShow, inkClear, inkErase, get show() { return show; }, get lap() { return { ...lapShown, level: pixels.level, trial: !!pixels.trial, hold: Math.round(Math.max(0, pixels.hold - performance.now()) / 1000), mirrorMs, every: mirrorEvery() }; }, get mirror() { return { on: mirrorGlass.visible, pos: mirrorGlass.position.toArray(), calls: mirrorCalls, all: info.calls, fade: mirrorMat.uniforms.fade.value }; }, get mySkin() { return mySkin; }, peerSkins, actors, get follow() { return { on: follow.on, can: canFollow(), x: zoomX, to: follow.to, area: areaAt }; }, setZoom, get bgm() { return bgmNow; }, get audio() { return ac; },
  get room() { return { ROOM, HW, HD, floorAt, obstacles, blocked, cellH, NX, NZ }; },
  net: { peers, myId, tick: netTick, receive: netReceive, pace: netPace, openSupabase,
    get link() { return link; }, get state() { return linkState; }, get seatAt() { return mySeatAt; } },
  get player() { return player; },
  get mate() { return mate; },
  get target() { return target; },
  redraw() { dirty = true; },
};
</script>
