<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D 강의실</title>
<style>
  :root {
    --ink: #33241a;
    --paper: #fff6e3;
    --coral: #ff8257;
    --mint: #8fcdb0;
    --font: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #241c15; color: var(--ink); font-family: var(--font);
    -webkit-user-select: none; user-select: none;
  }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; outline: none; cursor: grab;
  }
  #view.drag { cursor: grabbing; }

  /* ── 입장 화면 ── */
  #entry {
    position: fixed; inset: 0; display: grid; align-items: center; justify-items: start;
    padding: 20px clamp(16px, 7vw, 110px);
    background: linear-gradient(90deg, rgba(36, 24, 14, .62), rgba(36, 24, 14, .08) 70%);
  }
  .card {
    width: min(372px, 100%); background: var(--paper);
    border: 3px solid var(--ink); box-shadow: 8px 8px 0 rgba(0, 0, 0, .38);
    padding: 22px 22px 18px;
  }
  .room-no {
    display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .14em;
    background: var(--mint); border: 2px solid var(--ink); padding: 3px 8px;
  }
  h1 { margin: 0; font-size: 24px; line-height: 1.1; letter-spacing: -.02em; }
  .note:empty { display: none; }
  .sub { margin: 0 0 14px; font-size: 14px; line-height: 1.55; opacity: .78; }
  /* 입장 순서: 한 항목을 정하면 다음 항목이 나타난다 */
  .step { margin-top: 14px; }
  .step:not([hidden]) { animation: stepIn .25s ease-out; }
  @keyframes stepIn { from { opacity: 0; transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .step:not([hidden]) { animation: none; } }
  .step > label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 800; }
  .line { display: flex; gap: 8px; }
  .mini {
    flex: none; padding: 0 16px; font: 800 14px var(--font); color: #fff; background: var(--ink);
    border: 3px solid var(--ink); border-radius: 0; cursor: pointer;
  }
  .line input[readonly] { background: #f3e9d2; }
  .fields input, .line input {
    display: block; width: 100%; padding: 8px 10px;
    font: inherit; font-size: 16px; font-weight: 700; color: var(--ink);
    background: #fff; border: 3px solid var(--ink); border-radius: 0;
    outline: none; -webkit-user-select: text; user-select: text;
  }
  .line input:focus { background: #f2fbf6; }
  .line input::placeholder { font-size: 13px; font-weight: 500; color: rgba(51, 36, 26, .45); }
  .note { margin: 8px 0 0; font-size: 12px; line-height: 1.5; opacity: .75; }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick button {
    display: flex; align-items: center; gap: 10px; padding: 10px;
    font: inherit; font-size: 16px; font-weight: 800; text-align: left; color: var(--ink);
    background: #fff; border: 3px solid var(--ink); border-radius: 0; cursor: pointer;
  }
  .pick i { flex: none; width: 24px; height: 24px; background: var(--c); border: 2px solid var(--ink); }
  .pick small { display: block; font-size: 11px; font-weight: 600; opacity: .7; }
  .pick button[aria-pressed="true"] {
    background: color-mix(in srgb, var(--c) 30%, #fff);
    box-shadow: 0 4px 0 var(--ink); transform: translateY(-2px);
  }
  .go {
    width: 100%; margin-top: 14px; font: inherit; font-size: 18px; font-weight: 800;
    padding: 12px; color: #fff; background: var(--coral);
    border: 3px solid var(--ink); border-radius: 0; box-shadow: 0 5px 0 var(--ink); cursor: pointer;
  }
  .go:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .keys {
    list-style: none; margin: 20px 0 0; padding: 14px 0 0;
    border-top: 2px dashed rgba(51, 36, 26, .3);
    display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; font-size: 12.5px;
  }
  kbd {
    display: inline-block; min-width: 21px; padding: 1px 5px; margin-right: 2px;
    font: 700 11px ui-monospace, Menlo, Consolas, monospace; text-align: center; color: var(--ink);
    background: #fff; border: 2px solid var(--ink); border-bottom-width: 3px;
  }

  /* ── 입장 후 화면 위 표시 ── */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .chip {
    position: absolute; background: rgba(255, 246, 227, .93);
    border: 2px solid var(--ink); padding: 6px 10px; font: 600 12px var(--font); color: var(--ink);
  }
  #perf { right: 12px; top: 12px; font: 600 11px ui-monospace, Menlo, Consolas, monospace; }
  #att { left: 12px; top: 12px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* 화면 가운데 십자선: 이것으로 바라본 물체에 테두리가 뜬다 */
  #hud > #aim {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px;
    pointer-events: none; filter: drop-shadow(0 0 1px rgba(30, 20, 12, .95));
  }
  #aim::before, #aim::after { content: ""; position: absolute; background: #fff; }
  #aim::before { left: 7px; top: 0; width: 2px; height: 16px; }
  #aim::after { left: 0; top: 7px; width: 16px; height: 2px; }

  #room { left: 12px; top: 48px; cursor: pointer; border-radius: 0; }
  #toast {
    left: 50%; top: 18%; transform: translateX(-50%); max-width: min(560px, 90vw); text-align: center; line-height: 1.5;
    font-size: 14px; font-weight: 800; background: var(--paper); box-shadow: 0 4px 0 var(--ink);
  }

  /* ── 퇴장 확인창 ── */
  #exit {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(36, 24, 14, .55);
  }
  #exit h2 { margin: 0 0 8px; font-size: 24px; letter-spacing: -.02em; }
  #exit p { margin: 0; font-size: 14px; line-height: 1.6; }
  #exit b { font-variant-numeric: tabular-nums; }

  /* ── 선생님: 입장 화면의 체크 칸, 큰 스크린을 조작하는 리모컨 ── */
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--coral); }
  #remoteBtn { left: 12px; top: 84px; cursor: pointer; border-radius: 0; box-shadow: 0 3px 0 var(--ink); }
  #remote {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 136px;
    display: grid; gap: 8px; padding: 14px 12px 20px; background: #2b2e36;
    border: 3px solid #14161b; border-radius: 22px; box-shadow: 0 6px 0 rgba(0, 0, 0, .35);
  }
  #remoteLed {
    padding: 5px 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font: 700 12px ui-monospace, Menlo, Consolas, monospace; color: #9dffb0;
    background: #10231a; border: 2px solid #14161b; border-radius: 6px;
  }
  #remote button {
    padding: 8px 4px; font: 800 13px var(--font); color: #fff; background: #4a4f5c;
    border: 2px solid #14161b; border-radius: 10px; box-shadow: 0 3px 0 #14161b; cursor: pointer;
  }
  #remote button:active { transform: translateY(2px); box-shadow: 0 1px 0 #14161b; }
  #remote button:disabled { opacity: .4; cursor: default; }
  #remote .power { background: #e0503c; }
  #remote #laserBtn[aria-pressed="true"] { color: #2b0906; background: #ff6b5e; box-shadow: 0 3px 0 #14161b, 0 0 12px #ff3b30; }
  #remote .arrows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #remote .arrows button { padding: 0; font-size: 18px; border-radius: 50%; aspect-ratio: 1; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .row .go { font-size: 16px; }
  .go.ghost { color: var(--ink); background: #fff; }
  .go:focus-visible, .pick button:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  #help {
    left: 50%; bottom: 14px; transform: translateX(-50%);
    max-width: calc(100% - 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #acts { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); display: flex; gap: 8px; }
  #acts button {
    font: 800 16px var(--font); color: var(--ink); background: var(--paper);
    padding: 10px 16px; border: 3px solid var(--ink); border-radius: 0;
    box-shadow: 0 4px 0 var(--ink); cursor: pointer; white-space: nowrap;
  }
  #acts #act { color: #fff; background: var(--coral); }
  #acts button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  #acts kbd { margin-right: 8px; }

  /* ── 질문 입력 칸 · 소곤거리기 창 ── */
  #ask, #say { left: 50%; bottom: 116px; transform: translateX(-50%); padding: 6px; }
  #say input { width: min(420px, 82vw); }
  #ask input, #say input, #whisper input {
    width: 100%; font: 600 14px var(--font); color: var(--ink); padding: 7px 9px;
    background: #fff; border: 2px solid var(--ink); border-radius: 0; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  #ask input { width: min(340px, 78vw); }
  #whisper { right: 12px; bottom: 58px; width: 250px; padding: 8px; }
  #whisperHead { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  #whisperHead button { font: 800 14px var(--font); color: var(--ink); background: none; border: 0; cursor: pointer; }
  #whisperLog { max-height: 140px; overflow-y: auto; margin: 6px 0; display: grid; gap: 4px; font-size: 13px; }
  #whisperLog div { justify-self: start; max-width: 90%; padding: 3px 7px; background: #fff; border: 2px solid var(--ink); overflow-wrap: anywhere; }
  #whisperLog div.me { justify-self: end; background: #ffe9b8; }
  #stick, #jump { display: none; position: absolute; bottom: 26px; touch-action: none; }
  #stick {
    left: 26px; width: 124px; height: 124px; border-radius: 50%;
    background: rgba(255, 246, 227, .35); border: 3px solid rgba(51, 36, 26, .7);
  }
  #stick i {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px;
    border-radius: 50%; background: var(--paper); border: 3px solid var(--ink);
  }
  #jump {
    right: 26px; width: 84px; height: 84px; border-radius: 50%;
    font: 800 15px var(--font); color: var(--ink);
    background: rgba(255, 246, 227, .85); border: 3px solid var(--ink);
  }
  .keys.touch { display: none; }
  @media (max-width: 640px) {
    #perf { top: 120px; left: 12px; right: auto; }   /* 좁은 화면에서는 출석·수업·리모컨 표시 아래로 */
  }
  @media (pointer: coarse) {
    .keys { display: none; }
    .keys.touch { display: grid; }
    #help, #acts kbd { display: none; }
    #acts { bottom: 170px; }
    #ask { bottom: 228px; }
    #whisper { bottom: 228px; }
    #stick, #jump { display: block; }
  }

  #fail {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
    text-align: center; font-size: 16px; line-height: 1.7; color: #fff6e3; background: #241c15;
  }
</style>
</head>
<body>

<canvas id="view" tabindex="0"></canvas>

<div id="entry">
  <form class="card" id="enterForm">
    <h1>3D 강의실</h1>
    <section class="step" id="stepCode">
      <label for="code">1. 수업 코드</label>
      <div class="line">
        <input id="code" maxlength="20" placeholder="예: 수학1반" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="codeNext" class="mini" type="button">다음</button>
      </div>
      <p class="note" id="netNote"></p>
    </section>
    <section class="step" id="stepWho" hidden>
    <label>2. 캐릭터</label>
    <div class="pick" role="group" aria-label="캐릭터 고르기">
      <button type="button" data-who="roy" style="--c:#5fc46b" aria-pressed="true"><i></i><span>로이<small>초록 옷</small><small id="rec-roy">출석 00:00:00</small></span></button>
      <button type="button" data-who="stella" style="--c:#ff9cc2" aria-pressed="false"><i></i><span>스텔라<small>분홍 옷</small><small id="rec-stella">출석 00:00:00</small></span></button>
    </div>
    </section>
    <section class="step" id="stepName" hidden>
      <label for="nick">3. 이름</label>
      <div class="line">
        <input id="nick" maxlength="12" autocomplete="off" spellcheck="false">
        <button id="nameNext" class="mini" type="button">다음</button>
      </div>
    </section>
    <section class="step" id="stepRole" hidden>
      <label>4. 역할</label>
      <div class="pick" role="group" aria-label="역할 고르기">
        <button type="button" data-role="student" aria-pressed="false"><span>학생<small>자리에 앉아 수업 듣기</small></span></button>
        <button type="button" data-role="teacher" aria-pressed="false"><span>선생님<small>리모컨으로 스크린 조작</small></span></button>
      </div>
      <input type="checkbox" id="teacher" hidden>
    </section>
    <section class="step" id="stepGo" hidden>
    <button class="go" type="submit">입장하기</button>
    </section>
  </form>
</div>

<div id="hud" hidden>
  <div id="aim"></div>
  <div id="att" class="chip" title="강의실에 있는 동안 쌓이는 출석 시간">출석 00:00:00</div>
  <button id="room" class="chip" type="button" title="수업 코드가 든 초대 링크를 복사해요" hidden></button>
  <div id="perf" class="chip" title="화면이 멈춰 있으면 그리기를 쉬어서 컴퓨터 부담을 줄여요">준비 중</div>
  <div id="toast" class="chip" hidden></div>
  <button id="remoteBtn" class="chip" type="button" hidden>리모컨 <kbd>R</kbd></button>
  <div id="remote" hidden>
    <div id="remoteLed">꺼짐</div>
    <button id="stopBtn" class="power" type="button" title="큰 스크린 끄기">⏻ 끄기</button>
    <button id="textBtn" type="button" title="적은 문구를 스크린 한가운데에 띄우기">문구 띄우기</button>
    <button id="fileBtn" type="button" title="PDF · 이미지 파일을 스크린에 띄우기">자료 열기</button>
    <button id="shareBtn" type="button" title="내 화면을 스크린에 띄우기">화면 공유</button>
    <button id="laserBtn" type="button" aria-pressed="false" title="스크린을 바라보면 빨간 점이 찍혀요 (F)">레이저</button>
    <button id="themeBtn" type="button" title="강의실 모습 바꾸기: 교실 → 강의실 → 강연장 → 공연장">테마</button>
    <div class="arrows">
      <button id="prevBtn" type="button" title="이전 장 (Q)">◀</button>
      <button id="nextBtn" type="button" title="다음 장 (E)">▶</button>
    </div>
    <input id="file" type="file" accept=".pdf,application/pdf,image/*,.ppt,.pptx" multiple hidden>
  </div>
  <div id="acts">
    <button id="askBtn" type="button" hidden><kbd>Q</kbd>질문</button>
    <button id="okBtn" type="button" hidden><kbd>E</kbd>이해했어요</button>
    <button id="act" type="button" hidden><kbd>X</kbd><span id="actText">앉기</span></button>
  </div>
  <form id="ask" class="chip" hidden>
    <input id="askText" maxlength="60" placeholder="질문을 적고 Enter (Esc 취소)" autocomplete="off" spellcheck="false">
  </form>
  <form id="say" class="chip" hidden>
    <input id="sayText" maxlength="80" placeholder="스크린에 띄울 문구를 적고 Enter (Esc 취소)" autocomplete="off" spellcheck="false">
  </form>
  <div id="whisper" class="chip" hidden>
    <div id="whisperHead"><b id="whisperName"></b><button id="whisperClose" type="button" aria-label="닫기">×</button></div>
    <div id="whisperLog"></div>
    <form id="whisperForm">
      <input id="whisperText" maxlength="60" placeholder="소곤소곤… Enter로 쪽지 보내기" autocomplete="off" spellcheck="false">
    </form>
  </div>
  <div id="help" class="chip">WASD·방향키 이동 · 드래그 둘러보기 · 책상을 바라보고 X 앉기 · 문으로 가면 나가기</div>
  <div id="stick"><i></i></div>
  <button id="jump" type="button">점프</button>
</div>

<div id="exit" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
    <h2 id="exitTitle">강의실에서 나갈까요?</h2>
    <p>지금까지 출석한 시간 <b id="exitTime">00:00:00</b> 은 그대로 남아요.<br>나가면 그 뒤로는 시간이 더 쌓이지 않아요.</p>
    <div class="row">
      <button id="stayBtn" class="go ghost" type="button">계속 있기</button>
      <button id="leaveBtn" class="go" type="button">나가기</button>
    </div>
  </div>
</div>

<div id="fail" hidden></div>

<script type="module">
/* ════════════════════════════════════════════════════════════════
   3D 강의실  —  파일 하나로 돌아가는 가벼운 three.js 장면

   부하를 줄이는 방법 (이 파일 전체에 적용되어 있어요)
   1. 책상·의자처럼 반복되는 물체는 InstancedMesh 로 한 번에 그린다
   2. 텍스처는 그림 파일 없이 작은 캔버스(16~128px)에 코드로 그린다
   3. 실시간 그림자 대신 바닥에 깔린 반투명 "가짜 그림자"를 쓴다
   4. 움직임이 없으면 화면을 다시 그리지 않는다 (렌더 온 디맨드)
   5. 고해상도 화면에서도 픽셀 배율을 1.5배까지만 쓴다
   6. 충돌·길찾기는 3D 엔진 없이 간단한 계산으로 처리한다
   ════════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);

function fail(message) {
  $('entry').hidden = true;
  $('hud').hidden = true;
  $('fail').textContent = message;
  $('fail').hidden = false;
}

let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js');
} catch (err) {
  fail('3D 엔진(three.js)을 내려받지 못했어요. 인터넷 연결을 확인한 뒤 새로고침 해 주세요.');
  throw err;
}

/* ───────────── 설정: 여기 값만 바꿔도 강의실이 달라져요 ───────────── */
const ROOM = { w: 12, d: 16, h: 4.6 };                    // 가로(x) · 깊이(z) · 높이(y)
const DESK_COLS = [-4.0, -2.95, -1.9, 1.9, 2.95, 4.0];    // 책상 열의 x 위치 (가운데는 통로)
const DESK_ROWS = [-3.4, -1.6, 0.2, 2.0];                 // 책상 줄의 z 위치 (앞 → 뒤)
const CHARACTERS = {                                      // 캐릭터 옷·머리 색
  roy: {
    name: '로이', hood: '#5fc46b', hoodDark: '#3f9f52', pants: '#44568a',
    hair: '#5a3a2a', hairLight: '#7b5340', longHair: false, pin: false,
  },
  stella: {
    name: '스텔라', hood: '#ff9cc2', hoodDark: '#e9749f', pants: '#7c6bb0',
    hair: '#4b2e39', hairLight: '#6d4656', longHair: true, pin: true,
  },
};
const DOOR = { z: 5.7, w: 1.3, h: 2.3 };                  // 나가는 문 (오른쪽 벽)
const WALK = 2.4, RUN = 4.4, JUMP = 3.7, GRAVITY = 12;    // 걷기·달리기 속도, 점프 세기, 중력

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const TAU = Math.PI * 2;
const wrap = (a) => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;   // 각도를 -180°~180° 로 맞춘다
const FRONT = Math.PI;             // 스크린 쪽을 바라보는 방향 (0 = 뒤쪽 벽)

// 항상 같은 무늬가 나오도록 하는 간단한 난수
function rng(seed) {
  return () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}

// 캔버스에 그림을 그려 텍스처로 만든다. 기본은 "픽셀이 또렷한" 도트 스타일
function makeTex(w, h, draw, { smooth = false, repeat = false } = {}) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (!smooth) t.magFilter = THREE.NearestFilter;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// 움직이지 않는 물체: 위치 계산을 한 번만 하고 고정
function addStatic(mesh) {
  mesh.updateMatrix();
  mesh.matrixAutoUpdate = false;
  scene.add(mesh);
  return mesh;
}

// 같은 모양 여러 개를 한 번의 그리기 호출로 처리 (InstancedMesh)
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler();
const _p = new THREE.Vector3(), _s = new THREE.Vector3();
function instanced(geo, mat, list) {
  const mesh = new THREE.InstancedMesh(geo, mat, list.length);
  list.forEach((it, i) => {
    _e.set(...(it.r || [0, 0, 0]));
    _m.compose(_p.set(...it.p), _q.setFromEuler(_e), _s.set(...(it.s || [1, 1, 1])));
    mesh.setMatrixAt(i, _m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  return addStatic(mesh);
}

// 아틀라스(여러 그림을 모은 한 장)에서 원하는 칸을 면에 입힌다
function setFaceUV(geo, face, [x, y, w, h], size = 64) {
  const uv = geo.attributes.uv, e = 0.02;
  const u0 = (x + e) / size, u1 = (x + w - e) / size;
  const v0 = 1 - (y + h - e) / size, v1 = 1 - (y + e) / size;
  for (let i = 0; i < 4; i++) {
    const k = face * 4 + i;
    uv.setXY(k, uv.getX(k) > 0.5 ? u1 : u0, uv.getY(k) > 0.5 ? v1 : v0);
  }
}
function atlasBox(w, h, d, faces) {
  const geo = new THREE.BoxGeometry(w, h, d);
  ['px', 'nx', 'py', 'ny', 'pz', 'nz'].forEach((name, f) => setFaceUV(geo, f, faces[name] || faces.all));
  return geo;
}

function drawClock(g) {
  g.clearRect(0, 0, 64, 64);
  g.fillStyle = '#33241a';
  g.beginPath(); g.arc(32, 32, 31, 0, 7); g.fill();
  g.fillStyle = '#fffdf5';
  g.beginPath(); g.arc(32, 32, 26, 0, 7); g.fill();
  g.fillStyle = '#33241a';
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    g.fillRect(32 + Math.sin(a) * 21 - 1.5, 32 - Math.cos(a) * 21 - 1.5, 3, 3);
  }
  const now = new Date(), min = now.getMinutes(), hour = (now.getHours() % 12) + min / 60;
  const hand = (a, len, width) => {
    g.strokeStyle = '#33241a'; g.lineWidth = width; g.lineCap = 'round';
    g.beginPath(); g.moveTo(32, 32); g.lineTo(32 + Math.sin(a) * len, 32 - Math.cos(a) * len); g.stroke();
  };
  hand(hour * Math.PI / 6, 12, 4);
  hand(min * Math.PI / 30, 19, 3);
  g.fillStyle = '#ff8257';
  g.beginPath(); g.arc(32, 32, 3, 0, 7); g.fill();
  return min;
}

/* ───────────── 충돌: 벽 + 책상·의자·교탁 ───────────── */
const BODY_R = 0.2, WALL_PAD = 0.36;
function collide(p) {
  for (const o of obstacles) {
    const cx = clamp(p.x, o.x0, o.x1), cz = clamp(p.z, o.z0, o.z1);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= BODY_R * BODY_R) continue;
    if (d2 > 1e-8) {                 // 모서리·옆면에 닿음 → 닿은 방향으로 밀어낸다
      const d = Math.sqrt(d2);
      p.x = cx + dx / d * BODY_R;
      p.z = cz + dz / d * BODY_R;
    } else {                         // 완전히 안에 들어옴 → 가장 가까운 면으로 내보낸다
      const l = p.x - o.x0, r = o.x1 - p.x, f = p.z - o.z0, b = o.z1 - p.z, m = Math.min(l, r, f, b);
      if (m === l) p.x = o.x0 - BODY_R;
      else if (m === r) p.x = o.x1 + BODY_R;
      else if (m === f) p.z = o.z0 - BODY_R;
      else p.z = o.z1 + BODY_R;
    }
  }
  p.x = clamp(p.x, -HW + WALL_PAD, HW - WALL_PAD);
  p.z = clamp(p.z, -HD + WALL_PAD, HD - WALL_PAD);
}

/* ───────────── 길찾기: 바닥을 10cm 칸으로 나눠 책상을 피해 가는 길을 찾는다 (A*) ───────────── */
const CELL = 0.1, NAV_R = 0.22;
const NX = Math.round(ROOM.w / CELL), NZ = Math.round(ROOM.d / CELL), NCELL = NX * NZ;
const blocked = new Uint8Array(NCELL);       // 1 = 지나갈 수 없는 칸
const cellX = (i) => -HW + (i % NX + 0.5) * CELL;
const cellZ = (i) => -HD + ((i / NX | 0) + 0.5) * CELL;
const cellAt = (x, z) =>
  clamp(Math.floor((z + HD) / CELL), 0, NZ - 1) * NX + clamp(Math.floor((x + HW) / CELL), 0, NX - 1);
function buildNav() {                // 장애물이 바뀌면(테마에 따라 책상이 생기거나 없어지면) 다시 만든다
  blocked.fill(0);
  for (let i = 0; i < NCELL; i++) {
    const x = cellX(i), z = cellZ(i);
    if (Math.abs(x) > HW - WALL_PAD || Math.abs(z) > HD - WALL_PAD) { blocked[i] = 1; continue; }
    for (const o of obstacles) {
      const dx = x - clamp(x, o.x0, o.x1), dz = z - clamp(z, o.z0, o.z1);
      if (dx * dx + dz * dz < NAV_R * NAV_R) { blocked[i] = 1; break; }
    }
  }
}

function carpetTex(base, dark, light) {
  const tex = makeTex(32, 32, (g) => {
    const r = rng(31);
    g.fillStyle = base;
    g.fillRect(0, 0, 32, 32);
    for (let i = 0; i < 170; i++) {
      g.fillStyle = r() < 0.5 ? dark : light;
      g.fillRect(r() * 32 | 0, r() * 32 | 0, 1, 1);
    }
  }, { repeat: true });
  tex.repeat.set(ROOM.w, ROOM.d);
  tex.anisotropy = floorTex.anisotropy;
  return tex;
}
function wallTexOf(top, band, groove, shine, trim, base) {
  return makeTex(64, 128, (g) => {
    const r = rng(5);
    g.fillStyle = top;
    g.fillRect(0, 0, 64, 96);
    g.fillStyle = 'rgba(0, 0, 0, .06)';
    for (let i = 0; i < 70; i++) g.fillRect(r() * 64 | 0, r() * 92 | 0, 1, 1);
    g.fillStyle = trim;
    g.fillRect(0, 94, 64, 4);
    g.fillStyle = band;
    g.fillRect(0, 98, 64, 24);
    g.fillStyle = groove;
    for (let x = 0; x < 64; x += 16) g.fillRect(x, 98, 1, 24);
    g.fillStyle = shine;
    for (let x = 1; x < 64; x += 16) g.fillRect(x, 98, 1, 24);
    g.fillStyle = base;
    g.fillRect(0, 122, 64, 6);
  }, { repeat: true });
}

// 막힌 칸을 골랐을 때 가장 가까운 빈 칸으로 바꿔 준다
function nearestFree(x, z) {
  const c = cellAt(x, z);
  if (!blocked[c]) return c;
  const cx = c % NX, cz = c / NX | 0;
  for (let r = 1; r <= 14; r++) {
    let best = -1, bestD = Infinity;
    for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dz)) !== r) continue;
      const nx = cx + dx, nz = cz + dz;
      if (nx < 0 || nz < 0 || nx >= NX || nz >= NZ || blocked[nz * NX + nx]) continue;
      const d = dx * dx + dz * dz;
      if (d < bestD) { bestD = d; best = nz * NX + nx; }
    }
    if (best >= 0) return best;
  }
  return -1;
}

// 두 점 사이를 똑바로 걸어갈 수 있는지
function clearLine(ax, az, bx, bz) {
  const n = Math.ceil(Math.hypot(bx - ax, bz - az) / 0.04);
  for (let i = 1; i <= n; i++) {
    const t = i / n;
    if (blocked[cellAt(ax + (bx - ax) * t, az + (bz - az) * t)]) return false;
  }
  return true;
}

const gScore = new Float32Array(NCELL), cameFrom = new Int32Array(NCELL), closed = new Uint8Array(NCELL);
const heapN = [], heapF = [];        // 다음에 살펴볼 칸들 (가까운 순서로 꺼내는 힙)
function heapPush(n, f) {
  let c = heapN.length;
  heapN.push(n); heapF.push(f);
  while (c > 0) {
    const p = (c - 1) >> 1;
    if (heapF[p] <= heapF[c]) break;
    [heapN[p], heapN[c]] = [heapN[c], heapN[p]];
    [heapF[p], heapF[c]] = [heapF[c], heapF[p]];
    c = p;
  }
}
function heapPop() {
  const top = heapN[0], n = heapN.pop(), f = heapF.pop();
  if (heapN.length) {
    heapN[0] = n; heapF[0] = f;
    let p = 0;
    for (;;) {
      const l = p * 2 + 1, r = l + 1;
      let m = p;
      if (l < heapN.length && heapF[l] < heapF[m]) m = l;
      if (r < heapN.length && heapF[r] < heapF[m]) m = r;
      if (m === p) break;
      [heapN[p], heapN[m]] = [heapN[m], heapN[p]];
      [heapF[p], heapF[m]] = [heapF[m], heapF[p]];
      p = m;
    }
  }
  return top;
}
const NB_X = [1, -1, 0, 0, 1, 1, -1, -1], NB_Z = [0, 0, 1, -1, 1, -1, 1, -1];

// (sx,sz) → (tx,tz) 로 가는 길을 점 목록으로 돌려준다. 길이 없으면 null
function findPath(sx, sz, tx, tz) {
  const start = nearestFree(sx, sz), goal = nearestFree(tx, tz);
  if (start < 0 || goal < 0) return null;
  const gx = goal % NX, gz = goal / NX | 0;
  const guess = (i) => {
    const dx = Math.abs(i % NX - gx), dz = Math.abs((i / NX | 0) - gz);
    return Math.max(dx, dz) + 0.4142 * Math.min(dx, dz);
  };
  gScore.fill(Infinity);
  closed.fill(0);
  heapN.length = heapF.length = 0;
  gScore[start] = 0;
  heapPush(start, guess(start));
  while (heapN.length) {
    const cur = heapPop();
    if (cur === goal) break;
    if (closed[cur]) continue;
    closed[cur] = 1;
    const cx = cur % NX, cz = cur / NX | 0;
    for (let k = 0; k < 8; k++) {
      const nx = cx + NB_X[k], nz = cz + NB_Z[k];
      if (nx < 0 || nz < 0 || nx >= NX || nz >= NZ) continue;
      const n = nz * NX + nx;
      if (blocked[n] || closed[n]) continue;
      if (k >= 4 && (blocked[cz * NX + nx] || blocked[nz * NX + cx])) continue;   // 모서리를 비스듬히 스치지 않기
      const g = gScore[cur] + (k >= 4 ? 1.4142 : 1);
      if (g < gScore[n]) {
        gScore[n] = g;
        cameFrom[n] = cur;
        heapPush(n, g + guess(n));
      }
    }
  }
  if (gScore[goal] === Infinity) return null;

  const pts = [];
  for (let c = goal; c !== start; c = cameFrom[c]) pts.push({ x: cellX(c), z: cellZ(c) });
  pts.push({ x: cellX(start), z: cellZ(start) });
  pts.reverse();
  if (cellAt(tx, tz) === goal) pts[pts.length - 1] = { x: tx, z: tz };

  // 계단 모양 길을 곧게 편다: 똑바로 갈 수 있는 가장 먼 점만 남긴다
  const out = [];
  let ax = sx, az = sz, i = 0;
  while (i < pts.length) {
    let j = i;
    while (j + 1 < pts.length && clearLine(ax, az, pts[j + 1].x, pts[j + 1].z)) j++;
    out.push(pts[j]);
    ax = pts[j].x;
    az = pts[j].z;
    i = j + 1;
  }
  out.cost = gScore[goal];
  return out;
}

/* ───────────── 아바타 (2등신 블록 캐릭터) ───────────── */
const AV = { leg: 0.26, body: 0.34, head: 0.64 };
const EYE_H = AV.leg + AV.body + AV.head / 2;   // 눈높이 = 머리 한가운데
const EYE_FWD = 0.1;                            // 1인칭 카메라를 얼굴 쪽으로 살짝 내민다
const SEAT_RISE = 0.15;                         // 앉으면 엉덩이가 의자 높이까지 올라간다
const HEAD_TURN = 1.3;                          // 몸통 기준으로 고개가 돌아가는 한계 (약 75°)
const SEAT_LOOK = 2.9;                          // 앉아서 둘러볼 수 있는 범위 (뒷자리 친구까지 돌아볼 수 있게 약 165°)

function buildAvatar(look, name) {
  // 같은 옷을 입은 캐릭터끼리는 그림 한 장을 함께 쓴다
  const mat = look.mat || (look.mat = new THREE.MeshLambertMaterial({ map: makeAvatarTex(look), alphaTest: 0.5 }));
  const root = new THREE.Group();     // 위치·몸 방향
  const rig = new THREE.Group();      // 걸을 때 통통, 앉을 때 위로
  root.add(rig);
  const part = (geo, x, y, z) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    rig.add(m);
    return m;
  };

  // 머리가 몸 전체 키의 절반 → 2등신. 목을 축으로 끄덕이도록 도형을 위로 올려 둔다
  const headGeo = atlasBox(AV.head, AV.head, AV.head, {
    pz: [0, 0, 16, 16], nz: [16, 0, 16, 16], px: [32, 0, 16, 16], nx: [48, 0, 16, 16],
    py: [0, 16, 16, 16], ny: [16, 16, 16, 16],
  });
  headGeo.translate(0, AV.head / 2, 0);
  const head = part(headGeo, 0, AV.leg + AV.body, 0);
  head.rotation.order = 'YXZ';        // 좌우로 돌린 다음 위아래로 끄덕인다

  part(atlasBox(0.36, AV.body, 0.22, {
    pz: [32, 16, 10, 10], nz: [42, 16, 10, 10], px: [52, 16, 6, 10], nx: [52, 16, 6, 10],
    py: [58, 16, 4, 4], ny: [58, 16, 4, 4],
  }), 0, AV.leg + AV.body / 2, 0);

  // 팔·다리는 위쪽 끝(어깨·골반)을 축으로 흔들리도록 도형을 아래로 내려 둔다
  const armGeo = atlasBox(0.12, 0.28, 0.14, { all: [32, 28, 4, 10], py: [36, 28, 4, 4], ny: [40, 28, 4, 4] });
  armGeo.translate(0, -0.12, 0);
  const legGeo = atlasBox(0.16, AV.leg, 0.18, { all: [32, 40, 5, 8], py: [37, 40, 4, 4], ny: [41, 40, 4, 4] });
  legGeo.translate(0, -AV.leg / 2, 0);
  const shoulder = AV.leg + AV.body - 0.04;
  const armL = part(armGeo, 0.24, shoulder, 0), armR = part(armGeo, -0.24, shoulder, 0);
  const legL = part(legGeo, 0.09, AV.leg, 0), legR = part(legGeo, -0.09, AV.leg, 0);
  legL.rotation.order = legR.rotation.order = 'YXZ';   // 앉을 때 다리를 앞으로 뻗고 살짝 벌린다

  // 눈 깜빡임용 덮개 (평소엔 숨김)
  const lidGeo = new THREE.PlaneGeometry(AV.head, AV.head);
  setFaceUV(lidGeo, 0, [0, 32, 16, 16]);
  const lids = new THREE.Mesh(lidGeo, mat);
  lids.position.set(0, AV.head / 2, AV.head / 2 + 0.003);
  lids.visible = false;
  head.add(lids);

  // 머리 위 이름표
  const tag = new THREE.Sprite(new THREE.SpriteMaterial({
    depthWrite: false,
    map: makeTex(256, 64, (g) => {
      g.font = `800 30px ${UI_FONT}`;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      const w = Math.min(244, g.measureText(name).width + 40);
      g.fillStyle = 'rgba(51, 36, 26, .82)';
      g.fillRect(128 - w / 2, 10, w, 44);
      g.fillStyle = '#fff6e3';
      g.fillText(name, 128, 33, 220);
    }, { smooth: true }),
  }));
  tag.scale.set(1.0, 0.25, 1);
  root.add(tag);

  const blob = new THREE.Mesh(quad, shadowMat);     // 발밑 그림자
  blob.rotation.x = -Math.PI / 2;
  blob.position.y = 0.014;

  scene.add(root, blob);
  // 나간 사람의 캐릭터를 치울 때 쓴다
  const dispose = () => {
    scene.remove(root, blob);
    rig.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
    tag.material.map.dispose();
    tag.material.dispose();
  };
  return { root, rig, head, armL, armR, legL, legR, lids, tag, blob, dispose };
}

/* ───────────── 캐릭터 한 명의 움직임 (나 · 친구가 같은 규칙을 쓴다) ─────────────
   mode:  free      자유롭게 서 있거나 걷는 중
          path      앉을 자리까지 찾아 둔 길을 따라 걷는 중
          sitting   의자에 앉는 동작 중
          seated    앉아 있음
          standing  일어나는 동작 중                                                */
class Actor {
  constructor(look, name = look.name) {
    this.name = name;
    this.model = buildAvatar(look, name);
    this.pos = new THREE.Vector3();
    this.vel = { x: 0, z: 0 };
    this.vy = 0;
    this.bodyYaw = 0;                 // 몸이 향하는 방향
    this.lookYaw = 0;                 // 시선 방향 (고개는 이쪽을 본다)
    this.lookPitch = 0;               // 시선 높낮이 (+ 가 아래)
    this.mode = 'free';
    this.input = { x: 0, z: 0, jump: false };   // 직접 조종할 때 가고 싶은 속도
    this.path = null;
    this.pathAt = 0;
    this.seat = null;
    this.exit = null;                 // 일어설 때 돌아갈 지점
    this.t = 0;                       // 앉기·일어서기 진행도 0~1
    this.yawFrom = 0;
    this.walkPhase = 0;
    this.walkAmt = 0; this.airAmt = 0; this.sitAmt = 0; this.wave = 0;
    this.isSelf = false;              // 내가 조종하는 캐릭터인지 (1인칭이라 내 머리는 숨긴다)
    this.reachAmt = 0; this.reachSide = 0; this.reachFwd = 0;   // 쪽지를 주고받을 때 팔을 뻗는 정도와 방향
    this.bubble = null;               // 머리 위 말풍선 (질문 · 반응)
    this.bubbleUntil = 0;
    this.nextBlink = performance.now() + 1500 + Math.random() * 2500;
    this.blinkEnd = 0;
  }

  place(x, z, yaw) {
    this.pos.set(x, 0, z);
    this.bodyYaw = this.lookYaw = yaw;
    this.applyPose();
  }

  // 하던 일을 모두 멈추고 처음 자리에 다시 세운다 (강의실에서 나갔을 때)
  reset(x, z) {
    this.leaveSeat();
    this.mode = 'free';
    this.path = this.exit = null;
    this.vel.x = this.vel.z = this.vy = 0;
    this.input.x = this.input.z = 0;
    this.input.jump = false;
    this.walkPhase = this.walkAmt = this.airAmt = this.sitAmt = this.lookPitch = 0;
    this.place(x, z, 0);
  }

  setSelf(on) {
    this.isSelf = on;
    this.model.head.visible = !on;
    this.model.tag.visible = !on;
  }

  // 자리까지 걸어가서 앉기
  goSit(seat) {
    if (this.mode !== 'free' && this.mode !== 'path') return false;
    if (seat.taken && seat.taken !== this) return false;
    let best = null, bestSide = null;
    for (const side of seat.sides) {       // 의자 왼쪽·오른쪽 중 더 가까운 쪽으로 들어간다
      const path = findPath(this.pos.x, this.pos.z, side.x, side.z);
      if (path && (!best || path.cost < best.cost)) { best = path; bestSide = side; }
    }
    if (!best) return false;
    this.cancel();
    this.path = best;
    this.pathAt = 0;
    this.mode = 'path';
    this.seat = seat;
    this.exit = bestSide;
    seat.taken = this;
    return true;
  }

  // 걷던 길 그만두기
  cancel() {
    if (this.mode !== 'path') return;
    this.mode = 'free';
    this.path = null;
    this.leaveSeat();
  }

  // 자리 비우기 (그새 다른 사람 차지가 된 자리라면 표시는 건드리지 않는다)
  leaveSeat() {
    if (this.seat && this.seat.taken === this) this.seat.taken = null;
    this.seat = null;
  }

  stand() {
    if (this.mode !== 'seated') return false;
    this.mode = 'standing';
    this.t = 0;
    return true;
  }

  arrive() {
    this.vel.x = this.vel.z = 0;
    this.path = null;
    if (this.seat) {
      this.mode = 'sitting';
      this.t = 0;
      this.yawFrom = this.bodyYaw;
      this.exit = { x: this.pos.x, z: this.pos.z };
    } else {
      this.mode = 'free';
    }
  }

  // 한 프레임 진행. 화면을 다시 그려야 하면 true
  update(dt) {
    let active = false;
    const yaw0 = this.bodyYaw;

    if (this.mode === 'path') {
      active = true;
      let left = WALK * dt;
      while (left > 0 && this.mode === 'path') {
        const wp = this.path[this.pathAt];
        if (!wp) { this.arrive(); break; }
        const dx = wp.x - this.pos.x, dz = wp.z - this.pos.z, d = Math.hypot(dx, dz);
        if (d <= left) {
          this.pos.x = wp.x;
          this.pos.z = wp.z;
          left -= d;
          this.pathAt++;
        } else {
          this.vel.x = dx / d * WALK;
          this.vel.z = dz / d * WALK;
          this.pos.x += dx / d * left;
          this.pos.z += dz / d * left;
          left = 0;
        }
      }
    } else if (this.mode === 'free') {
      const ease = 1 - Math.exp(-14 * dt);
      this.vel.x += (this.input.x - this.vel.x) * ease;
      this.vel.z += (this.input.z - this.vel.z) * ease;
      if (this.input.x === 0 && this.input.z === 0 && Math.hypot(this.vel.x, this.vel.z) < 0.03) {
        this.vel.x = this.vel.z = 0;
      }
      if (this.vel.x !== 0 || this.vel.z !== 0) {
        this.pos.x += this.vel.x * dt;
        this.pos.z += this.vel.z * dt;
        collide(this.pos);
        active = true;
      }
    } else if (this.mode === 'sitting' || this.mode === 'standing') {
      active = true;
      this.t = Math.min(1, this.t + dt / 0.42);
      const k = this.t * this.t * (3 - 2 * this.t);               // 부드럽게 시작하고 끝나는 곡선
      const a = this.mode === 'sitting' ? k : 1 - k;              // 0 = 서 있음, 1 = 앉음
      this.pos.x = this.exit.x + (this.seat.sit.x - this.exit.x) * a;
      this.pos.z = this.exit.z + (this.seat.sit.z - this.exit.z) * a;
      this.sitAmt = a;
      if (this.mode === 'sitting') this.bodyYaw = this.yawFrom + wrap(FRONT - this.yawFrom) * k;
      if (this.t >= 1) {
        if (this.mode === 'sitting') {
          this.mode = 'seated';
          this.bodyYaw = FRONT;
        } else {
          this.mode = 'free';
          this.leaveSeat();
        }
      }
    }

    // 점프 · 중력
    if (this.input.jump && this.mode === 'free' && this.pos.y === 0) this.vy = JUMP;
    this.input.jump = false;
    const air = this.pos.y > 0 || this.vy > 0;
    if (air) {
      this.vy -= GRAVITY * dt;
      this.pos.y += this.vy * dt;
      if (this.pos.y <= 0) { this.pos.y = 0; this.vy = 0; }
      active = true;
    }

    // 몸 방향: 걷는 쪽으로 돌고, 고개가 한계보다 더 돌아가면 몸이 따라 돈다 (마인크래프트 방식)
    const upright = this.mode === 'free' || this.mode === 'path';
    const sp = upright ? Math.hypot(this.vel.x, this.vel.z) : 0;
    const moving = sp > 0.2;
    if (moving) {
      let want = Math.atan2(this.vel.x, this.vel.z);
      if (this.mode === 'free' && Math.abs(wrap(want - this.lookYaw)) > 1.66) want += Math.PI;   // 뒷걸음질
      this.bodyYaw += wrap(want - this.bodyYaw) * (1 - Math.exp(-12 * dt));
    }
    if (upright) {
      const rel = wrap(this.lookYaw - this.bodyYaw);
      if (Math.abs(rel) > HEAD_TURN) this.bodyYaw = this.lookYaw - Math.sign(rel) * HEAD_TURN;
    }

    // 걷기·점프 동작의 세기
    this.walkAmt += ((moving ? 1 : 0) - this.walkAmt) * (1 - Math.exp(-10 * dt));
    this.airAmt += ((air ? 1 : 0) - this.airAmt) * (1 - Math.exp(-14 * dt));
    if (moving) this.walkPhase += (7 + sp * 2.4) * dt;

    this.applyPose();
    return active || this.walkAmt > 0.002 || this.airAmt > 0.002 || Math.abs(this.bodyYaw - yaw0) > 1e-4;
  }

  // 지금 상태를 3D 모델의 자세로 옮긴다
  applyPose() {
    const m = this.model, sit = this.sitAmt, up = 1 - sit;
    const swing = Math.sin(this.walkPhase) * this.walkAmt * up;
    m.legL.rotation.x = swing * 0.8 - 1.41 * sit;         // 앉으면 다리를 앞으로 뻗는다
    m.legR.rotation.x = -swing * 0.8 - 1.41 * sit;
    m.legL.rotation.y = 0.25 * sit;
    m.legR.rotation.y = -0.25 * sit;
    let lx = (-swing * 0.9 + ARM_SIT * sit) * (1 - this.wave);     // 앉으면 두 팔을 책상 위로, 손을 들 땐 한 팔을 옆으로
    let rx = swing * 0.9 + ARM_SIT * sit;
    let lz = this.airAmt * 2.0 + this.wave * 1.9;               // 점프하면 두 팔을 든다
    let rz = -this.airAmt * 2.0;
    const reach = this.reachAmt;                                // 쪽지를 주고받을 때 상대 쪽으로 팔을 뻗는다
    if (reach > 0) {
      if (this.reachSide > 0) { lx *= 1 - reach; lz += 1.35 * reach; }
      else if (this.reachSide < 0) { rx *= 1 - reach; rz -= 1.35 * reach; }
      else if (this.reachFwd > 1) rx += (-1.4 - rx) * reach;    // 리모컨으로 스크린을 가리킨다
      else if (this.reachFwd > 0) { lx -= 0.6 * reach; rx -= 0.6 * reach; }
      else rx += 2.3 * reach;                                   // 뒷자리: 한 팔을 뒤로 넘긴다
    }
    m.armL.rotation.x = lx;
    m.armR.rotation.x = rx;
    m.armL.rotation.z = lz;
    m.armR.rotation.z = rz;
    m.rig.position.y = Math.abs(Math.sin(this.walkPhase)) * 0.04 * this.walkAmt * up + SEAT_RISE * sit;

    // 고개는 시선을 따라간다 (몸통 기준 좌우 한계 안에서)
    m.head.rotation.y = clamp(wrap(this.lookYaw - this.bodyYaw), -HEAD_TURN, HEAD_TURN);
    m.head.rotation.x = clamp(this.lookPitch, -0.9, 0.9) * 0.6;
    m.head.rotation.z = swing * 0.05;

    m.root.position.copy(this.pos);
    m.root.rotation.y = this.bodyYaw;
    m.tag.position.y = AV.leg + AV.body + AV.head + 0.2 + m.rig.position.y;
    if (this.bubble) this.bubble.position.y = m.tag.position.y + 0.42;
    m.blob.position.x = this.pos.x;
    m.blob.position.z = this.pos.z;
    const bs = 0.8 * (1 - Math.min(this.pos.y, 1) * 0.45);
    m.blob.scale.set(bs, bs, 1);
  }

  // 머리 위에 말풍선을 띄우고 손을 든다 (질문 · 반응)
  say(text, ms, bg = '#fffdf2') {
    if (!this.bubble) {
      this.bubble = new THREE.Sprite(new THREE.SpriteMaterial({ depthWrite: false }));
      this.bubble.scale.set(1.7, 0.53, 1);
      this.model.root.add(this.bubble);
    }
    const mat = this.bubble.material;
    if (mat.map) mat.map.dispose();
    mat.map = makeTex(512, 160, (g) => {
      g.fillStyle = '#33241a';
      g.fillRect(0, 0, 512, 160);
      g.fillStyle = bg;
      g.fillRect(6, 6, 500, 148);
      g.fillStyle = '#33241a';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = `800 38px ${UI_FONT}`;
      const lines = [''];                       // 길면 두 줄로 나눈다
      for (const ch of text) {
        if (g.measureText(lines[lines.length - 1] + ch).width > 450 && lines.length < 2) lines.push('');
        lines[lines.length - 1] += ch;
      }
      lines.forEach((line, i) => g.fillText(line, 256, 80 + (i - (lines.length - 1) / 2) * 50, 470));
    }, { smooth: true });
    mat.needsUpdate = true;
    this.bubble.visible = !this.isSelf;
    this.bubbleUntil = performance.now() + ms;
    this.wave = 1;
    this.applyPose();
  }

  // 말풍선을 거둘 때가 됐으면 거두고 true
  tickBubble(now) {
    if (!this.bubble || !this.bubbleUntil || now < this.bubbleUntil) return false;
    this.bubble.visible = false;
    this.bubbleUntil = 0;
    this.wave = 0;
    this.applyPose();
    return true;
  }

  // 선생님은 오른손에 리모컨을 들고 있다
  setRemote(on) {
    if (on && !this.remote) {
      this.remote = remoteMesh();
      this.remote.position.set(0, -0.27, 0.06);
      this.remote.rotation.x = -1.35;
      this.model.armR.add(this.remote);
    }
    if (this.remote) this.remote.visible = on;
  }

  // 쪽지를 주고받을 상대가 내 몸 기준으로 어느 쪽에 있는지 정해 둔다
  reachTo(other) {
    const dx = other.pos.x - this.pos.x, dz = other.pos.z - this.pos.z;
    const s = Math.sin(this.bodyYaw), c = Math.cos(this.bodyYaw);
    const side = dx * c - dz * s, fwd = dx * s + dz * c;       // 왼팔 쪽 / 앞쪽으로 얼마나 떨어져 있나
    this.reachSide = Math.abs(side) > Math.abs(fwd) ? Math.sign(side) : 0;
    this.reachFwd = this.reachSide ? 0 : Math.sign(fwd);
  }

  blink(now) {
    const lids = this.model.lids;
    if (this.isSelf || !this.model.root.visible) return false;
    if (lids.visible) {
      if (now < this.blinkEnd) return false;
      lids.visible = false;
      this.nextBlink = now + 2200 + Math.random() * 2600;
      return true;
    }
    if (now < this.nextBlink) return false;
    lids.visible = true;
    this.blinkEnd = now + 130;
    return true;
  }
}

/* ───────────── 등장인물 ───────────── */
const actors = { roy: new Actor(CHARACTERS.roy), stella: new Actor(CHARACTERS.stella) };
actors.roy.place(-0.5, 4.4, 0);
actors.stella.place(0.5, 4.4, 0);

let chosen = 'roy';
let nickTouched = false;             // 이름 칸을 직접 고쳤는지 (안 고쳤으면 캐릭터 이름을 따라간다)
let player = actors.roy;             // 내가 조종하는 캐릭터
let mate = actors.stella;            // 강의실에 함께 있는 친구
let mateNext = null, mateTimer = 0;

function choose(who) {
  chosen = who;
  for (const key in actors) {
    const a = actors[key], on = key === who;
    a.wave = on ? 1 : 0;                         // 고른 캐릭터가 한 걸음 나와 손을 든다
    a.pos.z = on ? 4.75 : 4.4;
    a.applyPose();
  }
  document.querySelectorAll('.pick [data-who]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.who === who)));
  if (!nickTouched) $('nick').value = CHARACTERS[who].name;
